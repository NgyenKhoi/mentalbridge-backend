openapi: 3.1.0
info:
  title: Content-Notification Service API
  version: 1.0.0
  description: >
    MentalBridge Content/Notification bounded context.
    Manages self-help resources, crisis hotlines, in-app notifications,
    and delivery preferences.

servers:
  - url: http://localhost:3003
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Resources
    description: Self-help content management (admin reviewed)
  - name: Hotlines
    description: Crisis support hotline management

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe — checks database connectivity
      operationId: getReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: ok
                db: connected
        '503':
          description: Service unavailable — database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: unavailable
                db: disconnected

  /api/v1/resources:
    get:
      tags: [Resources]
      summary: List published self-help resources
      operationId: listResources
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            example: vi-VN
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ResourceCategory'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
              example:
                data:
                  - id: 123e4567-e89b-12d3-a456-426614174000
                    category: BREATHING
                    locale: vi-VN
                    title: Kỹ thuật thở 4-7-8
                    summary: Kỹ thuật thở giúp giảm căng thẳng
                    externalUrl: null
                    status: PUBLISHED
                    reviewedAt: '2024-01-15T10:00:00Z'
                    createdAt: '2024-01-15T09:00:00Z'
                    updatedAt: '2024-01-15T10:00:00Z'
                count: 1

    post:
      tags: [Resources]
      summary: Create a new resource (Admin)
      operationId: createResource
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                category: BREATHING
                locale: vi-VN
                title: Kỹ thuật thở 4-7-8
                summary: Kỹ thuật thở giúp giảm căng thẳng và lo âu
                externalUrl: null
                status: DRAFT
                reviewedAt: null
                createdAt: '2024-01-15T10:00:00Z'
                updatedAt: '2024-01-15T10:00:00Z'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Resources]
      summary: Get resource detail
      operationId: getResource
      responses:
        '200':
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Resources]
      summary: Update a DRAFT resource (Admin)
      operationId: updateResource
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Resources]
      summary: Delete a DRAFT resource (Admin)
      operationId: deleteResource
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/resources/{id}/publish:
    post:
      tags: [Resources]
      summary: Publish a DRAFT resource — reviewed content workflow (Admin)
      operationId: publishResource
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/resources/{id}/archive:
    post:
      tags: [Resources]
      summary: Archive a PUBLISHED resource (Admin)
      operationId: archiveResource
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/hotlines:
    get:
      tags: [Hotlines]
      summary: List active crisis hotlines
      operationId: listHotlines
      parameters:
        - name: countryCode
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: VN
        - name: locale
          in: query
          schema:
            type: string
            example: vi-VN
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of hotlines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlineListResponse'

    post:
      tags: [Hotlines]
      summary: Create a hotline (Admin)
      operationId: createHotline
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHotlineRequest'
      responses:
        '201':
          description: Hotline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlineSummary'
              example:
                id: 987e6543-e21b-34d5-b678-123456789abc
                countryCode: VN
                region: Ho Chi Minh City
                name: Đường dây nóng sức khỏe tâm thần
                phoneNumber: 1800-xxxx
                websiteUrl: https://example.com
                availabilityText: 24/7
                guidance: Hỗ trợ tâm lý khẩn cấp
                locale: vi-VN
                active: true
                verifiedAt: '2024-01-15T10:00:00Z'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/hotlines/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Hotlines]
      summary: Get hotline detail
      operationId: getHotline
      responses:
        '200':
          description: Hotline detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlineDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Hotlines]
      summary: Update hotline (Admin)
      operationId: updateHotline
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHotlineRequest'
      responses:
        '200':
          description: Updated hotline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlineSummary'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Hotlines]
      summary: Delete hotline (Admin)
      operationId: deleteHotline
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hotlines/{id}/deactivate:
    post:
      tags: [Hotlines]
      summary: Deactivate a hotline (Admin)
      operationId: deactivateHotline
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hotline deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotlineSummary'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by identity-service. Admin role enforcement will be
        implemented in Story 209 during identity-service integration.
        Story 208 defines the contract only.

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://mentalbridge.io/errors/RESOURCE_NOT_FOUND
            title: Resource not found
            status: 404
            code: RESOURCE_NOT_FOUND
            correlationId: 123e4567-e89b-12d3-a456-426614174000
    Conflict:
      description: State conflict or optimistic lock failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://mentalbridge.io/errors/INVALID_STATE_TRANSITION
            title: Cannot modify published resource
            status: 409
            code: INVALID_STATE_TRANSITION
            correlationId: 123e4567-e89b-12d3-a456-426614174000
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://mentalbridge.io/errors/VALIDATION_ERROR
            title: Validation failed
            status: 422
            code: VALIDATION_ERROR
            correlationId: 123e4567-e89b-12d3-a456-426614174000
            fieldViolations:
              - field: title
                message: Title is required
              - field: category
                message: Invalid category

  schemas:
    LiveResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        db:
          type: string
          enum: [connected, disconnected]

    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://mentalbridge.io/errors/RESOURCE_NOT_FOUND
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          example: 404
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        correlationId:
          type: string
          format: uuid
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
        fieldViolations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example:
            - field: title
              message: Title is required

    ResourceCategory:
      type: string
      enum: [BREATHING, MEDITATION, ARTICLE, VIDEO, JOURNALING, COMMUNITY]

    ResourceStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    ResourceSummary:
      type: object
      required: [id, category, locale, title, summary, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ResourceCategory'
        locale:
          type: string
        title:
          type: string
        summary:
          type: string
        externalUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ResourceStatus'
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceDetail:
      allOf:
        - $ref: '#/components/schemas/ResourceSummary'
        - type: object
          properties:
            contentBody:
              type: string
              nullable: true
            reviewedBy:
              type: string
              format: uuid
              nullable: true
            version:
              type: integer

    ResourceListResponse:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSummary'
        count:
          type: integer

    CreateResourceRequest:
      type: object
      required: [category, title, summary]
      properties:
        category:
          $ref: '#/components/schemas/ResourceCategory'
        locale:
          type: string
          default: vi-VN
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contentBody:
          type: string
          nullable: true
        externalUrl:
          type: string
          format: uri
          nullable: true

    UpdateResourceRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contentBody:
          type: string
          nullable: true
        externalUrl:
          type: string
          format: uri
          nullable: true

    HotlineSummary:
      type: object
      required: [id, countryCode, name, guidance, active, verifiedAt]
      properties:
        id:
          type: string
          format: uuid
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        region:
          type: string
          nullable: true
        name:
          type: string
        phoneNumber:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        availabilityText:
          type: string
          nullable: true
        guidance:
          type: string
        locale:
          type: string
        active:
          type: boolean
        verifiedAt:
          type: string
          format: date-time

    HotlineDetail:
      allOf:
        - $ref: '#/components/schemas/HotlineSummary'
        - type: object
          properties:
            nextReviewAt:
              type: string
              format: date-time
            verifiedBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    HotlineListResponse:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HotlineSummary'
        count:
          type: integer

    CreateHotlineRequest:
      type: object
      required: [countryCode, name, guidance]
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        region:
          type: string
          nullable: true
        name:
          type: string
          maxLength: 255
        phoneNumber:
          type: string
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        availabilityText:
          type: string
          nullable: true
        guidance:
          type: string
        locale:
          type: string
          default: vi-VN

    UpdateHotlineRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phoneNumber:
          type: string
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        availabilityText:
          type: string
          nullable: true
        guidance:
          type: string
        region:
          type: string
          nullable: true
