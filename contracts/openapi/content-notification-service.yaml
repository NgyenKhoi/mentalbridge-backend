openapi: 3.1.0
info:
  title: Content-Notification Service API
  version: 1.2.0
  description: >
    MentalBridge Content/Notification bounded context.
    Manages reviewed self-help resources, reviewed Vietnam safety-directory
    records, in-app notifications, and delivery preferences. The removed legacy
    hotline table is not restored; directory records use the ADR 0018 review,
    provenance, coverage, and 90-day verification model.

servers:
  - url: http://localhost:3003
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Resources
    description: Self-help content management with reviewed admin lifecycle and public eligibility boundaries
  - name: Safety directory
    description: Reviewed Vietnam area-directory administration and current area lookup

paths:
  /health/live:
    x-mentalbridge-status: implemented
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getLive
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"
              example:
                status: ok

  /health/ready:
    x-mentalbridge-status: implemented
    get:
      tags: [Health]
      summary: Readiness probe — checks database connectivity
      operationId: getReady
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ok
                db: connected
        "503":
          description: Service unavailable — database unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://mentalbridge.io/errors/DEPENDENCY_UNAVAILABLE
                title: Dependency unavailable
                status: 503
                code: DEPENDENCY_UNAVAILABLE

  /api/v1/resources:
    x-mentalbridge-status: implemented
    get:
      x-mentalbridge-operation-status: implemented
      tags: [Resources]
      summary: List active reviewed published self-help resources
      operationId: listResources
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            example: vi-VN
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ResourceCategory"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            Published reviewed resources. Returns empty array when none match.
            Returns fallback: unavailable with neutral message when service is unreachable.
            No hotline number or emergency dispatch claim is included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
              examples:
                published:
                  value:
                    data:
                      - id: 123e4567-e89b-12d3-a456-426614174000
                        category: BREATHING
                        locale: vi-VN
                        title: Kỹ thuật thở 4-7-8
                        summary: Kỹ thuật thở giúp giảm căng thẳng
                        externalUrl: null
                        status: PUBLISHED
                        reviewedAt: "2024-01-15T10:00:00Z"
                        createdAt: "2024-01-15T09:00:00Z"
                        updatedAt: "2024-01-15T10:00:00Z"
                    count: 1
                empty:
                  value:
                    data: []
                    count: 0
                unavailable:
                  value:
                    data: []
                    count: 0
                    fallback: unavailable
                    message: Tài nguyên hỗ trợ tạm thời không khả dụng. Vui lòng thử lại sau.
        "400":
          $ref: "#/components/responses/RequestRejected"

    post:
      x-mentalbridge-operation-status: implemented
      tags: [Resources]
      summary: Create a new resource (Admin)
      operationId: createResource
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSummary"
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                category: BREATHING
                locale: vi-VN
                title: Kỹ thuật thở 4-7-8
                summary: Kỹ thuật thở giúp giảm căng thẳng và lo âu
                externalUrl: null
                status: DRAFT
                reviewedAt: null
                createdAt: "2024-01-15T10:00:00Z"
                updatedAt: "2024-01-15T10:00:00Z"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/resources/admin/list:
    x-mentalbridge-status: implemented
    get:
      tags: [Resources]
      summary: List resources in every lifecycle state (Admin)
      operationId: listAdminResources
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Category"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ResourceStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of admin-visible resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceListResponse" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/resources/admin/{id}:
    x-mentalbridge-status: implemented
    get:
      tags: [Resources]
      summary: Get any resource lifecycle state (Admin)
      operationId: getAdminResource
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Full admin resource detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourceDetail" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/resources/{id}:
    x-mentalbridge-status: implemented
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Resources]
      summary: Get an active reviewed resource for one locale
      operationId: getResource
      parameters:
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicResourceDetail"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Resources]
      summary: Update a DRAFT resource (Admin)
      operationId: updateResource
      security:
        - BearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSummary"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [Resources]
      summary: Delete a DRAFT resource (Admin)
      operationId: deleteResource
      security:
        - BearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/resources/{id}/publish:
    x-mentalbridge-status: implemented
    post:
      tags: [Resources]
      summary: Publish a reviewed DRAFT resource (blocked pending MB-251 policy approval)
      operationId: publishResource
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ReviewApprovalRequired" }

  /api/v1/resources/{id}/archive:
    x-mentalbridge-status: implemented
    post:
      tags: [Resources]
      summary: Archive a PUBLISHED resource (Admin)
      operationId: archiveResource
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Resource archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSummary"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/resources/{id}/versions/{contentVersion}/eligibility-publications:
    x-mentalbridge-status: implemented
    post:
      tags: [Resources]
      summary: Publish immutable exact-version SupportPlan eligibility (Admin)
      operationId: publishResourceEligibility
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ContentVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishResourceEligibilityRequest"
      responses:
        "201":
          description: Immutable eligibility publication created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEligibilityPublication"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/resources/{id}/versions/{contentVersion}/eligibility-publications/withdrawal:
    x-mentalbridge-status: implemented
    post:
      tags: [Resources]
      summary: Withdraw an exact-version eligibility publication (Admin)
      operationId: withdrawResourceEligibility
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ContentVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawResourceEligibilityRequest"
      responses:
        "200":
          description: Eligibility publication withdrawn or an identical command replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEligibilityPublication"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /internal/v1/resource-eligibility:resolve:
    x-mentalbridge-status: implemented
    post:
      tags: [Resources]
      summary: Resolve exact-version resource eligibility for Care in one bounded batch
      description: >
        Care forwards the authenticated USER bearer credential and correlation ID.
        Results preserve request order. A successful provider response never infers
        eligibility from resource type, review, or publication alone. Dependency
        uncertainty is represented by HTTP 503; Care maps it to UNAVAILABLE and
        commits no proposal mutation.
      operationId: resolveResourceEligibility
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceEligibilityBatchRequest"
      responses:
        "200":
          description: Deterministic exact-version eligibility outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEligibilityBatchResponse"
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/safety-directory/admin/entries:
    x-mentalbridge-status: implemented
    get:
      tags: [Safety directory]
      summary: List directory records for administration
      operationId: listSafetyDirectoryEntriesForAdmin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All current administrative records, including inactive and stale entries
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/SafetyDirectoryAdminEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Safety directory]
      summary: Create an inactive unreviewed directory record
      operationId: createSafetyDirectoryEntry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyDirectoryEntryWrite" }
      responses:
        "201":
          description: Inactive unreviewed record created or identical command replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyDirectoryAdminEntry" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/safety-directory/admin/entries/{entryId}:
    x-mentalbridge-status: implemented
    patch:
      tags: [Safety directory]
      summary: Replace reviewed fields and invalidate prior review
      operationId: updateSafetyDirectoryEntry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryId"
        - $ref: "#/components/parameters/DirectoryVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SafetyDirectoryEntryWrite" }
      responses:
        "200":
          description: Record updated, deactivated, and returned to unreviewed state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyDirectoryAdminEntry" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/safety-directory/admin/entries/{entryId}/review:
    x-mentalbridge-status: implemented
    post:
      tags: [Safety directory]
      summary: Review, verify, and activate the exact directory version
      operationId: reviewSafetyDirectoryEntry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryId"
        - $ref: "#/components/parameters/DirectoryVersion"
      responses:
        "200":
          description: Exact record version reviewed, verified with server time, and activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyDirectoryAdminEntry" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/safety-directory/admin/entries/{entryId}/deactivate:
    x-mentalbridge-status: implemented
    post:
      tags: [Safety directory]
      summary: Deactivate a directory record without deleting review history
      operationId: deactivateSafetyDirectoryEntry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DirectoryEntryId"
        - $ref: "#/components/parameters/DirectoryVersion"
      responses:
        "200":
          description: Record is inactive; repeating against the current inactive version is safe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyDirectoryAdminEntry" }
        "400": { $ref: "#/components/responses/RequestRejected" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/safety-directory:lookup:
    x-mentalbridge-status: implemented
    post:
      tags: [Safety directory]
      summary: Resolve active reviewed current records for one deliberate coarse area
      operationId: lookupSafetyDirectory
      description: >
        Public read-only owner lookup used by Care. Manual text is matched only
        against reviewed area labels; no geocoding, proximity, or location sharing occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/SafetyDirectoryLookupRequest" }
      responses:
        "200":
          description: Current records or an explicit empty/invalid-area outcome
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SafetyDirectoryLookupResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key reused only for an unchanged logical create request by this actor.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    Locale:
      name: locale
      in: query
      schema:
        type: string
        pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
        default: vi-VN
    Category:
      name: category
      in: query
      schema: { $ref: "#/components/schemas/ResourceCategory" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, format: uuid }
    ContentVersion:
      name: contentVersion
      in: path
      required: true
      description: Exact non-negative 64-bit content version encoded as a JSON-safe decimal string.
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)$"
        maxLength: 19
    DirectoryEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DirectoryVersion:
      name: version
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by identity-service. Resource administration operations
        require the ADMIN role.

  responses:
    Unauthorized:
      description: Authentication is required or the credential is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Authenticated actor is not an administrator
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ServiceUnavailable:
      description: Resource administration is temporarily unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    IdempotencyConflict:
      description: The actor reused an idempotency key with a different create payload
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ReviewApprovalRequired:
      description: Publish is unavailable until an approved MB-251 review decision is recorded
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://mentalbridge.io/errors/RESOURCE_NOT_FOUND
            title: Resource not found
            status: 404
            code: RESOURCE_NOT_FOUND
            correlationId: 123e4567-e89b-12d3-a456-426614174000
    Conflict:
      description: State conflict or optimistic lock failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://mentalbridge.io/errors/INVALID_STATE_TRANSITION
            title: Cannot modify published resource
            status: 409
            code: INVALID_STATE_TRANSITION
            correlationId: 123e4567-e89b-12d3-a456-426614174000
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://mentalbridge.io/errors/VALIDATION_ERROR
            title: Validation failed
            status: 422
            code: VALIDATION_ERROR
            correlationId: 123e4567-e89b-12d3-a456-426614174000
            fieldViolations:
              - field: title
                message: Title is required
              - field: category
                message: Invalid category
    RequestRejected:
      description: Invalid query parameter
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://mentalbridge.io/errors/REQUEST_REJECTED
            title: Request rejected
            status: 400
            code: REQUEST_REJECTED
            correlationId: 123e4567-e89b-12d3-a456-426614174000

  schemas:
    SafetyDirectoryEntryType:
      type: string
      enum: [FACILITY, HOTLINE]
    SafetyDirectoryCoverageLevel:
      type: string
      enum: [NATIONWIDE, PROVINCE, DISTRICT]
    SafetyDirectoryCoverage:
      type: object
      additionalProperties: false
      required: [level, provinceCode, provinceName, districtCode, districtName]
      properties:
        level: { $ref: "#/components/schemas/SafetyDirectoryCoverageLevel" }
        provinceCode: { type: [string, "null"], minLength: 1, maxLength: 32 }
        provinceName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        districtCode: { type: [string, "null"], minLength: 1, maxLength: 32 }
        districtName: { type: [string, "null"], minLength: 1, maxLength: 120 }
    SafetyDirectoryEntryWrite:
      type: object
      additionalProperties: false
      required:
        [
          name,
          type,
          phone,
          address,
          coverage,
          sourceName,
          sourceReference,
          sourceRetrievedAt,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/SafetyDirectoryEntryType" }
        phone: { type: string, minLength: 1, maxLength: 64 }
        address: { type: [string, "null"], maxLength: 500 }
        coverage:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SafetyDirectoryCoverage" }
        sourceName: { type: string, minLength: 1, maxLength: 200 }
        sourceReference: { type: string, minLength: 1, maxLength: 2000 }
        sourceRetrievedAt: { type: string, format: date-time }
        sourceChecksum: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
    SafetyDirectoryReviewState:
      type: string
      enum: [UNREVIEWED, CURRENT, STALE, INACTIVE]
    SafetyDirectoryPublicEntry:
      type: object
      additionalProperties: false
      required:
        [
          directoryEntryId,
          name,
          type,
          phone,
          address,
          coverage,
          sourceName,
          sourceReference,
          reviewedAt,
          verifiedAt,
        ]
      properties:
        directoryEntryId: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/SafetyDirectoryEntryType" }
        phone: { type: string }
        address: { type: [string, "null"] }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/SafetyDirectoryCoverage" }
        sourceName: { type: string }
        sourceReference: { type: string }
        reviewedAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
    SafetyDirectoryAdminEntry:
      allOf:
        - $ref: "#/components/schemas/SafetyDirectoryPublicEntry"
        - type: object
          additionalProperties: true
          required:
            [
              recordVersion,
              active,
              reviewState,
              reviewedBy,
              verifiedBy,
              sourceRetrievedAt,
              sourceChecksum,
              seedKey,
              createdAt,
              updatedAt,
            ]
          properties:
            recordVersion: { type: integer, format: int64, minimum: 0 }
            active: { type: boolean }
            reviewState:
              { $ref: "#/components/schemas/SafetyDirectoryReviewState" }
            reviewedBy: { type: [string, "null"], format: uuid }
            verifiedBy: { type: [string, "null"], format: uuid }
            sourceRetrievedAt: { type: string, format: date-time }
            sourceChecksum:
              { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
            seedKey: { type: [string, "null"], maxLength: 128, readOnly: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SafetyDirectoryLookupRequest:
      type: object
      additionalProperties: false
      properties:
        provinceCode: { type: string, minLength: 1, maxLength: 32 }
        districtCode: { type: string, minLength: 1, maxLength: 32 }
        manualLocation: { type: string, minLength: 1, maxLength: 120 }
      oneOf:
        - required: [provinceCode]
        - required: [manualLocation]
    SafetyDirectoryLookupState:
      type: string
      enum: [RESULTS, EMPTY, INVALID_AREA]
    SafetyDirectoryLookupResponse:
      type: object
      additionalProperties: true
      required:
        [state, wording, resolvedProvinceCode, resolvedDistrictCode, entries]
      properties:
        state: { $ref: "#/components/schemas/SafetyDirectoryLookupState" }
        wording: { type: string, const: Cơ sở trong khu vực đã chọn }
        resolvedProvinceCode: { type: [string, "null"] }
        resolvedDistrictCode: { type: [string, "null"] }
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SafetyDirectoryPublicEntry" }
    LiveResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        db:
          type: string
          enum: [connected, disconnected]

    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://mentalbridge.io/errors/RESOURCE_NOT_FOUND
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          example: 404
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        correlationId:
          type: string
          format: uuid
          nullable: true
          example: 123e4567-e89b-12d3-a456-426614174000
        fieldViolations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example:
            - field: title
              message: Title is required

    ResourceCategory:
      type: string
      enum: [BREATHING, MEDITATION, ARTICLE, VIDEO, JOURNALING, COMMUNITY]

    ResourceStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    ResourceSummary:
      type: object
      required: [id, category, locale, title, summary, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ResourceCategory"
        locale:
          type: string
        title:
          type: string
        summary:
          type: string
        externalUrl:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ResourceStatus"
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicResourceDetail:
      allOf:
        - $ref: "#/components/schemas/ResourceSummary"
        - type: object
          required: [contentBody, effectiveAt, expiresAt]
          properties:
            contentBody:
              type: string
              nullable: true
            effectiveAt:
              type: string
              format: date-time
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true

    AdminResourceDetail:
      allOf:
        - $ref: "#/components/schemas/PublicResourceDetail"
        - type: object
          required: [reviewedBy, version]
          properties:
            reviewedBy:
              type: string
              format: uuid
              nullable: true
            version:
              type: integer

    ResourceListResponse:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSummary"
        count:
          type: integer
        nextCursor:
          type: string
          format: uuid
          description: Cursor for the next page; absent when no more results.
        fallback:
          type: string
          enum: [unavailable]
          description: >
            Present only when Content/Notification is unavailable.
            No hotline number or emergency dispatch claim is included.
        message:
          type: string
          description: Neutral fallback message when fallback is unavailable.

    CreateResourceRequest:
      type: object
      required: [category, title, summary]
      properties:
        category:
          $ref: "#/components/schemas/ResourceCategory"
        locale:
          type: string
          default: vi-VN
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contentBody:
          type: string
          nullable: true
        externalUrl:
          type: string
          format: uri
          pattern: "^https?://"
          nullable: true
        effectiveAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    UpdateResourceRequest:
      type: object
      properties:
        locale:
          type: string
          pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        contentBody:
          type: string
          nullable: true
        externalUrl:
          type: string
          format: uri
          pattern: "^https?://"
          nullable: true
        effectiveAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    EligibilityPolicyVersion:
      type: string
      enum: [content-eligibility-v1]

    ScreeningDomain:
      type: string
      description: V1 screening domains only; GENERAL_WELLBEING and BOTH_SCREENED_DOMAINS are invalid.
      enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS]

    EligibilityRole:
      type: string
      enum: [PRIMARY, ADJUNCT]

    RequiredEligibilityRole:
      type: string
      description: PRIMARY_OR_ADJUNCT is valid only for an optional SupportPlan slot.
      enum: [PRIMARY, PRIMARY_OR_ADJUNCT]

    ScreeningInstrument:
      type: string
      enum: [PHQ_9, GAD_7]

    ScreeningLevel:
      type: string
      enum: [MINIMAL, MILD, MODERATE, MODERATELY_SEVERE, SEVERE]

    SupportTier:
      type: string
      enum:
        [
          SELF_GUIDED_SUPPORT,
          PROFESSIONAL_SUPPORT_RECOMMENDED,
          SAFETY_FOLLOW_UP_RECOMMENDED,
        ]

    EligibilityPublicationState:
      type: string
      enum: [PUBLISHED, WITHDRAWN]

    EligibilityDeclaration:
      type: object
      additionalProperties: false
      required: [targetDomain, role, instrument, screeningLevels, supportTiers]
      properties:
        targetDomain:
          $ref: "#/components/schemas/ScreeningDomain"
        role:
          $ref: "#/components/schemas/EligibilityRole"
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        screeningLevels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ScreeningLevel"
        supportTiers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SupportTier"

    PublishResourceEligibilityRequest:
      type: object
      additionalProperties: false
      required: [policyVersion, locale, effectiveAt, declarations]
      properties:
        policyVersion:
          $ref: "#/components/schemas/EligibilityPolicyVersion"
        locale:
          type: string
          pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        declarations:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/EligibilityDeclaration"

    WithdrawResourceEligibilityRequest:
      type: object
      additionalProperties: false
      required: [policyVersion, reasonCode]
      properties:
        policyVersion:
          $ref: "#/components/schemas/EligibilityPolicyVersion"
        reasonCode:
          type: string
          enum: [CONTENT_WITHDRAWN, POLICY_WITHDRAWN, SUPERSEDED]

    ResourceEligibilityPublication:
      type: object
      additionalProperties: true
      required:
        [
          publicationId,
          resourceId,
          contentVersion,
          policyVersion,
          locale,
          state,
          effectiveAt,
          declarations,
          publishedAt,
        ]
      properties:
        publicationId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        contentVersion:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        policyVersion:
          $ref: "#/components/schemas/EligibilityPolicyVersion"
        locale:
          type: string
        state:
          $ref: "#/components/schemas/EligibilityPublicationState"
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        declarations:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityDeclaration"
        publishedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        withdrawalReasonCode:
          type: string
          nullable: true
          enum: [CONTENT_WITHDRAWN, POLICY_WITHDRAWN, SUPERSEDED]

    ResourceEligibilityQuery:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          resourceId,
          contentVersion,
          targetDomain,
          requiredRole,
          instrument,
          screeningLevel,
          supportTier,
          locale,
        ]
      properties:
        requestId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        contentVersion:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          maxLength: 19
        targetDomain:
          $ref: "#/components/schemas/ScreeningDomain"
        requiredRole:
          $ref: "#/components/schemas/RequiredEligibilityRole"
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        screeningLevel:
          $ref: "#/components/schemas/ScreeningLevel"
        supportTier:
          $ref: "#/components/schemas/SupportTier"
        locale:
          type: string
          pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"

    ResourceEligibilityBatchRequest:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ResourceEligibilityQuery"

    ResourceEligibilityOutcome:
      type: string
      description: UNAVAILABLE is a Care fail-closed fallback and is never emitted in a provider HTTP 200 response.
      enum: [ELIGIBLE, INELIGIBLE, STALE, WITHDRAWN, NOT_FOUND, UNAVAILABLE]

    ResourceEligibilityReasonCode:
      type: string
      enum:
        - ELIGIBLE_MATCH
        - RESOURCE_NOT_FOUND
        - CONTENT_VERSION_STALE
        - NO_ELIGIBILITY_PUBLICATION
        - DOMAIN_OR_PATHWAY_NOT_ELIGIBLE
        - PRIMARY_REQUIRED
        - NOT_YET_EFFECTIVE
        - EFFECTIVE_WINDOW_ENDED
        - RESOURCE_ARCHIVED
        - RESOURCE_NOT_PUBLISHED
        - LOCALE_MISMATCH
        - ELIGIBILITY_WITHDRAWN
        - DEPENDENCY_UNAVAILABLE

    ResourceEligibilityResult:
      type: object
      additionalProperties: true
      required: [requestId, resourceId, contentVersion, outcome, reasonCode]
      properties:
        requestId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        contentVersion:
          type: string
        outcome:
          $ref: "#/components/schemas/ResourceEligibilityOutcome"
        reasonCode:
          $ref: "#/components/schemas/ResourceEligibilityReasonCode"
        role:
          allOf:
            - $ref: "#/components/schemas/EligibilityRole"
          nullable: true
        publicationId:
          type: string
          format: uuid
          nullable: true
        category:
          allOf:
            - $ref: "#/components/schemas/ResourceCategory"
          nullable: true
          description: Present only for an eligible exact version so Care can persist the approved display snapshot.
        title:
          type: string
          nullable: true
          maxLength: 255
        summary:
          type: string
          nullable: true
        externalUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          pattern: "^https?://"

    ResourceEligibilityBatchResponse:
      type: object
      additionalProperties: true
      required: [policyVersion, resolvedAt, results]
      properties:
        policyVersion:
          $ref: "#/components/schemas/EligibilityPolicyVersion"
        resolvedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEligibilityResult"
