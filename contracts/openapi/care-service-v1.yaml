      properties:
        schemaVersion: { type: string, const: support-plan-companion-message-v1 }
        supportPlanId: { type: string, format: uuid }
        actionId: { type: string, format: uuid }
        intent: { type: string, const: EXPLAIN_ACTION }
        surface: { type: string, enum: [TODAY, PLAN] }
        text: { type: string, minLength: 1, maxLength: 480 }
        delivery: { type: string, enum: [GENERATED, TEMPLATE] }
        policyVersion: { type: string, const: support-plan-companion-policy-v1 }
        promptVersion: { type: string, const: support-plan-companion-prompt-v1 }
        templateVersion: { type: string, const: support-plan-companion-template-v1 }
        provider:
          type: [string, 'null']
          enum: [DETERMINISTIC_FAKE, GEMINI, OPENAI, BEDROCK, null]
        model: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        fallbackReason:
          type: [string, 'null']
          enum: [CONSENT_REQUIRED, CONSENT_UNAVAILABLE, PROVIDER_DISABLED, PROVIDER_TIMEOUT,
            PROVIDER_QUOTA_LIMITED, PROVIDER_UNAVAILABLE, MALFORMED_OUTPUT, POLICY_REJECTED, null]
      allOf:
        - if: { properties: { delivery: { const: GENERATED } }, required: [delivery] }
          then:
            properties:
              provider: { type: string, enum: [DETERMINISTIC_FAKE, GEMINI, OPENAI, BEDROCK] }
              model: { type: string, minLength: 1, maxLength: 2048 }
              fallbackReason: { type: 'null' }
        - if: { properties: { delivery: { const: TEMPLATE } }, required: [delivery] }
          then:
            properties:
              fallbackReason:
                type: string
                enum: [CONSENT_REQUIRED, CONSENT_UNAVAILABLE, PROVIDER_DISABLED, PROVIDER_TIMEOUT,
                  PROVIDER_QUOTA_LIMITED, PROVIDER_UNAVAILABLE, MALFORMED_OUTPUT, POLICY_REJECTED]
    SupportPlanV3:
      type: object
      additionalProperties: false
      description: |
        Canonical v3 representation. V2_RESOURCE_ADAPTER retains the bounded
        system-copy display encoding erratum described by SupportPlan without
        rewriting the v2 snapshot. Native v3 authored copy is not decoded.
      required: [supportPlanId, modelVersion, planPolicyVersion, representationMode, status, version, safety, focuses,
        createdAt, updatedAt, activatedAt, completedAt, completionReason, supersededAt,
        discardedAt, disclaimerCode, disclaimer]
      properties:
        supportPlanId: { type: string, format: uuid }
        modelVersion: { type: integer, const: 3 }
        planPolicyVersion:
          type: string
          minLength: 1
          maxLength: 128
          description: Native v3 policy version (support-plan-proposal-v1 for new proposals) or the exact v2 selection policy exposed by the adapter.
        representationMode:
          type: string
          enum: [V2_RESOURCE_ADAPTER, NATIVE_V3]
          description: Identifies a non-destructive v2 read projection or canonical v3 storage.
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, SUPERSEDED, DISCARDED] }
        version: { type: integer, minimum: 0 }
        safety: { $ref: '#/components/schemas/SupportPlanSafety' }
        cycle:
          description: Additive optional bounded review cycle, present only on support-plan-proposal-v1 plans and omitted otherwise so existing strict clients keep reading earlier plans unchanged. Clients also accept null.
          oneOf:
            - { $ref: '#/components/schemas/SupportPlanCycle' }
            - { type: 'null' }
        focuses:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PlanFocus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        completionReason:
          type: [string, 'null']
          enum: [USER_DECISION, PLAN_NO_LONGER_FITS, OTHER, null]
          description: Optional user-selected plan reason; never evidence of recovery.
        supersededAt: { type: [string, 'null'], format: date-time }
        discardedAt: { type: [string, 'null'], format: date-time }
        disclaimerCode: { type: string, const: WELLBEING_SUPPORT_NOT_TREATMENT }
        disclaimer: { type: string, minLength: 1, maxLength: 1000 }
    SupportPlanCycle:
      type: object
      additionalProperties: false
      description: |
        support-plan-cycle-v1 applies only to support-plan-proposal-v1 plans.
        Day 1 is the activation or explicit continuation local date. Paused days
        are calendar days from the pause date up to but excluding the resume
        date, in the cycle timezone; an ongoing pause uses today's local date
        as the exclusive end. These days do not advance the cycle. A pause
        beginning on or after the review date does not move it or add paused days.
        reviewDueOn is startedOn + 13 days + pausedDays. REVIEW_DUE changes no
        lifecycle state and remains until an explicit owner keep/change command.
        NOT_STARTED is a DRAFT; CLOSED is COMPLETED, SUPERSEDED or DISCARDED.
      required: [policyVersion, lengthDays, timezone, cycleNumber, startedOn, reviewDueOn, currentDay, pausedDays, state]
      properties:
        policyVersion: { type: string, const: support-plan-cycle-v1 }
        lengthDays: { type: integer, const: 14 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        cycleNumber: { type: integer, minimum: 1 }
        startedOn: { type: [string, 'null'], format: date }
        reviewDueOn: { type: [string, 'null'], format: date }
        currentDay: { type: [integer, 'null'], minimum: 1 }
        pausedDays: { type: integer, minimum: 0 }
        state: { type: string, enum: [NOT_STARTED, IN_PROGRESS, PAUSED, REVIEW_DUE, CLOSED] }
    PlanFocus:
      type: object
      additionalProperties: false
      required: [focusId, title, rationale, personalizationProvenance, ordinal, actions]
      properties:
        focusId:
          type: string
          minLength: 1
          maxLength: 128
          description: Native identity or stable virtual identity when adapted from v2.
        title: { type: string, minLength: 1, maxLength: 255 }
        rationale: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        personalizationProvenance:
          description: Exact preference revision that shaped this focus; null for deterministic fallback focuses.
          oneOf:
            - { $ref: '#/components/schemas/FocusPersonalizationProvenance' }
            - { type: 'null' }
        ordinal: { type: integer, minimum: 1, maximum: 20 }
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PlanAction' }
    PlanAction:
      type: object
      additionalProperties: false
      required: [actionId, actionType, actionVersion, representationMode, status, pathRole, purposeCode,
        rationale, ordinal, source, provenance, presentation, schedules, createdAt, updatedAt,
        activatedAt, endedAt]
      properties:
        actionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Native identity, existing v2 slot identity, or a stable deterministic virtual identity produced by the read adapter.
        actionType:
          type: string
          enum: [RESOURCE, JOURNAL, EMOTION_CHECK_IN, ROUTINE_SELF_MANAGEMENT,
            PROFESSIONAL_SUPPORT, REASSESSMENT_SCREENING, SELF_REPORT_REVIEW]
        actionVersion: { type: integer, minimum: 0 }
        representationMode: { type: string, enum: [V2_RESOURCE_ADAPTER, NATIVE_V3] }
        status: { type: string, enum: [DRAFT, ACTIVE, ENDED] }
        pathRole:
          type: string
          enum: [PRIMARY, ADJUNCT]
          description: PRIMARY is the recommended path; ADJUNCT complements it and never replaces professional support. In a native focus, a non-ended PROFESSIONAL_SUPPORT action is primary and its sibling actions are adjunct; without that context actions are primary. purposeCode is never used to classify this role.
        purposeCode: { type: string, minLength: 1, maxLength: 64 }
        rationale: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        ordinal: { type: integer, minimum: 1, maximum: 20 }
        source:
          description: Null only when the Care-owned action has no source-domain object.
          oneOf:
            - { $ref: '#/components/schemas/ActionSourceReference' }
            - { type: 'null' }
        provenance: { $ref: '#/components/schemas/ActionProvenance' }
        presentation: { $ref: '#/components/schemas/ActionPresentationMetadata' }
        schedules:
          type: array
          maxItems: 50
          description: Versioned current and ended rules; occurrence history is read separately.
          items: { $ref: '#/components/schemas/ActionSchedule' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
      allOf:
        - if: { properties: { actionType: { const: RESOURCE } }, required: [actionType] }
          then:
            properties:
              source:
                allOf:
                  - { $ref: '#/components/schemas/ActionSourceReference' }
                  - properties:
                      ownerDomain: { const: CONTENT }
                      sourceKind: { const: RESOURCE_VERSION }
        - if: { properties: { actionType: { const: JOURNAL } }, required: [actionType] }
          then:
            properties:
              source:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/ActionSourceReference' }
                      - properties:
                          ownerDomain: { const: JOURNAL_AI }
                          sourceKind: { const: JOURNAL_TEMPLATE }
        - if: { properties: { actionType: { const: EMOTION_CHECK_IN } }, required: [actionType] }
          then:
            properties:
              source:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/ActionSourceReference' }
                      - properties:
                          ownerDomain: { const: JOURNAL_AI }
                          sourceKind: { const: EMOTION_CHECK_IN_CAPABILITY }
        - if:
            properties:
              actionType: { enum: [ROUTINE_SELF_MANAGEMENT, SELF_REPORT_REVIEW] }
            required: [actionType]
          then: { properties: { source: { type: 'null' } } }
        - if: { properties: { actionType: { const: PROFESSIONAL_SUPPORT } }, required: [actionType] }
          then:
            properties:
              source:
                allOf:
                  - { $ref: '#/components/schemas/ActionSourceReference' }
                  - properties:
                      ownerDomain: { const: CONSULTATION }
                      sourceKind: { enum: [PROFESSIONAL_SUPPORT_PATHWAY, APPOINTMENT] }
        - if: { properties: { actionType: { const: REASSESSMENT_SCREENING } }, required: [actionType] }
          then:
            properties:
              source:
                allOf:
                  - { $ref: '#/components/schemas/ActionSourceReference' }
                  - properties:
                      ownerDomain: { const: CARE }
                      sourceKind: { const: QUESTIONNAIRE_DEFINITION }
    ActionSourceReference:
      type: object
      additionalProperties: false
      required: [ownerDomain, sourceKind, sourceId, sourceRevision, sourcePolicyVersion,
        publicationId, eligibilityPolicyVersion, verifiedAt]
      properties:
        ownerDomain: { type: string, enum: [CONTENT, JOURNAL_AI, CONSULTATION, CARE] }
        sourceKind:
          type: string
          enum: [RESOURCE_VERSION, JOURNAL_TEMPLATE, EMOTION_CHECK_IN_CAPABILITY,
            PROFESSIONAL_SUPPORT_PATHWAY, APPOINTMENT, QUESTIONNAIRE_DEFINITION]
        sourceId:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque owner-domain identifier; it does not contain source payload data.
        sourceRevision: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        sourcePolicyVersion: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        publicationId: { type: [string, 'null'], format: uuid }
        eligibilityPolicyVersion: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        verifiedAt: { type: [string, 'null'], format: date-time }
      allOf:
        - if:
            properties:
              sourceKind: { const: RESOURCE_VERSION }
            required: [sourceKind]
          then:
            properties:
              ownerDomain: { const: CONTENT }
              sourceRevision: { type: string, pattern: '^[0-9]+$' }
              publicationId: { type: string, format: uuid }
              eligibilityPolicyVersion: { type: string, minLength: 1, maxLength: 128 }
              verifiedAt: { type: string, format: date-time }
        - if:
            properties:
              sourceKind: { const: JOURNAL_TEMPLATE }
            required: [sourceKind]
          then:
            properties:
              ownerDomain: { const: JOURNAL_AI }
        - if:
            properties:
              sourceKind: { const: EMOTION_CHECK_IN_CAPABILITY }
            required: [sourceKind]
          then:
            properties:
              ownerDomain: { const: JOURNAL_AI }
        - if:
            properties:
              sourceKind: { enum: [PROFESSIONAL_SUPPORT_PATHWAY, APPOINTMENT] }
            required: [sourceKind]
          then:
            properties:
              ownerDomain: { const: CONSULTATION }
        - if:
            properties:
              sourceKind: { const: QUESTIONNAIRE_DEFINITION }
            required: [sourceKind]
          then:
            properties:
              ownerDomain: { const: CARE }
    ActionProvenance:
      type: object
      additionalProperties: false
      required: [category, referenceId, referenceVersion, acceptedAt]
      properties:
        category: { type: string, enum: [USER_SELECTED, SUPPORT_GUIDE, SPECIALIST, SYSTEM_POLICY] }
        referenceId: { type: [string, 'null'], minLength: 1, maxLength: 255 }
        referenceVersion: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        acceptedAt: { type: string, format: date-time }
      oneOf:
        - properties:
            referenceId: { type: 'null' }
            referenceVersion: { type: 'null' }
        - properties:
            referenceId: { type: string, minLength: 1, maxLength: 255 }
            referenceVersion: { type: string, minLength: 1, maxLength: 128 }
    ActionPresentationMetadata:
      type: object
      additionalProperties: false
      required: [title, summary, instructions, externalUrl]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        summary: { type: [string, 'null'], minLength: 1, maxLength: 4096 }
        instructions: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        externalUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: Optional reviewed navigation target; visiting it never proves completion.
    ActionSchedule:
      type: object
      additionalProperties: false
      required: [scheduleId, version, schedulePolicyVersion, recurrenceType, recurrenceDayOfWeek,
        daysOfWeek, preferredDaypart, estimatedDurationMinutes, localTime, timezone,
        effectiveFrom, effectiveUntil, reminderEnabled, status]
      properties:
        scheduleId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        schedulePolicyVersion: { type: string, minLength: 1, maxLength: 128 }
        recurrenceType: { type: string, enum: [ONCE, DAILY, WEEKLY] }
        recurrenceDayOfWeek: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        daysOfWeek:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        preferredDaypart:
          type: [string, 'null']
          enum: [MORNING, AFTERNOON, EVENING, FLEXIBLE, null]
        estimatedDurationMinutes:
          type: [integer, 'null']
          minimum: 5
          maximum: 180
          multipleOf: 5
        localTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$', description: Local wall time without an offset; timezone supplies the IANA zone. }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        effectiveFrom: { type: string, format: date }
        effectiveUntil: { type: [string, 'null'], format: date }
        reminderEnabled: { type: boolean }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
    UpdateActionScheduleRequest:
      type: object
      additionalProperties: false
      required: [schedule]
      properties:
        schedule:
          description: Null removes future workload without marking non-completion or failure.
          oneOf:
            - { $ref: '#/components/schemas/ActionScheduleInput' }
            - { type: 'null' }
    ActionScheduleInput:
      type: object
      additionalProperties: false
      required: [recurrenceType, daysOfWeek, preferredDaypart, localTime,
        estimatedDurationMinutes, timezone, effectiveFrom, effectiveUntil, reminderEnabled]
      properties:
        recurrenceType: { type: string, enum: [ONCE, DAILY, WEEKLY] }
        daysOfWeek:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: Required and non-empty for WEEKLY; empty for ONCE and DAILY.
        preferredDaypart:
          type: [string, 'null']
          enum: [MORNING, AFTERNOON, EVENING, FLEXIBLE, null]
          description: Null means the user chose an exact local time instead of a daypart default.
        localTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$', description: Local wall time without an offset; timezone supplies the IANA zone. }
        estimatedDurationMinutes:
          type: integer
          minimum: 5
          maximum: 180
          multipleOf: 5
        timezone: { type: string, minLength: 1, maxLength: 64 }
        effectiveFrom: { type: string, format: date }
        effectiveUntil: { type: [string, 'null'], format: date }
        reminderEnabled: { type: boolean }
    NativeSupportPlanReplacementReview:
      type: object
      additionalProperties: false
      required: [outcome, rationaleCodes, currentPlan, proposedPlan, reassessmentSummary, reviewedAt]
      properties:
        outcome:
          type: string
          enum: [CURRENT_PLAN_VALID_NO_BETTER_ALTERNATIVE,
            CURRENT_PLAN_VALID_ALTERNATIVES_AVAILABLE, CURRENT_PLAN_NOT_ADMISSIBLE]
        rationaleCodes:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 128 }
        currentPlan: { $ref: '#/components/schemas/SupportPlanV3' }
        proposedPlan: { $ref: '#/components/schemas/SupportPlanV3' }
        reassessmentSummary: { $ref: '#/components/schemas/ReassessmentSummary' }
        reviewedAt: { type: string, format: date-time }
    AdaptiveSupportPlanReview:
      type: object
      additionalProperties: false
      description: |
        support-plan-review-v1 adaptive review. Each evidence source stays separate
        with its own availability, period and provenance; nothing is combined into
        a wellbeing, recovery or adherence score or verdict. Options are bounded,
        Care-admitted and explain their supporting and conflicting evidence.
      required: [schemaVersion, policyVersion, supportPlanId, planVersion, planStatus, cycle,
        reviewedAt, programPeriod, reviewState, reassessment, currentAdmission, outcome,
        patterns, contradictions, options, unavailableOptions, reviewFingerprint]
      properties:
        schemaVersion: { type: string, const: adaptive-support-plan-review-v1 }
        policyVersion: { type: string, const: support-plan-review-v1 }
        supportPlanId: { type: string, format: uuid }
        planVersion: { type: integer, minimum: 0 }
        planStatus: { type: string, enum: [ACTIVE, PAUSED] }
        cycle:
          oneOf:
            - { $ref: '#/components/schemas/SupportPlanCycle' }
            - { type: 'null' }
        reviewedAt: { type: string, format: date-time }
        programPeriod: { $ref: '#/components/schemas/AdaptiveReviewProgramPeriod' }
        reviewState:
          type: string
          enum: [EARLY, REVIEW_DUE, PAUSED]
          description: EARLY is a factual review before the cycle checkpoint or on a plan without a cycle; it never claims a full program elapsed.
        reassessment: { $ref: '#/components/schemas/AdaptiveReviewReassessment' }
        currentAdmission:
          type: string
          enum: [ADMISSIBLE, INADMISSIBLE, UNAVAILABLE]
          description: UNAVAILABLE means admission could not be checked now; it is never treated as proven inadmissible.
        outcome:
          type: [string, 'null']
          enum: [CURRENT_PLAN_VALID_NO_BETTER_ALTERNATIVE, CURRENT_PLAN_VALID_ALTERNATIVES_AVAILABLE, CURRENT_PLAN_NOT_ADMISSIBLE, null]
          description: Null while currentAdmission is UNAVAILABLE.
        patterns:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AdaptiveReviewPattern' }
        contradictions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AdaptiveReviewContradiction' }
        options:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AdaptiveReviewOption' }
        unavailableOptions:
          type: array
          maxItems: 6
          description: Option kinds Care could not offer now, with a closed reason; no candidate is invented.
          items: { $ref: '#/components/schemas/AdaptiveReviewUnavailableOption' }
        reviewFingerprint:
          type: string
          minLength: 16
          maxLength: 128
          description: Opaque hash of the decision context. Confirm compares it after recomputation.
        evidenceContext:
          $ref: '#/components/schemas/AdaptiveReviewEvidenceContext'
    AdaptiveReviewEvidenceContext:
      type: object
      additionalProperties: false
      description: |
        Current Care evidence remains available without a composed summary. UTC comparison
        windows are separate from programPeriod. Reusable sources contain exact native
        action and occurrence revisions; private activity reflection text is excluded.
        The embedded summary is a display projection with withdrawn sources masked;
        stored immutable summaries and their history remain unchanged.
      required: [comparisonPolicyVersion, previousPeriod, currentPeriod, timezone, selfReportedExperience, engagementSources]
      properties:
        comparisonPolicyVersion: { type: string }
        previousPeriod: { $ref: '#/components/schemas/ReassessmentPeriod' }
        currentPeriod: { $ref: '#/components/schemas/ReassessmentPeriod' }
        timezone: { type: string, const: UTC }
        selfReportedExperience: { $ref: '#/components/schemas/ReassessmentSelfReportedExperienceDimension' }
        engagementSources:
          type: array
          items: { $ref: '#/components/schemas/AdaptiveReviewEngagementSource' }
    AdaptiveReviewEngagementSource:
      type: object
      additionalProperties: false
      required: [occurrenceId, occurrenceVersion, actionId, actionVersion, supportPlanId, sourcePlanVersion,
        sourceSlotId, sourceResourceId, sourceContentVersion, scheduledAt, state, helpfulness, barrierCode, engagementUpdatedAt]
      properties:
        occurrenceId: { type: string, format: uuid }
        occurrenceVersion: { type: integer, minimum: 0 }
        actionId: { type: [string, 'null'], format: uuid }
        actionVersion: { type: [integer, 'null'], minimum: 0 }
        supportPlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, minimum: 0 }
        sourceSlotId: { type: [string, 'null'] }
        sourceResourceId: { type: [string, 'null'], format: uuid }
        sourceContentVersion: { type: [integer, 'null'], minimum: 0 }
        scheduledAt: { type: string, format: date-time }
        state: { type: string, enum: [COMPLETED, SKIPPED] }
        helpfulness: { type: [string, 'null'] }
        barrierCode: { type: [string, 'null'] }
        engagementUpdatedAt: { type: [string, 'null'], format: date-time }
    AdaptiveReviewProgramPeriod:
      type: object
      additionalProperties: false
      description: Actual plan participation period in the cycle timezone. Missed occurrences never move dates; only pauses do.
      required: [startedOn, asOf, timezone, elapsedDays, pausedDays, fullCycleElapsed, scheduledCount, completedCount, skippedCount, openCount]
      properties:
        startedOn: { type: string, format: date }
        asOf: { type: string, format: date }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        elapsedDays: { type: integer, minimum: 1 }
        pausedDays: { type: integer, minimum: 0 }
        fullCycleElapsed: { type: boolean }
        scheduledCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        openCount:
          type: integer
          minimum: 0
          description: Past occurrences with no recorded outcome; factual, never a failure.
    AdaptiveReviewReassessment:
      type: object
      additionalProperties: false
      required: [state, reasonCode, summary]
      properties:
        state:
          type: string
          enum: [AVAILABLE, NOT_STARTED, INCOMPLETE, STALE, UNAVAILABLE]
          description: |
            AVAILABLE has a current canonical reassessment-summary-v2. NOT_STARTED and
            INCOMPLETE mean the paired PHQ-9/GAD-7 or canonical summary is missing; self-report is optional. STALE means
            the latest summary is older than the replacement window; UNAVAILABLE means a
            dependency failed. Only AVAILABLE allows replacement options.
        reasonCode: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        summary:
          description: The owned canonical four-dimension snapshot; null unless AVAILABLE or STALE.
          oneOf:
            - { $ref: '#/components/schemas/ReassessmentSummary' }
            - { type: 'null' }
    AdaptiveReviewEvidenceRef:
      type: object
      additionalProperties: false
      required: [source, refId]
      properties:
        source:
          type: string
          enum: [SCREENING_PHQ9, SCREENING_GAD7, JOURNAL_CONTEXT, PLAN_ENGAGEMENT, SELF_REPORTED_EXPERIENCE, ACTIVITY_REFLECTION, PATTERN, PREFERENCES]
        refId:
          type: [string, 'null']
          maxLength: 128
          description: Source identity (assessment, analysis, report, occurrence or pattern id) when one exists.
    AdaptiveReviewPattern:
      type: object
      additionalProperties: false
      description: |
        Practical pattern from explicitly reusable occurrence feedback. A repeat is at
        least two distinct occurrences of the same code for the same action in the
        period. Never a clinical or adherence ratio.
      required: [patternId, kind, code, actionId, actionTitle, count, occurrenceIds]
      properties:
        patternId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [REPEATED_BARRIER, REPEATED_HELPFUL] }
        code: { type: string, enum: [NOT_ENOUGH_TIME, LOW_ENERGY, NOT_A_GOOD_FIT, HELPFUL] }
        actionId: { type: string, format: uuid }
        actionTitle: { type: string, minLength: 1, maxLength: 255 }
        count: { type: integer, minimum: 2 }
        occurrenceIds:
          type: array
          minItems: 2
          maxItems: 31
          items: { type: string, format: uuid }
    AdaptiveReviewContradiction:
      type: object
      additionalProperties: false
      description: Deterministic disagreement between sources, kept visible and unresolved.
      required: [contradictionId, kind, evidenceRefs]
      properties:
        contradictionId: { type: string, minLength: 1, maxLength: 128 }
        kind:
          type: string
          enum: [INSTRUMENT_DIRECTIONS_DIFFER, SELF_REPORT_DIFFERS_FROM_SCREENING, JOURNAL_DIFFERS_FROM_SCREENING]
        evidenceRefs:
          type: array
          minItems: 2
          maxItems: 6
          items: { $ref: '#/components/schemas/AdaptiveReviewEvidenceRef' }
    AdaptiveReviewChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field:
          type: string
          enum: [ACTION, ESTIMATED_DURATION_MINUTES, DAYS_PER_WEEK, PREFERRED_DAYPART, LOCAL_TIME, FOCUS_ORDER]
        before: { type: [string, 'null'], maxLength: 255 }
        after: { type: [string, 'null'], maxLength: 255 }
    AdaptiveReviewOption:
      type: object
      additionalProperties: false
      required: [optionId, kind, executionKind, actionId, focusId, rationaleCodes, evidenceRefs,
        conflictingEvidenceRefs, changes]
      properties:
        optionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque and deterministic for the fingerprinted context.
        kind:
          type: string
          enum: [KEEP_CURRENT, LOWER_WORKLOAD, DIFFERENT_TIME, ALTERNATIVE_ACTION, DIFFERENT_FOCUS, PROFESSIONAL_SUPPORT_NEXT_STEP]
        executionKind:
          type: string
          enum: [NO_CHANGE, CONTINUE_CYCLE, UPDATE_SCHEDULE, PREPARE_REPLACEMENT, NAVIGATE_PROFESSIONAL_SUPPORT]
          description: |
            NAVIGATE_PROFESSIONAL_SUPPORT opens existing professional routing with no
            appointment, consent or plan write and is not confirmed through this API.
        actionId: { type: [string, 'null'], format: uuid }
        focusId: { type: [string, 'null'], maxLength: 128 }
        rationaleCodes:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 128 }
        evidenceRefs:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AdaptiveReviewEvidenceRef' }
        conflictingEvidenceRefs:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AdaptiveReviewEvidenceRef' }
        changes:
          type: array
          maxItems: 6
          description: Exact before/after consequence; empty for KEEP_CURRENT and navigation.
          items: { $ref: '#/components/schemas/AdaptiveReviewChange' }
    AdaptiveReviewUnavailableOption:
      type: object
      additionalProperties: false
      required: [kind, reasonCode]
      properties:
        kind:
          type: string
          enum: [KEEP_CURRENT, LOWER_WORKLOAD, DIFFERENT_TIME, ALTERNATIVE_ACTION, DIFFERENT_FOCUS, PROFESSIONAL_SUPPORT_NEXT_STEP]
        reasonCode:
          type: string
          enum: [NO_SUPPORTING_PATTERN, NO_TIME_PREFERENCE, NO_ADMITTED_CANDIDATE, REASSESSMENT_REQUIRED,
            ADMISSION_UNAVAILABLE, CURRENT_PLAN_NOT_ADMISSIBLE, PLAN_PAUSED, ENTITLEMENT_REQUIRED]
    ConfirmAdaptiveReviewOptionRequest:
      type: object
      additionalProperties: false
      required: [reviewFingerprint, optionId]
      properties:
        reviewFingerprint: { type: string, minLength: 16, maxLength: 128 }
        optionId: { type: string, minLength: 1, maxLength: 128 }
        reassessmentSummaryId: { type: string, format: uuid }
        proposedPlanId:
          type: string
          format: uuid
          description: Only for PREPARE_REPLACEMENT after the prepared DRAFT was compared; omit to prepare the draft.
        proposedVersion: { type: integer, minimum: 0 }
    AdaptiveReviewConfirmation:
      type: object
      additionalProperties: false
      required: [result, optionId, plan, draft]
      properties:
        result:
          type: string
          enum: [KEPT, CYCLE_CONTINUED, SCHEDULE_UPDATED, DRAFT_PREPARED, REPLACED]
        optionId: { type: string, minLength: 1, maxLength: 128 }
        plan:
          description: The authoritative current plan after the operation.
          allOf:
            - { $ref: '#/components/schemas/SupportPlanV3' }
        draft:
          description: The prepared DRAFT for DRAFT_PREPARED, otherwise null.
          oneOf:
            - { $ref: '#/components/schemas/SupportPlanV3' }
            - { type: 'null' }
    PlanResourceActionsV1:
      type: object
      additionalProperties: false
      required: [planState, localDate, actions]
      properties:
        planState: { type: string, enum: [ACTIVE, PAUSED, NONE] }
        supportPlanId: { type: string, format: uuid }
        supportPlanVersion: { type: integer, minimum: 0 }
        representationMode: { type: string, enum: [NATIVE_V3, V2_RESOURCE_ADAPTER] }
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: Plan time zone used for weekly board boundaries.
        localDate: { type: string, format: date }
        actions:
          type: array
          description: ACTIVE RESOURCE actions in plan order, without rationale or treatment meaning.
          items: { $ref: '#/components/schemas/PlanResourceAction' }
      allOf:
        - if: { properties: { planState: { enum: [ACTIVE, PAUSED] } }, required: [planState] }
          then:
            required: [supportPlanId, supportPlanVersion, representationMode, timeZone]
        - if: { properties: { planState: { const: NONE } }, required: [planState] }
          then:
            properties:
              actions: { maxItems: 0 }
    PlanResourceAction:
      type: object
      additionalProperties: false
      required: [actionId, actionVersion, title, resource, schedule, today]
      properties:
        actionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Native action UUID or v2 adapter slot identity.
        actionVersion: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 255 }
        resource:
          type: object
          additionalProperties: false
          required: [resourceId, resourceVersion, publicationId]
          properties:
            resourceId: { type: string, format: uuid }
            resourceVersion: { type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19 }
            publicationId: { type: string, format: uuid }
        schedule:
          description: Current action schedule, or null when no schedule applies.
          oneOf:
            - { $ref: '#/components/schemas/ActionSchedule' }
            - { type: 'null' }
        today:
          description: Occurrence for localDate, or null for an unscheduled date or V2_RESOURCE_ADAPTER.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [occurrenceId, occurrenceVersion, displayState, completionEvidence]
              properties:
                occurrenceId: { type: string, format: uuid }
                occurrenceVersion: { type: integer, minimum: 0 }
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Pinned occurrence IANA time zone used to determine its local today and reconcile evidence.
                displayState: { type: string, enum: [SCHEDULED, OVERDUE, COMPLETED, SKIPPED, CANCELLED] }
                completionEvidence:
                  oneOf:
                    - { $ref: '#/components/schemas/CompletionEvidence' }
                    - { type: 'null' }
    EmotionCheckInOccurrenceReconciliation:
      type: object
      additionalProperties: false
      required: [schemaVersion, occurrenceId, actionId, localDate, sourceState,
        occurrenceState, version, completedAt, completionEvidence]
      properties:
        schemaVersion: { type: string, const: emotion-check-in-occurrence-reconciliation-v1 }
        occurrenceId: { type: string, format: uuid }
        actionId: { type: string, format: uuid }
        localDate: { type: string, format: date }
        sourceState: { type: string, enum: [RECORDED, MISSING, DELETED] }
        occurrenceState: { type: string, enum: [SCHEDULED, COMPLETED] }
        version: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
        completionEvidence:
          oneOf:
            - { type: 'null' }
            - allOf:
                - { $ref: '#/components/schemas/CompletionEvidence' }
                - properties:
                    kind: { const: EMOTION_CHECK_IN }
                    ownerDomain: { const: JOURNAL_AI }
      allOf:
        - if: { properties: { occurrenceState: { const: COMPLETED } }, required: [occurrenceState] }
          then:
            properties:
              completedAt: { type: string, format: date-time }
              completionEvidence: { $ref: '#/components/schemas/CompletionEvidence' }
        - if: { properties: { occurrenceState: { const: SCHEDULED } }, required: [occurrenceState] }
          then:
            properties:
              completedAt: { type: 'null' }
              completionEvidence: { type: 'null' }
    JournalOccurrenceReconciliation:
      type: object
      additionalProperties: false
      required: [schemaVersion, occurrenceId, actionId, localDate, journalId,
        sourceState, occurrenceState, version, completedAt, completionEvidence]
      properties:
        schemaVersion: { type: string, const: journal-entry-occurrence-reconciliation-v1 }
        occurrenceId: { type: string, format: uuid }
        actionId: { type: string, format: uuid }
        localDate: { type: string, format: date }
        journalId: { type: string, format: uuid }
        sourceState: { type: string, enum: [RECORDED, MISSING, DELETED] }
        occurrenceState: { type: string, enum: [SCHEDULED, COMPLETED] }
        version: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
        completionEvidence:
          oneOf:
            - { type: 'null' }
            - allOf:
                - { $ref: '#/components/schemas/CompletionEvidence' }
                - properties:
                    kind: { const: JOURNAL_ENTRY }
                    ownerDomain: { const: JOURNAL_AI }
      allOf:
        - if: { properties: { occurrenceState: { const: COMPLETED } }, required: [occurrenceState] }
          then:
            properties:
              completedAt: { type: string, format: date-time }
              completionEvidence: { $ref: '#/components/schemas/CompletionEvidence' }
        - if: { properties: { occurrenceState: { const: SCHEDULED } }, required: [occurrenceState] }
          then:
            properties:
              completedAt: { type: 'null' }
              completionEvidence: { type: 'null' }
    ActionOccurrenceList:
      type: object
      additionalProperties: false
      required: [supportPlanId, supportPlanStatus, representationMode, from, through,
        occurrences, interpretationCode]
      properties:
        supportPlanId: { type: string, format: uuid }
        supportPlanStatus: { type: string, enum: [ACTIVE, PAUSED] }
        representationMode: { type: string, enum: [V2_RESOURCE_ADAPTER, NATIVE_V3] }
        from: { type: string, format: date }
        through: { type: string, format: date }
        occurrences:
          type: array
          maxItems: 620
          items: { $ref: '#/components/schemas/ActionOccurrence' }
        interpretationCode:
          type: string
          const: SELF_REPORTED_WELLBEING_ACTIVITY_NOT_TREATMENT_ADHERENCE
    ActionOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, actionId, actionType, actionVersion, scheduleId, scheduleVersion,
        representationMode, version, localDate, scheduledAt, state, displayState, stateReason,
        completionEvidence, outcomeRecordedAt]
      description: |
        The six engagement fields (hidden, helpfulness, barrierCode, reflection,
        summaryReuseApproved, engagementUpdatedAt) are additive and optional: they
        are emitted only on native occurrences with engagement metadata or on
        the native engagement command responses. Existing occurrence reads and
        state commands without metadata keep their original wire shape, including
        older state-only engagement timestamps.
      properties:
        occurrenceId: { type: string, format: uuid }
        actionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Native action identity or existing v2 slot identity from the adapter.
        actionType:
          type: string
          enum: [RESOURCE, JOURNAL, EMOTION_CHECK_IN, ROUTINE_SELF_MANAGEMENT,
            PROFESSIONAL_SUPPORT, REASSESSMENT_SCREENING, SELF_REPORT_REVIEW]
        actionVersion: { type: integer, minimum: 0 }
        scheduleId: { type: string, format: uuid }
        scheduleVersion: { type: integer, minimum: 1 }
        representationMode: { type: string, enum: [V2_RESOURCE_ADAPTER, NATIVE_V3] }
        version: { type: integer, minimum: 0 }
        localDate: { type: string, format: date }
        scheduledAt: { type: string, format: date-time }
        state: { type: string, enum: [SCHEDULED, COMPLETED, SKIPPED, CANCELLED] }
        displayState: { type: string, enum: [SCHEDULED, OVERDUE, COMPLETED, SKIPPED, CANCELLED] }
        stateReason:
          type: [string, 'null']
          enum: [PLAN_PAUSED, PLAN_COMPLETED, PLAN_REPLACED, ACTION_ENDED, SCHEDULE_CHANGED, null]
        completionEvidence:
          description: Null unless completion is backed by a bounded Care or owner-domain fact.
          oneOf:
            - { $ref: '#/components/schemas/CompletionEvidence' }
            - { type: 'null' }
        outcomeRecordedAt: { type: [string, 'null'], format: date-time }
        hidden: { type: boolean }
        helpfulness:
          type: [string, 'null']
          enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null]
        barrierCode:
          type: [string, 'null']
          enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null]
        reflection: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        summaryReuseApproved: { type: boolean }
        engagementUpdatedAt: { type: [string, 'null'], format: date-time }
      allOf:
        - if:
            properties: { representationMode: { const: V2_RESOURCE_ADAPTER } }
            required: [representationMode]
          then: { properties: { completionEvidence: { type: 'null' } } }
        - if:
            properties:
              representationMode: { const: NATIVE_V3 }
              state: { const: COMPLETED }
            required: [representationMode, state]
          then:
            properties:
              completionEvidence: { $ref: '#/components/schemas/CompletionEvidence' }
              outcomeRecordedAt: { type: string, format: date-time }
        - if:
            properties:
              representationMode: { const: NATIVE_V3 }
              state: { enum: [SCHEDULED, SKIPPED, CANCELLED] }
            required: [representationMode, state]
          then: { properties: { completionEvidence: { type: 'null' } } }
        - if: { properties: { actionType: { const: RESOURCE } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { enum: [USER_ACKNOWLEDGEMENT, RESOURCE_PRACTICE_SESSION, RESOURCE_COMPLETION] }
        - if: { properties: { actionType: { const: ROUTINE_SELF_MANAGEMENT } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: USER_ACKNOWLEDGEMENT }
                          ownerDomain: { const: CARE }
        - if: { properties: { actionType: { const: SELF_REPORT_REVIEW } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: SELF_REPORT_REVIEW }
                          ownerDomain: { const: CARE }
        - if: { properties: { actionType: { const: JOURNAL } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: JOURNAL_ENTRY }
                          ownerDomain: { const: JOURNAL_AI }
        - if: { properties: { actionType: { const: EMOTION_CHECK_IN } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: EMOTION_CHECK_IN }
                          ownerDomain: { const: JOURNAL_AI }
        - if: { properties: { actionType: { const: PROFESSIONAL_SUPPORT } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: APPOINTMENT_FULFILMENT }
                          ownerDomain: { const: CONSULTATION }
        - if: { properties: { actionType: { const: REASSESSMENT_SCREENING } }, required: [actionType] }
          then:
            properties:
              completionEvidence:
                oneOf:
                  - { type: 'null' }
                  - allOf:
                      - { $ref: '#/components/schemas/CompletionEvidence' }
                      - properties:
                          kind: { const: ASSESSMENT_HISTORY }
                          ownerDomain: { const: CARE }
    CompletionEvidence:
      type: object
      additionalProperties: false
      required: [kind, ownerDomain, factId, factRevision, occurredAt, verifiedAt]
      properties:
        kind:
          type: string
          enum: [USER_ACKNOWLEDGEMENT, JOURNAL_ENTRY, EMOTION_CHECK_IN,
            APPOINTMENT_FULFILMENT, ASSESSMENT_HISTORY, SELF_REPORT_REVIEW,
            RESOURCE_PRACTICE_SESSION, RESOURCE_COMPLETION]
        ownerDomain: { type: string, enum: [CARE, JOURNAL_AI, CONSULTATION, CONTENT] }
        factId:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque authoritative fact identifier; never a copied source payload.
        factRevision: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        occurredAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
      allOf:
        - if:
            properties:
              kind: { enum: [RESOURCE_PRACTICE_SESSION, RESOURCE_COMPLETION] }
            required: [kind]
          then:
            properties:
              ownerDomain: { const: CONTENT }
              factRevision: { type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19 }
        - if:
            properties:
              kind: { enum: [JOURNAL_ENTRY, EMOTION_CHECK_IN] }
            required: [kind]
          then:
            properties:
              ownerDomain: { const: JOURNAL_AI }
        - if:
            properties:
              kind: { const: APPOINTMENT_FULFILMENT }
            required: [kind]
          then:
            properties:
              ownerDomain: { const: CONSULTATION }
        - if:
            properties:
              kind:
                enum: [USER_ACKNOWLEDGEMENT, ASSESSMENT_HISTORY, SELF_REPORT_REVIEW]
            required: [kind]
          then:
            properties:
              ownerDomain: { const: CARE }
    ChangeSupportPlanOccurrenceStateRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [COMPLETED, SKIPPED] }
    ReplaceSupportPlanOccurrenceEngagementRequest:
      type: object
      additionalProperties: false
      required: [state, hidden, helpfulness, barrierCode, reflection, summaryReuseApproved]
      properties:
        state: { type: string, enum: [SCHEDULED, COMPLETED, SKIPPED] }
        hidden:
          type: boolean
          description: Reversible owner display preference; it does not change engagement state.
        helpfulness:
          type: [string, 'null']
          enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null]
          description: Optional self-reported helpfulness, valid only with COMPLETED.
        barrierCode:
          type: [string, 'null']
          enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null]
          description: Optional structured barrier, valid only with SKIPPED.
        reflection:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: Optional bounded owner reflection; excluded from minimized integration facts.
        summaryReuseApproved:
          type: boolean
          description: Explicit approval for later bounded-summary reuse; never grants live checklist access.
    SupportPlanOccurrenceList:
      type: object
      additionalProperties: false
      required: [supportPlanId, supportPlanStatus, schedulePolicyVersion, from, through, occurrences, interpretationCode]
      properties:
        supportPlanId: { type: string, format: uuid }
        supportPlanStatus: { type: string, enum: [ACTIVE, PAUSED] }
        schedulePolicyVersion: { type: string, const: support-plan-activity-schedule-v1 }
        from: { type: string, format: date }
        through: { type: string, format: date }
        occurrences:
          type: array
          maxItems: 217
          items: { $ref: '#/components/schemas/SupportPlanOccurrence' }
        interpretationCode: { type: string, const: SELF_REPORTED_WELLBEING_ACTIVITY_NOT_TREATMENT_ADHERENCE }
    SupportPlanOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, supportPlanId, scheduleId, scheduleVersion, localDate, localTime, timezone, scheduledAt, state, displayState, stateReason, version, source, updatedAt, completedAt, skippedAt, cancelledAt, hidden, helpfulness, barrierCode, reflection, summaryReuseApproved, engagementUpdatedAt, interpretationCode]
      properties:
        occurrenceId: { type: string, format: uuid }
        supportPlanId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        scheduleVersion: { type: integer, minimum: 1 }
        localDate: { type: string, format: date }
        localTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$', description: Local wall time without an offset; timezone supplies the IANA zone. }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        scheduledAt: { type: string, format: date-time }
        state: { type: string, enum: [SCHEDULED, COMPLETED, SKIPPED, CANCELLED] }
        displayState: { type: string, enum: [SCHEDULED, MISSED, COMPLETED, SKIPPED, CANCELLED] }
        stateReason:
          type: [string, 'null']
          enum: [PLAN_PAUSED, PLAN_COMPLETED, PLAN_REPLACED, null]
        version: { type: integer, minimum: 0 }
        source: { $ref: '#/components/schemas/SupportPlanOccurrenceSource' }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        skippedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        hidden:
          type: boolean
          description: Owner-controlled display preference independent of completion state.
        helpfulness:
          type: [string, 'null']
          enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null]
        barrierCode:
          type: [string, 'null']
          enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null]
        reflection: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        summaryReuseApproved:
          type: boolean
          description: Owner approval for a later bounded summary, not specialist checklist access.
        engagementUpdatedAt: { type: [string, 'null'], format: date-time }
        interpretationCode: { type: string, const: SELF_REPORTED_WELLBEING_ACTIVITY_NOT_TREATMENT_ADHERENCE }
    SupportPlanOccurrenceSource:
      type: object
      additionalProperties: false
      required: [type, supportPlanVersion, slotId, resourceId, contentVersion, title]
      properties:
        type: { type: string, enum: [RESOURCE, JOURNAL_PROMPT, EMOTION_CHECK_IN_PROMPT] }
        supportPlanVersion: { type: integer, minimum: 1 }
        slotId: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        resourceId: { type: [string, 'null'], format: uuid }
        contentVersion: { type: [string, 'null'], pattern: '^[0-9]+$' }
        title: { type: string, minLength: 1, maxLength: 255 }
    ActivityDashboard:
      type: object
      additionalProperties: false
      required: [asOfLocalDate, startLocalDate, timezone, summary, daily, sources, partial, bounded]
      properties:
        asOfLocalDate: { type: string, format: date }
        startLocalDate: { type: string, format: date }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        summary: { $ref: "#/components/schemas/ActivityDashboardSummary" }
        daily:
          type: array
          minItems: 7
          maxItems: 90
          items: { $ref: "#/components/schemas/ActivityDashboardDailyBucket" }
        sources: { $ref: "#/components/schemas/ActivityDashboardSources" }
        partial: { type: boolean }
        bounded: { $ref: "#/components/schemas/ActivityDashboardBounds" }
    ActivityDashboardSummary:
      type: object
      additionalProperties: false
      required: [totalActivities, activeDays, assessmentSubmissions, journalEntries, journalActiveDays, emotionCheckIns, emotionActiveDays, supportCompleted, supportSkipped, appointmentEvents, currentEmotionStreak, latestAssessmentInstrument, latestAssessmentSubmittedAt]
      properties:
        totalActivities: { type: integer, minimum: 0 }
        activeDays: { type: integer, minimum: 0, maximum: 90 }
        assessmentSubmissions: { type: integer, minimum: 0 }
        journalEntries: { type: integer, minimum: 0 }
        journalActiveDays: { type: integer, minimum: 0, maximum: 90 }
        emotionCheckIns: { type: integer, minimum: 0 }
        emotionActiveDays: { type: integer, minimum: 0, maximum: 90 }
        supportCompleted: { type: integer, minimum: 0 }
        supportSkipped: { type: integer, minimum: 0 }
        appointmentEvents: { type: integer, minimum: 0 }
        currentEmotionStreak: { type: integer, minimum: 0, maximum: 90 }
        latestAssessmentInstrument: { type: [string, "null"], enum: [PHQ9, GAD7, null] }
        latestAssessmentSubmittedAt: { type: [string, "null"], format: date-time }
    ActivityDashboardDailyBucket:
      type: object
      additionalProperties: false
      required: [localDate, assessments, journals, emotions, emotionLevel, supportCompleted, supportSkipped, appointments, total]
      properties:
        localDate: { type: string, format: date }
        assessments: { type: integer, minimum: 0 }
        journals: { type: integer, minimum: 0 }
        emotions: { type: integer, minimum: 0 }
        emotionLevel: { type: [integer, "null"], minimum: 1, maximum: 5 }
        supportCompleted: { type: integer, minimum: 0 }
        supportSkipped: { type: integer, minimum: 0 }
        appointments: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ActivityDashboardSources:
      type: object
      additionalProperties: false
      required: [assessments, journals, emotions, supportPlans, appointments]
      properties:
        assessments: { $ref: "#/components/schemas/ActivityDashboardSourceState" }
        journals: { $ref: "#/components/schemas/ActivityDashboardSourceState" }
        emotions: { $ref: "#/components/schemas/ActivityDashboardSourceState" }
        supportPlans: { $ref: "#/components/schemas/ActivityDashboardSourceState" }
        appointments: { $ref: "#/components/schemas/ActivityDashboardSourceState" }
    ActivityDashboardSourceState:
      type: string
      enum: [available, empty, limited, unavailable]
    ActivityDashboardBounds:
      type: object
      additionalProperties: false
      required: [windowDays, assessmentLimit, journalLimit, emotionLimit, appointmentLimit]
      properties:
        windowDays: { type: integer, enum: [7, 30, 90] }
        assessmentLimit: { type: integer, const: 50 }
        journalLimit: { type: integer, const: 50 }
        emotionLimit: { type: integer, const: 90 }
        appointmentLimit: { type: integer, const: 100 }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }
        correlationId: { type: string, format: uuid }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    ValidationProblem:
      description: Request validation failed with VALIDATION_FAILED or a field violation such as INCOMPLETE_QUESTIONNAIRE or INVALID_ANSWER; no result was persisted
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/validation-failed
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
            violations:
              [
                {
                  field: answers,
                  code: INCOMPLETE_QUESTIONNAIRE,
                  message: one answer is required for every question,
                },
              ]
    UnauthorizedProblem:
      description: Authentication is missing or invalid (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ForbiddenProblem:
      description: Caller lacks the USER role or owner authorization (CARE_USER_REQUIRED or RESOURCE_NOT_OWNED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvalidAnonymousSessionProblem:
      description: Anonymous session identifier or token is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/invalid-anonymous-session,
              title: Anonymous session is invalid,
              status: 401,
              code: INVALID_ANONYMOUS_SESSION,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    ExpiredAnonymousSessionProblem:
      description: Anonymous session and its result have expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/anonymous-session-expired,
              title: Anonymous session expired,
              status: 410,
              code: ANONYMOUS_SESSION_EXPIRED,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    NotFoundProblem:
      description: Requested resource does not exist (PROFILE_NOT_FOUND, QUESTIONNAIRE_NOT_FOUND, ASSESSMENT_NOT_FOUND, or SUPPORT_EVALUATION_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProfileNotFoundProblem:
      description: No Care profile has been created yet; clients should present the normal profile onboarding state (PROFILE_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/profile-not-found
            title: Care profile was not found
            status: 404
            code: PROFILE_NOT_FOUND
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
    ConflictProblem:
      description: Request conflicts with stored state (IDEMPOTENCY_KEY_REUSED, QUESTIONNAIRE_VERSION_UNAVAILABLE, or SUPPORT_EVIDENCE_INCOMPATIBLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CombinedScreeningMeaningUnavailableProblem:
      description: COMBINED_SCREENING_MEANING_UNAVAILABLE; the owned source policy, exact pair, stored tier or bounded presentation copy could not be trusted. No latest-pair substitution, false absence or history mutation occurs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanEntitlementProblem:
      description: Current authoritative package is FREE (SUPPORT_PLAN_ENTITLEMENT_REQUIRED); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanEligibilityProblem:
      description: Current source facts cannot produce a bounded draft (SUPPORT_EVALUATION_STALE, SUPPORT_PLAN_CORE_UNAVAILABLE, RESOURCE_VERSION_STALE, SUPPORT_PLAN_SAFETY_REVIEW_REQUIRED, SUPPORT_PLAN_TIME_BUDGET_INCOMPATIBLE, or SUPPORT_PLAN_DRAFT_EXISTS); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanDependencyProblem:
      description: Entitlement or exact resource eligibility could not be trusted (ENTITLEMENT_UNAVAILABLE or RESOURCE_ELIGIBILITY_UNAVAILABLE); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyProblem:
      description: An authoritative dependency could not be verified; access fails closed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanDraftNotFoundProblem:
      description: The authenticated user has no current draft (SUPPORT_PLAN_DRAFT_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanCurrentNotFoundProblem:
      description: The authenticated user has no ACTIVE or PAUSED SupportPlan (SUPPORT_PLAN_CURRENT_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanNotFoundProblem:
      description: The SupportPlan is absent or not owned by the authenticated user (SUPPORT_PLAN_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanChoiceConflictProblem:
      description: The choice update targets a non-draft, omits a core slot, injects a version, or duplicates a version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanActivationConflictProblem:
      description: The activation command reuses a key differently, targets a non-draft, conflicts with another current plan, uses a stale personalization revision (SUPPORT_PLAN_PERSONALIZATION_REVIEW_REQUIRED), or fails current policy or eligibility
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanVersionProblem:
      description: If-Match does not equal the current Care-owned SupportPlan version (SUPPORT_PLAN_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanPersonalizationVersionProblem:
      description: If-Match does not equal the current preference revision (SUPPORT_PLAN_PERSONALIZATION_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanLifecycleConflictProblem:
      description: The requested lifecycle transition is invalid, reassessment is stale or uses different screening evidence, or replacement is unchanged (SUPPORT_PLAN_TRANSITION_INVALID, REASSESSMENT_SUMMARY_STALE, REASSESSMENT_SCREENING_CONTEXT_MISMATCH, or SUPPORT_PLAN_REPLACEMENT_UNCHANGED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanCycleConflictProblem:
      description: The plan has no proposal cycle, is not ACTIVE and REVIEW_DUE, or reuses a key differently (SUPPORT_PLAN_MODEL_VERSION_UNSUPPORTED, SUPPORT_PLAN_CYCLE_NOT_REVIEW_DUE, or IDEMPOTENCY_KEY_REUSED); no cycle was started
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AdaptiveReviewConflictProblem:
      description: The review context changed or the choice is not allowed (ADAPTIVE_REVIEW_STALE, ADAPTIVE_REVIEW_OPTION_UNAVAILABLE, SUPPORT_PLAN_NOT_REVIEWABLE, SUPPORT_PLAN_DRAFT_EXISTS, or IDEMPOTENCY_KEY_REUSED); nothing was applied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanScheduleConflictProblem:
      description: The command reuses an idempotency key differently, targets a non-mutable plan or action, or requests recurrence for a review-only action (IDEMPOTENCY_KEY_REUSED, SUPPORT_PLAN_SCHEDULE_NOT_MUTABLE, PLAN_ACTION_SCHEDULE_NOT_MUTABLE, or PLAN_ACTION_UNSCHEDULABLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceNotFoundProblem:
      description: The occurrence is absent or not owned by the authenticated user (OCCURRENCE_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceConflictProblem:
      description: The occurrence is cancelled, has a conflicting state, its plan/action is inactive, its model cannot take this command, or a native engagement command tries to change authoritative state (OCCURRENCE_NOT_OPEN, SUPPORT_PLAN_NOT_CURRENT, SUPPORT_PLAN_NOT_ACTIVE, SUPPORT_PLAN_MODEL_VERSION_UNSUPPORTED, or AUTHORITATIVE_COMPLETION_REQUIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceVersionProblem:
      description: If-Match does not equal the Care-owned occurrence version (OCCURRENCE_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceResult:
      description: Authoritative occurrence with local-time and source provenance
      headers:
        ETag:
          $ref: '#/components/headers/SupportPlanETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SupportPlanOccurrence' }
    SupportPlanCommandResult:
      description: Updated authoritative plan or the identical persisted command outcome
      headers:
        ETag:
          $ref: '#/components/headers/SupportPlanETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SupportPlan' }
    InsufficientComparableDataProblem:
      description: The selected owned result has no immediately preceding valid result with the same instrument and scoring version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/insufficient-comparable-data,
              title: Comparable assessment data is unavailable,
              status: 409,
              code: INSUFFICIENT_COMPARABLE_DATA,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    IdempotencyConflictProblem:
      description: Idempotency key was previously used with a different consent request (IDEMPOTENCY_KEY_REUSED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    VersionProblem:
      description: If-Match does not match the current resource version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    VersionRequiredProblem:
      description: A quoted current resource version is required in If-Match
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimitProblem:
      description: Request exceeded the bounded anonymous or Care API rate limit (RATE_LIMITED)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
