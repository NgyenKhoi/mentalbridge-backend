  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    anonymousSessionToken:
      type: apiKey
      in: header
      name: X-Anonymous-Session-Token
      description: Opaque high-entropy bearer credential returned once and stored only as a hash
  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportEvaluationId:
      name: supportEvaluationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportPlanId:
      name: supportPlanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Instrument:
      name: instrument
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Instrument" }
    Locale:
      name: locale
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 16, default: vi-VN }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Caller correlation identifier; the server generates one when omitted
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        { type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]+$" }
      description: Retry key scoped to the authenticated account or anonymous session
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
    AssessmentCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor returned as nextCursor by the preceding page
    SupportEvaluationCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor returned as nextCursor by the preceding support-evaluation page
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    ReassessmentPeriod:
      type: object
      additionalProperties: false
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
      description: Half-open UTC period. Canonical v2 periods are issued by the Care reassessment context policy.
    ReassessmentContext:
      type: object
      additionalProperties: false
      required: [policyVersion, state, missingInstruments, phq9AssessmentId, gad7AssessmentId, previousPeriod, currentPeriod]
      properties:
        policyVersion: { type: string, const: reassessment-comparison-v1 }
        state: { type: string, enum: [READY, INCOMPLETE] }
        missingInstruments:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/Instrument" }
        phq9AssessmentId: { type: [string, "null"], format: uuid }
        gad7AssessmentId: { type: [string, "null"], format: uuid }
        previousPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
    ReassessmentSummaryCreateRequest:
      type: object
      additionalProperties: false
      required: [phq9AssessmentId, gad7AssessmentId, previousPeriod, currentPeriod]
      oneOf:
        - required: [journalAnalysisId]
        - required: [journalJobId]
      properties:
        phq9AssessmentId: { type: string, format: uuid }
        gad7AssessmentId: { type: string, format: uuid }
        journalAnalysisId:
          type: string
          format: uuid
          description: Deprecated MB-386 v1 compatibility input. Exactly one Journal evidence reference is required.
        journalJobId:
          type: string
          format: uuid
          description: Canonical v2 input; Care resolves the authoritative Journal job status and result.
        previousPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        selfReportId:
          type: string
          format: uuid
          description: Optional explicit owner self-report for the exact current period. Omission produces INSUFFICIENT_DATA and is never inferred from other evidence.
    ReassessmentCurrentExperience:
      type: string
      enum: [BETTER, ABOUT_THE_SAME, MORE_DIFFICULT, UNSURE]
      description: Non-diagnostic comparison of how the current period has felt to the user.
    ReassessmentSelfReportCreateRequest:
      type: object
      additionalProperties: false
      required: [currentPeriod, currentExperience]
      properties:
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentExperience: { $ref: "#/components/schemas/ReassessmentCurrentExperience" }
        helpfulContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        difficultContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
    ReassessmentSelfReportReplaceRequest:
      type: object
      additionalProperties: false
      required: [currentExperience]
      properties:
        currentExperience: { $ref: "#/components/schemas/ReassessmentCurrentExperience" }
        helpfulContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        difficultContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
    ReassessmentSelfReport:
      type: object
      additionalProperties: false
      required: [selfReportId, sourceVersion, currentPeriod, currentExperience, helpfulContext, difficultContext, version, authoredAt, updatedAt]
      properties:
        selfReportId: { type: string, format: uuid }
        sourceVersion: { type: string, const: reassessment-self-report-v1 }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentExperience: { $ref: "#/components/schemas/ReassessmentCurrentExperience" }
        helpfulContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        difficultContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
        authoredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReassessmentDimensionState:
      type: string
      enum: [AVAILABLE, INSUFFICIENT_DATA, UNAVAILABLE]
    ReassessmentScreeningPoint:
      type: object
      additionalProperties: true
      required: [assessmentId, questionnaireVersion, submittedAt, totalScore, screeningLevel]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        submittedAt: { type: string, format: date-time }
        totalScore: { type: integer, minimum: 0, maximum: 27 }
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
    ReassessmentScreeningTrend:
      type: object
      additionalProperties: true
      required: [instrument, state, scoringVersion, previous, current, rawDelta, direction]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        previous:
          oneOf:
            - $ref: "#/components/schemas/ReassessmentScreeningPoint"
            - type: "null"
        current: { $ref: "#/components/schemas/ReassessmentScreeningPoint" }
        rawDelta: { type: [integer, "null"], minimum: -27, maximum: 27 }
