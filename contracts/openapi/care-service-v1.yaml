          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/ReassessmentScreeningTrend" }
    ReassessmentJournalSourceRevision:
      type: object
      additionalProperties: false
      required: [journalId, journalRevision, period]
      properties:
        journalId: { type: string, format: uuid }
        journalRevision: { type: integer, minimum: 1, maximum: 200 }
        period: { type: string, enum: [PREVIOUS, CURRENT] }
    ReassessmentJournalChange:
      type: object
      additionalProperties: false
      required: [signal, direction]
      properties:
        signal: { type: string, minLength: 1, maxLength: 64 }
        direction: { type: string, enum: [MORE_FREQUENT, LESS_FREQUENT, SIMILAR, INSUFFICIENT_DATA] }
    ReassessmentJournalCoverage:
      type: object
      additionalProperties: false
      required: [previousPeriodJournalEntryCount, currentPeriodJournalEntryCount, sufficientForComparison]
      properties:
        previousPeriodJournalEntryCount: { type: integer, minimum: 0, maximum: 100 }
        currentPeriodJournalEntryCount: { type: integer, minimum: 0, maximum: 100 }
        sufficientForComparison: { type: boolean }
    ReassessmentJournalProvenance:
      type: object
      additionalProperties: false
      required: [provider, model, promptVersion, schemaVersion, createdAt]
      properties:
        provider: { type: string, enum: [DETERMINISTIC_FAKE, GEMINI, OPENAI] }
        model: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, minLength: 1, maxLength: 96 }
        schemaVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    ReassessmentJournalDimension:
      type: object
      additionalProperties: true
      required: [state, unavailableReason, jobId, analysisId, sourceJournalRevisions, contextSignals, emotionIndicators, recurringThemes, changesComparedWithPreviousPeriod, preferences, barriers, helpfulPatterns, dataCoverage, provenance]
      properties:
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
        unavailableReason:
          type: [string, "null"]
          enum: [SOURCE_NOT_FOUND, CONSENT_REQUIRED, CONSENT_REVOKED, CONSENT_UNAVAILABLE, ENTITLEMENT_UNAVAILABLE, ENTITLEMENT_CHANGED, AUTHORIZATION_CONTEXT_LOST, SOURCE_REVISION_CHANGED, SOURCE_DELETED, PROVIDER_TIMEOUT, PROVIDER_UNAVAILABLE, INVALID_PROVIDER_RESULT, INTERNAL_ERROR, DEPENDENCY_UNAVAILABLE, INVALID_PROJECTION, null]
        jobId:
          type: [string, "null"]
          format: uuid
          description: Present for canonical v2 snapshots, including failed jobs.
        analysisId:
          type: [string, "null"]
          format: uuid
          description: Present only when Journal produced an analysis (or for a legacy v1 snapshot).
        sourceJournalRevisions:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReassessmentJournalSourceRevision" }
        contextSignals: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        emotionIndicators: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        recurringThemes: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        changesComparedWithPreviousPeriod: { type: array, maxItems: 24, items: { $ref: "#/components/schemas/ReassessmentJournalChange" } }
        preferences: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        barriers: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        helpfulPatterns: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        dataCoverage:
          oneOf:
            - $ref: "#/components/schemas/ReassessmentJournalCoverage"
            - type: "null"
        provenance:
          oneOf:
            - $ref: "#/components/schemas/ReassessmentJournalProvenance"
            - type: "null"
    ReassessmentEngagementPeriod:
      type: object
      additionalProperties: false
      required: [completedCount, skippedCount]
      properties:
        completedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
    ReassessmentEngagementSource:
      type: object
      additionalProperties: false
      required: [occurrenceId, supportPlanId, sourcePlanVersion, sourceSlotId, sourceResourceId, sourceContentVersion, scheduledAt, period, state, barrierCode]
      properties:
        occurrenceId: { type: string, format: uuid }
        supportPlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 0 }
        sourceSlotId: { type: string, minLength: 1, maxLength: 64 }
        sourceResourceId: { type: string, format: uuid }
        sourceContentVersion: { type: integer, format: int64, minimum: 0 }
        scheduledAt: { type: string, format: date-time }
        period: { type: string, enum: [PREVIOUS, CURRENT] }
        state: { type: string, enum: [COMPLETED, SKIPPED] }
        barrierCode: { type: [string, "null"], enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null] }
    ReassessmentEngagementDimension:
      type: object
      additionalProperties: true
      required: [state, previousPeriod, currentPeriod, sources]
      properties:
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
        previousPeriod: { $ref: "#/components/schemas/ReassessmentEngagementPeriod" }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentEngagementPeriod" }
        sources:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ReassessmentEngagementSource" }
    ReassessmentReflectionSource:
      type: object
      additionalProperties: false
      required: [occurrenceId, period, helpfulness, reflection, engagementUpdatedAt]
      properties:
        occurrenceId: { type: string, format: uuid }
        period: { type: string, enum: [PREVIOUS, CURRENT] }
        helpfulness: { type: [string, "null"], enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null] }
        reflection: { type: [string, "null"], minLength: 1, maxLength: 500 }
        engagementUpdatedAt: { type: string, format: date-time }
    ReassessmentReflectionDimension:
      type: object
      additionalProperties: true
      required: [state, sources]
      properties:
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
        sources:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ReassessmentReflectionSource" }
    ReassessmentExplicitSelfReport:
      type: object
      additionalProperties: false
      required: [selfReportId, sourceVersion, sourceRevision, currentPeriod, currentExperience, helpfulContext, difficultContext, authoredAt, updatedAt]
      properties:
        selfReportId: { type: string, format: uuid }
        sourceVersion: { type: string, const: reassessment-self-report-v1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentExperience: { $ref: "#/components/schemas/ReassessmentCurrentExperience" }
        helpfulContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        difficultContext: { type: [string, "null"], minLength: 1, maxLength: 500 }
        authoredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReassessmentSelfReportedExperienceDimension:
      type: object
      additionalProperties: false
      required: [state, unavailableReason, source]
      properties:
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
        unavailableReason:
          type: [string, "null"]
          enum: [NOT_PROVIDED, SOURCE_DELETED, null]
        source:
          oneOf:
            - $ref: "#/components/schemas/ReassessmentExplicitSelfReport"
            - type: "null"
    ReassessmentSummary:
      type: object
      additionalProperties: true
      required: [summaryId, summaryVersion, composedAt, previousPeriod, currentPeriod, screening, journalContext, supportPlanEngagement, disclaimerCode]
      description: v1 snapshots expose userReflection; v2 snapshots expose selfReportedExperience and activityReflection as distinct sources.
      properties:
        summaryId: { type: string, format: uuid }
        summaryVersion: { type: string, enum: [reassessment-summary-v1, reassessment-summary-v2] }
        composedAt: { type: string, format: date-time }
        previousPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        currentPeriod: { $ref: "#/components/schemas/ReassessmentPeriod" }
        screening: { $ref: "#/components/schemas/ReassessmentScreeningDimension" }
        journalContext: { $ref: "#/components/schemas/ReassessmentJournalDimension" }
        supportPlanEngagement: { $ref: "#/components/schemas/ReassessmentEngagementDimension" }
        selfReportedExperience: { $ref: "#/components/schemas/ReassessmentSelfReportedExperienceDimension" }
        activityReflection: { $ref: "#/components/schemas/ReassessmentReflectionDimension" }
        userReflection:
          description: Deprecated MB-386 v1 activity-reflection field retained only on historical snapshots.
          allOf:
            - $ref: "#/components/schemas/ReassessmentReflectionDimension"
        disclaimerCode: { type: string, const: FOUR_DIMENSIONS_NOT_COMBINED }
    ReassessmentSummaryHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
