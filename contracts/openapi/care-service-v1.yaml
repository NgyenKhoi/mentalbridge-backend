    SelfGuidedSupportEvaluation:
      summary: Minimal and mild screening bands route to self-guided support
      value:
        supportEvaluationId: 20000000-0000-4000-8000-000000000101
        policyVersion: mb-support-routing-capstone-v1
        evaluatedAt: "2026-09-10T08:00:00Z"
        supportTier: SELF_GUIDED_SUPPORT
        reasonCodes: [ALL_SCREENING_LEVELS_MINIMAL_OR_MILD]
        evidence:
          - assessmentId: 10000000-0000-4000-8000-000000000101
            instrument: PHQ9
            questionnaireVersion: phq9-vi-vn-capstone-v2
            scoringVersion: phq9-standard-bands-v1
            screeningLevel: MILD
            safetyStatus: NEGATIVE_SAFETY_SCREEN
            meaning:
              meaningCode: PHQ9_MILD_14D
              contentVersion: mb-screening-meaning-vi-vn-v2
              referencePeriodDays: 14
              text: Trong 14 ngày qua, các câu trả lời PHQ-9 của bạn cho thấy một số dấu hiệu liên quan đến tâm trạng, hứng thú, giấc ngủ, năng lượng hoặc sinh hoạt ở mức nhẹ. Bạn có thể dùng kết quả này để nhận ra điều gì đang làm mình khó chịu và theo dõi xem những dấu hiệu đó có kéo dài hoặc ảnh hưởng đến cuộc sống hằng ngày hay không.
              limitation: Kết quả này chỉ dựa trên câu trả lời tự khai của bạn trong 14 ngày qua. Bài sàng lọc không xác định nguyên nhân, không bao quát toàn bộ hoàn cảnh của bạn và không phải là chẩn đoán y khoa. Nếu những điều bạn đang trải qua khiến bạn lo lắng hoặc ảnh hưởng đến cuộc sống hằng ngày, bạn có thể cân nhắc trao đổi với một chuyên gia phù hợp.
          - assessmentId: 10000000-0000-4000-8000-000000000102
            instrument: GAD7
            questionnaireVersion: gad7-vi-vn-adult-v1
            scoringVersion: gad7-standard-bands-v1
            screeningLevel: MINIMAL
            safetyStatus: NOT_APPLICABLE
            meaning:
              meaningCode: GAD7_MINIMAL_14D
              contentVersion: mb-screening-meaning-vi-vn-v2
              referencePeriodDays: 14
              text: Trong 14 ngày qua, các câu trả lời GAD-7 của bạn cho thấy những dấu hiệu như lo lắng, căng thẳng hoặc khó thư giãn xuất hiện rất ít hoặc hầu như không xuất hiện. Kết quả này chỉ giúp nhìn lại các dấu hiệu được hỏi trong giai đoạn gần đây, không khẳng định rằng bạn không có bất kỳ khó khăn cảm xúc nào khác.
              limitation: Kết quả này chỉ dựa trên câu trả lời tự khai của bạn trong 14 ngày qua. Bài sàng lọc không xác định nguyên nhân, không bao quát toàn bộ hoàn cảnh của bạn và không phải là chẩn đoán y khoa. Nếu những điều bạn đang trải qua khiến bạn lo lắng hoặc ảnh hưởng đến cuộc sống hằng ngày, bạn có thể cân nhắc trao đổi với một chuyên gia phù hợp.
        nextStep:
          code: REVIEW_SELF_GUIDED_RESOURCE
          contentVersion: mb-support-next-step-vi-vn-v1
          text: Bạn có thể chọn một tài nguyên tự hỗ trợ đã được MentalBridge rà soát và tiếp tục theo dõi cảm nhận của mình.
          boundary: Không có cuộc hẹn, liên hệ với chuyên gia, chia sẻ dữ liệu hoặc can thiệp tự động nào được thực hiện.
        safetyGuidance: null
        disclaimerCode: SCREENING_NOT_DIAGNOSIS
        disclaimer: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
    ProfessionalSupportEvaluation:
      summary: A moderate-or-higher band recommends professional support
      value:
        supportEvaluationId: 20000000-0000-4000-8000-000000000102
        policyVersion: mb-support-routing-capstone-v1
        evaluatedAt: "2026-09-10T08:01:00Z"
        supportTier: PROFESSIONAL_SUPPORT_RECOMMENDED
