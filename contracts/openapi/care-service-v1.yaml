        "410": { $ref: "#/components/responses/ExpiredAnonymousSessionProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /api/v1/safety-directory-lookups:
    x-mentalbridge-status: implemented
    post:
      tags: [Safety directory]
      operationId: lookupReviewedSafetyDirectory
      summary: Return Care-owned safety fallback with optional current area-directory results
      description: |
        Positive PHQ-9 item 9 and the explicit help-now action enter this same
        flow. Calling this public endpoint is itself an explicit help-now action;
        the trigger value is presentation provenance and never a risk label.
        Care always returns local reviewed fallback even when Content is empty,
        malformed, timed out, circuit-open, or unavailable.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CareSafetyDirectoryLookupRequest" }
      responses:
        "200":
          description: Synchronous safety response with results or explicit fallback state
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CareSafetyDirectoryLookupResponse",
                }
        "400": { $ref: "#/components/responses/ValidationProblem" }
