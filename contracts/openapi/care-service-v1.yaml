  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    anonymousSessionToken:
      type: apiKey
      in: header
      name: X-Anonymous-Session-Token
      description: Opaque high-entropy bearer credential returned once and stored only as a hash
  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportEvaluationId:
      name: supportEvaluationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportPlanId:
      name: supportPlanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Instrument:
      name: instrument
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Instrument" }
    Locale:
      name: locale
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 16, default: vi-VN }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Caller correlation identifier; the server generates one when omitted
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        { type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]+$" }
      description: Retry key scoped to the authenticated account or anonymous session
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanChangeRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
    AssessmentCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor returned as nextCursor by the preceding page
    SupportEvaluationCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor returned as nextCursor by the preceding support-evaluation page
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    CareProductJourneyMetrics:
      type: object
      additionalProperties: false
      required: [source, sourceVersion, asOf, completedScreeningEpisodes, supportGuidesGenerated, paidSupportPlansActivated]
