        '409': { $ref: '#/components/responses/SupportPlanActivationConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
  /api/v1/support-plans/{supportPlanId}/status:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan activity]
      operationId: replaceOwnSupportPlanStatus
      summary: Apply an explicit idempotent SupportPlan lifecycle state
      description: |
        ACTIVE may resume PAUSED, PAUSED may pause ACTIVE, COMPLETED ends an
        ACTIVE or PAUSED plan without implying recovery, and DISCARDED removes
        a DRAFT from current consideration. Repeating the already-applied desired
        state is a no-op. An optional stable completion reason is accepted only
        for COMPLETED and becomes part of the immutable terminal snapshot.
        Pausing cancels future scheduled occurrences; resuming
        restores only still-future pause-cancelled occurrences and extends the
        bounded horizon; completing cancels future open occurrences.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSupportPlanStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanLifecycleConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
  /api/v1/support-plans/{supportPlanId}/replace:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan activity]
      operationId: replaceOwnCurrentSupportPlan
      summary: Explicitly replace the current plan with a revalidated draft
      description: |
        Care revalidates the owned draft before one local transaction marks the
        former current plan SUPERSEDED, cancels its future occurrences, activates
        the draft, and creates the replacement plan's deterministic schedules.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
