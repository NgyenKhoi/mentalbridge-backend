              text: Trong 14 ngày qua, các câu trả lời PHQ-9 của bạn cho thấy nhiều dấu hiệu liên quan đến tâm trạng, hứng thú, giấc ngủ, năng lượng hoặc sinh hoạt ở mức trung bình. Những trải nghiệm này có thể đáng để bạn quan tâm hơn, nhất là khi chúng kéo dài hoặc gây khó khăn trong học tập, công việc, các mối quan hệ hay việc chăm sóc bản thân.
              limitation: Kết quả này chỉ dựa trên câu trả lời tự khai của bạn trong 14 ngày qua. Bài sàng lọc không xác định nguyên nhân, không bao quát toàn bộ hoàn cảnh của bạn và không phải là chẩn đoán y khoa. Nếu những điều bạn đang trải qua khiến bạn lo lắng hoặc ảnh hưởng đến cuộc sống hằng ngày, bạn có thể cân nhắc trao đổi với một chuyên gia phù hợp.
          - assessmentId: 10000000-0000-4000-8000-000000000104
            instrument: GAD7
            questionnaireVersion: gad7-vi-vn-adult-v1
            scoringVersion: gad7-standard-bands-v1
            screeningLevel: SEVERE
            safetyStatus: NOT_APPLICABLE
            meaning:
              meaningCode: GAD7_SEVERE_14D
              contentVersion: mb-screening-meaning-vi-vn-v2
              referencePeriodDays: 14
              text: Trong 14 ngày qua, các câu trả lời GAD-7 của bạn cho thấy nhiều dấu hiệu như lo lắng, căng thẳng hoặc khó thư giãn ở mức nặng. Kết quả cho thấy các khó khăn được hỏi đến xuất hiện với tần suất cao; bạn nên cân nhắc sớm trao đổi trực tiếp với một chuyên gia phù hợp để được đánh giá đầy đủ hơn.
              limitation: Kết quả này chỉ dựa trên câu trả lời tự khai của bạn trong 14 ngày qua. Bài sàng lọc không xác định nguyên nhân, không bao quát toàn bộ hoàn cảnh của bạn và không phải là chẩn đoán y khoa. Nếu những điều bạn đang trải qua khiến bạn lo lắng hoặc ảnh hưởng đến cuộc sống hằng ngày, bạn có thể cân nhắc trao đổi với một chuyên gia phù hợp.
        nextStep:
          code: CONSIDER_PROFESSIONAL_SUPPORT
          contentVersion: mb-support-next-step-vi-vn-v1
          text: Bạn có thể cân nhắc chủ động tìm sự hỗ trợ từ một chuyên gia phù hợp nếu mong muốn.
          boundary: MentalBridge chưa liên hệ chuyên gia, đặt lịch hoặc chia sẻ dữ liệu của bạn; các hành động đó cần quy trình và sự đồng ý riêng.
        safetyGuidance: null
        disclaimerCode: SCREENING_NOT_DIAGNOSIS
        disclaimer: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
