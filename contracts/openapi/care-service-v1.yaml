        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ReassessmentSummary" }
        nextCursor: { type: [string, "null"], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    SafetyDirectoryTrigger:
      type: string
