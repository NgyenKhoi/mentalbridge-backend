          privacyPolicyVersion,
          submittedAt,
          result,
          expiresAt,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        voidedAt: { type: [string, "null"], format: date-time }
        result: { $ref: "#/components/schemas/AssessmentResult" }
        expiresAt: { type: string, format: date-time }
    AssessmentSummary:
      type: object
      additionalProperties: false
      required:
        [
          assessmentId,
          questionnaireDefinitionId,
          instrument,
          questionnaireVersion,
          privacyPolicyVersion,
          submittedAt,
          result,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/AssessmentResult" }
    AssessmentHistoryPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AssessmentSummary" }
        nextCursor: { type: [string, "null"], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    AssessmentProgress:
      type: object
      additionalProperties: true
      description: Additive descriptive comparison; consumers ignore unknown fields and fail safely on unknown enum values
      required:
        [
          instrument,
          scoringVersion,
          previous,
          current,
          rawDelta,
          scoreDirection,
          bandTransition,
          elapsedDuration,
        ]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        previous: { $ref: "#/components/schemas/AssessmentProgressPoint" }
        current: { $ref: "#/components/schemas/AssessmentProgressPoint" }
        rawDelta:
          type: integer
          minimum: -27
          maximum: 27
          description: Current totalScore minus previous totalScore; no clinical interpretation is implied
        scoreDirection: { $ref: "#/components/schemas/ScoreDirection" }
        bandTransition: { $ref: "#/components/schemas/BandTransition" }
        elapsedDuration:
          type: string
          format: duration
          description: Non-negative ISO 8601 duration from previous submittedAt to current submittedAt
    AssessmentProgressPoint:
      type: object
      additionalProperties: true
      required:
        [
          assessmentId,
          questionnaireVersion,
          submittedAt,
          totalScore,
          screeningLevel,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        submittedAt: { type: string, format: date-time }
        totalScore: { type: integer, minimum: 0, maximum: 27 }
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
    BandTransition:
      type: object
      additionalProperties: true
      required: [previous, current]
      properties:
        previous: { $ref: "#/components/schemas/ScreeningLevel" }
        current: { $ref: "#/components/schemas/ScreeningLevel" }
    ScoreDirection:
      type: string
      description: Descriptive arithmetic direction only; consumers must use an unavailable fallback for unknown values and must not infer clinical meaning
      enum: [INCREASED, DECREASED, UNCHANGED]
    AssessmentResult:
      type: object
      additionalProperties: false
      required:
        [
          totalScore,
          screeningLevel,
          scoringVersion,
          safetyStatus,
          safetyPolicyVersion,
          disclaimerCode,
        ]
      properties:
        totalScore:
          type: integer
          minimum: 0
          maximum: 27
          description: Server-computed sum of the validated answer values
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        safetyStatus:
          $ref: "#/components/schemas/SafetyStatus"
        safetyPolicyVersion:
          type: [string, "null"]
          maxLength: 64
          description: Exact approved PHQ-9 item-9 policy, or null when safetyStatus is NOT_APPLICABLE
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
    SupportEvaluationRequest:
      type: object
      additionalProperties: false
      required: [phq9AssessmentId, gad7AssessmentId]
      properties:
        phq9AssessmentId: { type: string, format: uuid }
        gad7AssessmentId: { type: string, format: uuid }
    SupportEvaluation:
      type: object
      additionalProperties: false
      required:
        [
          supportEvaluationId,
          policyVersion,
          evaluatedAt,
          supportTier,
          reasonCodes,
          evidence,
          nextStep,
          safetyGuidance,
          disclaimerCode,
          disclaimer,
        ]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        policyVersion: { type: string, const: mb-support-routing-capstone-v1 }
        evaluatedAt: { type: string, format: date-time }
        supportTier: { $ref: "#/components/schemas/SupportTier" }
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/SupportReasonCode" }
        evidence:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/SupportEvidence" }
        nextStep: { $ref: "#/components/schemas/SupportNextStep" }
        safetyGuidance:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          description: Reviewed local minimum guidance for SAFETY_FOLLOW_UP_RECOMMENDED; null for other tiers
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
        disclaimer:
          type: string
          const: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
    SupportEvaluationHistoryPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SupportEvaluation" }
        nextCursor: { type: [string, "null"], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    SupportEvidence:
      type: object
      additionalProperties: false
      required:
        [
          assessmentId,
          instrument,
          questionnaireVersion,
          scoringVersion,
          screeningLevel,
          safetyStatus,
          meaning,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
        safetyStatus: { $ref: "#/components/schemas/SafetyStatus" }
        meaning: { $ref: "#/components/schemas/ScreeningMeaning" }
    ScreeningMeaning:
      type: object
      additionalProperties: false
      required:
        [meaningCode, contentVersion, referencePeriodDays, text, limitation]
      properties:
        meaningCode: { type: string, pattern: "^[A-Z0-9_]+$", maxLength: 64 }
        contentVersion: { type: string, minLength: 1, maxLength: 64 }
        referencePeriodDays: { type: integer, const: 14 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        limitation: { type: string, minLength: 1, maxLength: 1000 }
    SupportNextStep:
      type: object
      additionalProperties: false
      required: [code, contentVersion, text, boundary]
      properties:
        code: { type: string, pattern: "^[A-Z0-9_]+$", maxLength: 64 }
        contentVersion: { type: string, minLength: 1, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        boundary: { type: string, minLength: 1, maxLength: 1000 }
    SupportTier:
      type: string
      description: Product support pathway, never a diagnosis or suicide-risk label
      enum:
        [
          SELF_GUIDED_SUPPORT,
          PROFESSIONAL_SUPPORT_RECOMMENDED,
          SAFETY_FOLLOW_UP_RECOMMENDED,
        ]
    SupportReasonCode:
      type: string
      enum:
        [
          ALL_SCREENING_LEVELS_MINIMAL_OR_MILD,
          PHQ9_MODERATE_OR_HIGHER,
          GAD7_MODERATE_OR_HIGHER,
          PHQ9_SAFETY_SCREEN_POSITIVE,
        ]
    ScreeningLevel:
      type: string
      enum: [MINIMAL, MILD, MODERATE, MODERATELY_SEVERE, SEVERE]
    SafetyStatus:
      type: string
      description: Questionnaire-specific safety result; NOT_APPLICABLE means no safety screen was performed
      enum: [NEGATIVE_SAFETY_SCREEN, POSITIVE_SAFETY_SCREEN, NOT_APPLICABLE]
    AnonymousSession:
      type: object
      additionalProperties: false
      required: [sessionId, sessionToken, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        sessionToken:
          { type: string, minLength: 43, maxLength: 512, readOnly: true }
        expiresAt: { type: string, format: date-time }
    ProposeSupportPlanDraftRequest:
      type: object
      additionalProperties: false
      required: [sourceSupportEvaluationId]
      properties:
        sourceSupportEvaluationId:
          type: string
          format: uuid
          description: One immutable SupportEvaluation v2 owned by the authenticated user
    ReplaceSupportPlanChoicesRequest:
      type: object
      additionalProperties: false
      required: [slotSelections]
      properties:
        slotSelections:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/SupportPlanSlotSelection' }
    SupportPlanSlotSelection:
      type: object
      additionalProperties: false
      required: [slotId, resourceId, contentVersion]
      properties:
        slotId: { type: string, minLength: 1, maxLength: 64 }
        resourceId: { type: string, format: uuid }
        contentVersion: { type: string, pattern: '^[0-9]+$' }
    ChangeSupportPlanStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, PAUSED, COMPLETED, DISCARDED] }
        completionReason:
          type: string
          enum: [USER_DECISION, PLAN_NO_LONGER_FITS, OTHER]
          description: Optional user-selected reason accepted only when status is COMPLETED; it never implies recovery
    ReplaceCurrentSupportPlanRequest:
      type: object
      additionalProperties: false
      required: [currentSupportPlanId, currentVersion]
      properties:
        currentSupportPlanId: { type: string, format: uuid }
        currentVersion: { type: integer, minimum: 0 }
    SupportPlanDraft:
      $ref: '#/components/schemas/SupportPlan'
    SupportPlan:
      type: object
      additionalProperties: false
      required: [supportPlanId, status, version, source, entitlement, rationale, safety, templateFamilies, slots, selectedResourceCount, createdAt, updatedAt, activatedAt, completedAt, completionReason, supersededAt, discardedAt, disclaimerCode, disclaimer]
      properties:
        supportPlanId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, SUPERSEDED, DISCARDED] }
        version: { type: integer, minimum: 0 }
        source: { $ref: '#/components/schemas/SupportPlanSource' }
        entitlement: { $ref: '#/components/schemas/SupportPlanEntitlementEvidence' }
        rationale: { $ref: '#/components/schemas/SupportPlanRationale' }
        safety: { $ref: '#/components/schemas/SupportPlanSafety' }
        templateFamilies:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/SupportPlanTemplateFamily' }
        slots:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/SupportPlanSlot' }
        selectedResourceCount: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        completionReason:
          type: [string, 'null']
          enum: [USER_DECISION, PLAN_NO_LONGER_FITS, OTHER, null]
          description: Optional user-selected completion reason; never evidence of recovery
        supersededAt: { type: [string, 'null'], format: date-time }
        discardedAt: { type: [string, 'null'], format: date-time }
        disclaimerCode: { type: string, const: WELLBEING_SUPPORT_NOT_TREATMENT }
        disclaimer:
          type: string
          minLength: 1
          maxLength: 1000
    SupportPlanHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SupportPlan' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    SupportPlanSource:
      type: object
      additionalProperties: false
      required: [supportEvaluationId, evaluationVersion, evaluationPolicyVersion, evaluatedAt, selectionPolicyVersion, resourceEligibilityPolicyVersion, resourcesResolvedAt]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        evaluationVersion: { type: integer, const: 2 }
        evaluationPolicyVersion: { type: string, const: mb-support-routing-capstone-v2 }
        evaluatedAt: { type: string, format: date-time }
        selectionPolicyVersion: { type: string, const: mb-support-plan-selection-v1 }
        resourceEligibilityPolicyVersion: { type: string, const: content-eligibility-v1 }
        resourcesResolvedAt: { type: string, format: date-time }
    SupportPlanEntitlementEvidence:
      type: object
      additionalProperties: false
      required: [packageCode, source, policyVersion, version, decidedAt]
      properties:
        packageCode: { type: string, enum: [PLUS, PREMIUM] }
        source: { type: string, enum: [DEMO, PAID] }
        policyVersion: { type: string, const: service-entitlement-v1 }
        version: { type: integer, minimum: 0 }
        decidedAt: { type: string, format: date-time }
    SupportPlanRationale:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code: { type: string, const: DOMAIN_AWARE_WELLBEING_SUPPORT }
        text: { type: string, minLength: 1, maxLength: 2048 }
    SupportPlanSafety:
      type: object
      additionalProperties: false
      required: [status, reasonCode, policyVersion, guidanceCode, guidance]
      properties:
        status: { $ref: '#/components/schemas/SafetyStatus' }
        reasonCode: { type: string, minLength: 1, maxLength: 64 }
        policyVersion: { type: string, minLength: 1, maxLength: 64 }
        guidanceCode: { type: string, enum: [REVIEW_SAFETY_GUIDANCE, STANDARD_SAFETY_REMINDER] }
        guidance: { type: string, minLength: 1, maxLength: 2048 }
    SupportPlanTemplateFamily:
      type: object
      additionalProperties: false
      required: [family, templateVersion, targetDomain]
      properties:
        family:
          type: string
          enum: [DEPRESSIVE_MAINTENANCE, DEPRESSIVE_SELF_GUIDED, DEPRESSIVE_PROFESSIONAL_ADJUNCT, ANXIETY_MAINTENANCE, ANXIETY_SELF_GUIDED, ANXIETY_PROFESSIONAL_ADJUNCT]
        templateVersion: { type: integer, const: 1 }
        targetDomain: { type: string, enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS] }
    SupportPlanSlot:
      type: object
      additionalProperties: false
      required: [slotId, kind, targetDomain, purposeCode, selectedResource, allowedAlternatives]
      properties:
        slotId: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [CORE, OPTIONAL] }
        targetDomain: { type: string, enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS] }
        purposeCode: { type: string, minLength: 1, maxLength: 64 }
        selectedResource:
          oneOf:
            - { $ref: '#/components/schemas/SupportPlanResource' }
            - { type: 'null' }
        allowedAlternatives:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/SupportPlanResource' }
    SupportPlanResource:
      type: object
      additionalProperties: false
      required: [resourceId, contentVersion, publicationId, role, category, title, summary]
      properties:
        resourceId: { type: string, format: uuid }
        contentVersion: { type: string, pattern: '^[0-9]+$' }
        publicationId: { type: string, format: uuid }
        role: { type: string, enum: [PRIMARY, ADJUNCT] }
        category: { type: string, enum: [BREATHING, MEDITATION, ARTICLE, VIDEO, JOURNALING, COMMUNITY] }
        title: { type: string, minLength: 1, maxLength: 255 }
        summary: { type: string, minLength: 1, maxLength: 4096 }
        externalUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
    ChangeSupportPlanOccurrenceStateRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [COMPLETED, SKIPPED] }
    ReplaceSupportPlanOccurrenceEngagementRequest:
      type: object
      additionalProperties: false
      required: [state, hidden, helpfulness, barrierCode, reflection, summaryReuseApproved]
      properties:
        state: { type: string, enum: [SCHEDULED, COMPLETED, SKIPPED] }
        hidden:
          type: boolean
          description: Reversible owner display preference; it does not change engagement state.
        helpfulness:
          type: [string, 'null']
          enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null]
          description: Optional self-reported helpfulness, valid only with COMPLETED.
        barrierCode:
          type: [string, 'null']
          enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null]
          description: Optional structured barrier, valid only with SKIPPED.
        reflection:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: Optional bounded owner reflection; excluded from minimized integration facts.
        summaryReuseApproved:
          type: boolean
          description: Explicit approval for later bounded-summary reuse; never grants live checklist access.
    SupportPlanOccurrenceList:
      type: object
      additionalProperties: false
      required: [supportPlanId, supportPlanStatus, schedulePolicyVersion, from, through, occurrences, interpretationCode]
      properties:
        supportPlanId: { type: string, format: uuid }
        supportPlanStatus: { type: string, enum: [ACTIVE, PAUSED] }
        schedulePolicyVersion: { type: string, const: support-plan-activity-schedule-v1 }
        from: { type: string, format: date }
        through: { type: string, format: date }
        occurrences:
          type: array
          maxItems: 217
          items: { $ref: '#/components/schemas/SupportPlanOccurrence' }
        interpretationCode: { type: string, const: SELF_REPORTED_WELLBEING_ACTIVITY_NOT_TREATMENT_ADHERENCE }
    SupportPlanOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, supportPlanId, scheduleId, scheduleVersion, localDate, localTime, timezone, scheduledAt, state, displayState, stateReason, version, source, updatedAt, completedAt, skippedAt, cancelledAt, hidden, helpfulness, barrierCode, reflection, summaryReuseApproved, engagementUpdatedAt, interpretationCode]
      properties:
        occurrenceId: { type: string, format: uuid }
        supportPlanId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        scheduleVersion: { type: integer, minimum: 1 }
        localDate: { type: string, format: date }
        localTime: { type: string, format: time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        scheduledAt: { type: string, format: date-time }
        state: { type: string, enum: [SCHEDULED, COMPLETED, SKIPPED, CANCELLED] }
        displayState: { type: string, enum: [SCHEDULED, MISSED, COMPLETED, SKIPPED, CANCELLED] }
        stateReason:
          type: [string, 'null']
          enum: [PLAN_PAUSED, PLAN_COMPLETED, PLAN_REPLACED, null]
        version: { type: integer, minimum: 0 }
        source: { $ref: '#/components/schemas/SupportPlanOccurrenceSource' }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        skippedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        hidden:
          type: boolean
          description: Owner-controlled display preference independent of completion state.
        helpfulness:
          type: [string, 'null']
          enum: [NOT_HELPFUL, A_LITTLE_HELPFUL, HELPFUL, VERY_HELPFUL, null]
        barrierCode:
          type: [string, 'null']
          enum: [LOW_ENERGY, NOT_ENOUGH_TIME, DIFFICULT_TO_START, NOT_A_GOOD_FIT, OTHER, null]
        reflection: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        summaryReuseApproved:
          type: boolean
          description: Owner approval for a later bounded summary, not specialist checklist access.
        engagementUpdatedAt: { type: [string, 'null'], format: date-time }
        interpretationCode: { type: string, const: SELF_REPORTED_WELLBEING_ACTIVITY_NOT_TREATMENT_ADHERENCE }
    SupportPlanOccurrenceSource:
      type: object
      additionalProperties: false
      required: [type, supportPlanVersion, slotId, resourceId, contentVersion, title]
      properties:
        type: { type: string, enum: [RESOURCE, JOURNAL_PROMPT, EMOTION_CHECK_IN_PROMPT] }
        supportPlanVersion: { type: integer, minimum: 1 }
        slotId: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        resourceId: { type: [string, 'null'], format: uuid }
        contentVersion: { type: [string, 'null'], pattern: '^[0-9]+$' }
        title: { type: string, minLength: 1, maxLength: 255 }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }
        correlationId: { type: string, format: uuid }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    ValidationProblem:
      description: Request validation failed with VALIDATION_FAILED or a field violation such as INCOMPLETE_QUESTIONNAIRE or INVALID_ANSWER; no result was persisted
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/validation-failed
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
            violations:
              [
                {
                  field: answers,
                  code: INCOMPLETE_QUESTIONNAIRE,
                  message: one answer is required for every question,
                },
              ]
    UnauthorizedProblem:
      description: Authentication is missing or invalid (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ForbiddenProblem:
      description: Caller lacks the USER role or owner authorization (CARE_USER_REQUIRED or RESOURCE_NOT_OWNED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvalidAnonymousSessionProblem:
      description: Anonymous session identifier or token is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/invalid-anonymous-session,
              title: Anonymous session is invalid,
              status: 401,
              code: INVALID_ANONYMOUS_SESSION,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    ExpiredAnonymousSessionProblem:
      description: Anonymous session and its result have expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/anonymous-session-expired,
              title: Anonymous session expired,
              status: 410,
              code: ANONYMOUS_SESSION_EXPIRED,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    NotFoundProblem:
      description: Requested resource does not exist (PROFILE_NOT_FOUND, QUESTIONNAIRE_NOT_FOUND, ASSESSMENT_NOT_FOUND, or SUPPORT_EVALUATION_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProfileNotFoundProblem:
      description: No Care profile has been created yet; clients should present the normal profile onboarding state (PROFILE_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: /problems/profile-not-found
            title: Care profile was not found
            status: 404
            code: PROFILE_NOT_FOUND
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
    ConflictProblem:
      description: Request conflicts with stored state (IDEMPOTENCY_KEY_REUSED, QUESTIONNAIRE_VERSION_UNAVAILABLE, or SUPPORT_EVIDENCE_INCOMPATIBLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanEntitlementProblem:
      description: Current authoritative package is FREE (SUPPORT_PLAN_ENTITLEMENT_REQUIRED); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanEligibilityProblem:
      description: Current source facts cannot produce a bounded draft (SUPPORT_EVALUATION_STALE, SUPPORT_PLAN_CORE_UNAVAILABLE, or RESOURCE_VERSION_STALE); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanDependencyProblem:
      description: Entitlement or exact resource eligibility could not be trusted (ENTITLEMENT_UNAVAILABLE or RESOURCE_ELIGIBILITY_UNAVAILABLE); no draft was created
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanDraftNotFoundProblem:
      description: The authenticated user has no current draft (SUPPORT_PLAN_DRAFT_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanCurrentNotFoundProblem:
      description: The authenticated user has no ACTIVE or PAUSED SupportPlan (SUPPORT_PLAN_CURRENT_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanNotFoundProblem:
      description: The SupportPlan is absent or not owned by the authenticated user (SUPPORT_PLAN_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanChoiceConflictProblem:
      description: The choice update targets a non-draft, omits a core slot, injects a version, or duplicates a version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanActivationConflictProblem:
      description: The activation command reuses a key differently, targets a non-draft, conflicts with another current plan, or fails current policy or eligibility
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanVersionProblem:
      description: If-Match does not equal the current Care-owned SupportPlan version (SUPPORT_PLAN_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanLifecycleConflictProblem:
      description: The requested lifecycle transition is invalid or a replacement source is stale (SUPPORT_PLAN_TRANSITION_INVALID)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceNotFoundProblem:
      description: The occurrence is absent or not owned by the authenticated user (OCCURRENCE_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceConflictProblem:
      description: The occurrence is cancelled, already has another terminal input, or its source plan is no longer current (OCCURRENCE_NOT_OPEN or SUPPORT_PLAN_NOT_CURRENT)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceVersionProblem:
      description: If-Match does not equal the Care-owned occurrence version (OCCURRENCE_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SupportPlanOccurrenceResult:
      description: Authoritative occurrence with local-time and source provenance
      headers:
        ETag:
          $ref: '#/components/headers/SupportPlanETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SupportPlanOccurrence' }
    SupportPlanCommandResult:
      description: Updated authoritative plan or the identical persisted command outcome
      headers:
        ETag:
          $ref: '#/components/headers/SupportPlanETag'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SupportPlan' }
    InsufficientComparableDataProblem:
      description: The selected owned result has no immediately preceding valid result with the same instrument and scoring version
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            {
              type: /problems/insufficient-comparable-data,
              title: Comparable assessment data is unavailable,
              status: 409,
              code: INSUFFICIENT_COMPARABLE_DATA,
              correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65,
            }
    IdempotencyConflictProblem:
      description: Idempotency key was previously used with a different consent request (IDEMPOTENCY_KEY_REUSED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    VersionProblem:
      description: If-Match is missing for an existing profile or does not match its current version (PROFILE_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimitProblem:
      description: Request exceeded the bounded anonymous or Care API rate limit (RATE_LIMITED)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
