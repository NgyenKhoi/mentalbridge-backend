      oneOf:
        - required: [trigger, provinceCode]
        - required: [trigger, manualLocation]
    CareSafetyDirectoryState:
      type: string
      enum: [RESULTS, EMPTY, INVALID_AREA, UNAVAILABLE]
    CareSafetyDirectoryEntry:
      type: object
      additionalProperties: true
      required:
        [
          directoryEntryId,
          name,
          type,
          phone,
          address,
          coverage,
          sourceName,
          sourceReference,
          reviewedAt,
          verifiedAt,
        ]
      properties:
        directoryEntryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [FACILITY, HOTLINE] }
        phone: { type: string, minLength: 1, maxLength: 64 }
        address: { type: [string, "null"], maxLength: 500 }
        coverage:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        sourceName: { type: string }
        sourceReference: { type: string }
        reviewedAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }
    CareSafetyDirectoryLookupResponse:
      type: object
      additionalProperties: false
      required:
        [trigger, state, areaWording, safetyGuidance, limitation, entries]
      properties:
        trigger: { $ref: "#/components/schemas/SafetyDirectoryTrigger" }
        state: { $ref: "#/components/schemas/CareSafetyDirectoryState" }
        areaWording: { type: string, const: Cơ sở trong khu vực đã chọn }
        safetyGuidance:
          type: string
          const: Nếu bạn cảm thấy mình không an toàn hoặc có nguy cơ gây hại cho bản thân, hãy chủ động liên hệ dịch vụ khẩn cấp hoặc cơ sở y tế phù hợp tại khu vực của bạn.
        limitation:
          type: string
          const: MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CareSafetyDirectoryEntry" }
    ProfilePutRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        dateOfBirth:
          type: [string, "null"]
          format: date
          description: Optional date of birth. When present, the user must have reached their 18th anniversary on the request date; no maximum age is inferred.
        gender: { type: [string, "null"], minLength: 1, maxLength: 32 }
        locale:
          type: string
          const: vi-VN
          deprecated: true
          description: Compatibility input only; this release always stores vi-VN.
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
          deprecated: true
          description: Compatibility input only; this release always stores Asia/Ho_Chi_Minh.
        reminderEnabled:
          type: boolean
          const: false
          deprecated: true
          description: Compatibility input only; reminders are not implemented and remain disabled.
    Profile:
      type: object
      additionalProperties: false
      required:
        [
          accountId,
          displayName,
          locale,
          timezone,
          reminderEnabled,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        dateOfBirth: { type: [string, "null"], format: date }
        gender: { type: [string, "null"], minLength: 1, maxLength: 32 }
        locale:
          {
            type: string,
            minLength: 2,
            maxLength: 16,
            pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$",
          }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        reminderEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    ConsentType:
      type: string
