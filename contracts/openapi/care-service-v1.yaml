                type: https://mentalbridge.io/errors/RESOURCE_EVIDENCE_UNAVAILABLE
                title: Resource evidence unavailable
                status: 503
                detail: Content evidence could not be verified. Retry later.
                code: RESOURCE_EVIDENCE_UNAVAILABLE
                correlationId: 78000000-0000-4000-8000-000000000001
  /api/v2/support-plan-occurrences/{occurrenceId}/emotion-check-in/reconcile:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan v3]
      operationId: reconcileOwnEmotionCheckInOccurrence
      summary: Reconcile one native emotion action against its owner's check-in fact
      description: |
        Explicit USER command with no request body or caller-supplied fact identity.
        Care resolves the owned native EMOTION_CHECK_IN occurrence's local date,
        timezone and action source, then reads the minimized Journal/AI evidence
        outside any database transaction. Subject, local date, frozen timezone and
        action/source authority must match before locked acceptance. One fact can
        complete only one occurrence. Identical retries preserve accepted evidence,
        completion time and version without another event or idempotency ledger.
        MISSING and DELETED never create completion. A later deletion does not erase
        an already accepted historical fact: sourceState and occurrenceState remain
        separate. Dependency uncertainty returns 503, never false absence or success.
        No emotion value, intensity, factor, note, interpretation or AI output enters
        Care. This command does not create actions or change plan eligibility/lifecycle.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authoritative source state and the persisted occurrence outcome
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmotionCheckInOccurrenceReconciliation' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: Unsupported action, inactive plan, non-open occurrence, mismatched local date/timezone or evidence already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Emotion evidence owner unavailable or its projection invalid; no completion is recorded
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v2/support-plan-occurrences/{occurrenceId}/journal/reconcile:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan v3]
      operationId: reconcileOwnJournalOccurrence
      summary: Reconcile a Journal writing action with an exact owned saved entry
      description: |
        Explicit USER command. journalId selects a candidate, never asserts completion.
        Care resolves the owned native JOURNAL action and occurrence, closes the
        read transaction, then reads Journal/AI's content-free creation fact with
        the verified owner bearer. Locked acceptance checks subject, exact entry,
        action/source link, occurrence local date in its schedule timezone, and
        creation at or after plan/action activation. Completion uses the server
        creation instant, not the user-selected Journal date or an edit timestamp.
        One entry creation fact may satisfy only one occurrence; repeats preserve
        accepted evidence, completion time, version and the one minimized event.
        MISSING and DELETED never create completion or erase accepted history.
        Once completed, another entry cannot replace the accepted reference.
        Dependency uncertainty returns 503 rather than absence or success.
        No text, preview, tags, mood, AI reflection or analysis enters Care.
        This does not grant AI-processing, specialist sharing or reflection reuse,
        change plan lifecycle, or describe writing as recovery/treatment adherence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [journalId]
              properties:
                journalId: { type: string, format: uuid }
      responses:
        '200':
          description: Current Journal source state and persisted occurrence outcome
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalOccurrenceReconciliation' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: Unsupported/inactive action, non-open/future occurrence, writing date/activation mismatch, stale link or conflicting/used evidence
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Journal evidence owner unavailable or invalid; no completion recorded
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v2/support-plan-personalization:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan personalization]
      operationId: getOwnSupportPlanPersonalization
      summary: Read the authenticated user's current SupportPlan preferences
      description: |
        Returns the latest immutable Care-owned preference revision. Existing
        users without a saved revision receive NOT_PROVIDED at revision zero.
        The fields describe practical preferences only; they are not symptoms,
        diagnoses, screening evidence, or permission to bypass Care policy.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current preference revision or deterministic not-provided fallback
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanPersonalizationETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanPersonalization' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      tags: [SupportPlan personalization]
      operationId: replaceOwnSupportPlanPersonalization
      summary: Replace the authenticated user's bounded SupportPlan preferences
      description: |
        Writes a new immutable revision only when the replacement differs from
        the current value. Revision zero creates the first saved value. Empty
        optional fields explicitly record SKIPPED. Saving preferences never
        mutates an active or paused plan; planReview identifies the explicit
        review path when the current plan used another preference revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSupportPlanPersonalizationRequest' }
      responses:
        '200':
          description: Persisted current preference revision
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanPersonalizationETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanPersonalization' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '412': { $ref: '#/components/responses/SupportPlanPersonalizationVersionProblem' }
  /api/v1/anonymous-assessment-sessions:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: createAnonymousAssessmentSession
      summary: Create an isolated short-lived anonymous assessment session
      description: |
        The response returns the session token once. The server stores only its
        hash. The expiry instant comes from an approved deployment policy; this
        contract deliberately does not invent a duration. Empty retry sessions may
        expire independently and are not durable user history.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Anonymous session created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnonymousSession" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /api/v1/anonymous-assessment-sessions/{sessionId}/assessments:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: submitAnonymousAssessment
      summary: Submit and score a complete published assessment inside one anonymous session
      description: |
        Session ownership is proven by the anonymous token, never by the path UUID
        alone. The result expires with the session and cannot be claimed by a later
        authenticated account. Scoring and atomic persistence are identical to the
        authenticated flow.
      security:
        - anonymousSessionToken: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentSubmissionRequest" }
      responses:
        "201":
          description: Anonymous assessment accepted and scored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnonymousAssessment" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/InvalidAnonymousSessionProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "410": { $ref: "#/components/responses/ExpiredAnonymousSessionProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
