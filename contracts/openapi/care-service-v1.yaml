openapi: 3.1.0
info:
  title: MentalBridge Care API
  version: 1.0.0
  description: |
    V1 contracts for the Care-owned profile, platform consent, and PHQ-9 foundation.
    Profile, consent, questionnaire, and assessment paths are implemented. Assessment
    clients submit only the backend-published privacy disclosure version, versioned
    question identifiers, and answer values; Care computes the score, screening band,
    independent safety status, and policy provenance.
    A screening result is not a diagnosis. ADR 0009 keeps screening severity and
    item-9 safety status independent, prohibits automatic escalation, and removes
    the hotline catalogue. The privacy-capstone-v3 disclosure and bounded anonymous
    lifetime are approved only for controlled local/test/demo use. Public real-user
    collection remains blocked on production privacy, retention, security, and legal review.

    Fields not marked nullable reject null. Omitted optional profile fields leave
    no stored value. Anonymous session credentials are bearer secrets returned
    once, stored only as hashes, and never attach an anonymous result to an account.
servers:
  - url: /
tags:
  - name: Profile
  - name: Consent
  - name: Privacy disclosure
  - name: AI processing disclosure
  - name: Questionnaire
  - name: Assessment
  - name: Support evaluation
  - name: SupportPlan draft
  - name: SupportPlan activity
  - name: Anonymous assessment
paths:
  /api/v1/profile:
    x-mentalbridge-status: implemented
    get:
      tags: [Profile]
      operationId: getOwnCareProfile
      summary: Read the authenticated user's Care-owned profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profile found
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/ProfileNotFoundProblem' }
    put:
      tags: [Profile]
      operationId: putOwnCareProfile
      summary: Create or replace the authenticated user's editable profile
      description: |
        The account identifier comes only from the verified JWT subject. If-Match
        is omitted when creating the profile and is required for replacement of an
        existing profile. A stale version fails without overwriting newer data.
        Locale, timezone, and reminders are not user-configurable in this release;
        the server stores vi-VN, Asia/Ho_Chi_Minh, and reminders disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePutRequest' }
            example:
              displayName: Lan Nguyen
              dateOfBirth: '2000-01-02'
      responses:
        '200':
          description: Existing profile replaced
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '201':
          description: Profile created
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/consents:
    x-mentalbridge-status: implemented
    get:
      tags: [Consent]
      operationId: getOwnCurrentConsents
      summary: Read the latest explicit platform consent decisions
      description: |
        This lookup does not require a Care profile. A new account with no profile
        and no decision receives 200 with decisions: []. A missing consent type
        means no decision has been recorded; it is not silently treated as a grant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Latest decisions returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentCollection' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/consents/ai-processing/authorization:
    x-mentalbridge-status: implemented
    get:
      tags: [Consent]
      operationId: authorizeOwnAiProcessing
      summary: Resolve the authenticated user's current AI-processing consent
      description: |
        Returns a minimal current decision for exact-revision or bounded
        longitudinal journal analysis. Journal/AI forwards the verified end-user
        bearer credential for both request-time and pre-attempt checks. Missing,
        revoked, or outdated consent fails closed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current authorization decision returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProcessingAuthorization' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/consent-decisions:
    x-mentalbridge-status: implemented
    post:
      tags: [Consent]
      operationId: recordOwnConsentDecision
      summary: Append a versioned platform consent grant or refusal
      description: |
        Repeating the same user-scoped idempotency key and identical request returns
        the original decision. Reusing the key for a different request returns a
        conflict. Specialist access is a separate scoped grant workflow and is not
        represented by a broad platform-consent toggle.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentDecisionRequest' }
            example:
              consentType: PRIVACY_POLICY
              policyVersion: privacy-capstone-v3
              granted: true
      responses:
        '201':
          description: Consent decision appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDecision' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
  /api/v1/privacy-disclosures/current:
    x-mentalbridge-status: implemented
    get:
      tags: [Privacy disclosure]
      operationId: getCurrentPrivacyDisclosure
      summary: Read the backend-owned disclosure required for Care assessment processing
      description: |
        Returns the exact controlled-Capstone Vietnamese text and version. Clients
        render this response and must not keep an independent disclosure copy.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current disclosure returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyDisclosure' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/ai-processing-disclosures/current:
    x-mentalbridge-status: implemented
    get:
      tags: [AI processing disclosure]
      operationId: getCurrentAiProcessingDisclosure
      summary: Read the backend-owned disclosure for journal AI processing
      description: |
        Covers only explicit exact-revision and bounded longitudinal journal
        analysis. It excludes research, marketing, specialist sharing, and safety
        decisions. Story 6203 or a dedicated frontend follow-up renders this text.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current AI-processing disclosure returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProcessingDisclosure' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/questionnaires/{instrument}/current:
    x-mentalbridge-status: implemented
    get:
      tags: [Questionnaire]
      operationId: getCurrentQuestionnaire
      summary: Read the current published questionnaire for an instrument and locale
      description: Only the current reviewed published PHQ-9 or GAD-7 definition is returned.
      parameters:
        - $ref: '#/components/parameters/Instrument'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current questionnaire returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/questionnaires/definitions/{definitionId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Questionnaire]
      operationId: getQuestionnaireDefinition
      summary: Read one immutable published or retired questionnaire definition
      description: |
        Resolves the exact definition referenced by a historical assessment. Draft
        definitions are never exposed, and callers must not replace the stored
        definition identifier with the current questionnaire when reopening a result.
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Immutable questionnaire definition returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/assessments:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: listOwnAssessments
      summary: List non-voided assessment summaries owned by the authenticated caller
      description: |
        Results are ordered by submittedAt descending and assessmentId descending.
        The opaque cursor identifies the last item of the previous page. Raw answers
        and other users' data are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned assessment summaries returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      tags: [Assessment]
      operationId: submitAuthenticatedAssessment
      summary: Submit and score a complete authenticated PHQ-9 or GAD-7 assessment
      description: |
        Care ignores no answers and accepts no client score, band, or safety result.
        It validates the exact published questionnaire version, requires one answer
        for every question, computes the result locally, and persists submission,
        answers, result, and outbox record atomically. An identical user-scoped
        idempotent retry returns the original result.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentSubmissionRequest' }
      responses:
        '201':
          description: Assessment accepted and scored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/assessments/{assessmentId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: getOwnAssessment
      summary: Read one authenticated assessment result owned by the caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned assessment returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/assessments/{assessmentId}/progress:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: getOwnAssessmentProgress
      summary: Compare one selected owned assessment with its preceding compatible result
      description: |
        The selected assessment is the current result. Care selects the immediately
        preceding non-voided result owned by the caller with the same instrument and
        identical scoring version, ordered deterministically by submittedAt and
        assessmentId. The response is descriptive only and makes no diagnosis,
        treatment, causation, recovery, clinical change, or resolved-safety claim.
        Anonymous sessions have no progress operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Descriptive comparison returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentProgress' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/InsufficientComparableDataProblem' }
  /api/v1/support-evaluations:
    x-mentalbridge-status: implemented
    post:
      tags: [Support evaluation]
      operationId: evaluateOwnScreeningSupport
      summary: Resolve deterministic support from explicitly selected PHQ-9 and GAD-7 results
      description: |
        The authenticated USER explicitly selects one owned PHQ-9 result and one
        owned GAD-7 result. Care validates immutable questionnaire/scoring evidence,
        applies the published safety-first policy, and persists one reproducible
        evaluation plus a transactional outbox event. It never calculates a
        composite score, diagnoses a condition, contacts another person, books an
        appointment, or shares assessment data. Local reviewed safety guidance
        remains available without Content, AI, Kafka, Redis, Realtime, or
        notification dependencies.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportEvaluationRequest' }
            example:
              phq9AssessmentId: 10000000-0000-4000-8000-000000000101
              gad7AssessmentId: 10000000-0000-4000-8000-000000000102
      responses:
        '201':
          description: Deterministic support evaluation created or replayed
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportEvaluation' }
              examples:
                selfGuided:
                  $ref: '#/components/examples/SelfGuidedSupportEvaluation'
                professionalSupport:
                  $ref: '#/components/examples/ProfessionalSupportEvaluation'
                safetyFollowUp:
                  $ref: '#/components/examples/SafetyFollowUpSupportEvaluation'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/support-evaluations/{supportEvaluationId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Support evaluation]
      operationId: getOwnScreeningSupportEvaluation
      summary: Reopen one immutable owned support evaluation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportEvaluationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Immutable support evaluation returned with its original policy content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportEvaluation' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/support-plans:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan draft]
      operationId: proposeOwnSupportPlanDraft
      summary: Create or replay one deterministic paid SupportPlan draft
      description: |
        The authenticated USER supplies only one owned SupportEvaluation v2 reference.
        Care resolves the current Consultation-owned entitlement, revalidates current
        SupportEvaluation policy compatibility, resolves exact Content-owned resource
        versions, and persists at most one DRAFT. FREE entitlement, stale or ineligible
        source facts, and dependency uncertainty create no plan. AI and clients do not
        select resources, template families, eligibility, or safety behavior.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeSupportPlanDraftRequest' }
      responses:
        '201':
          description: The newly created draft, the existing current draft, or an identical idempotent replay
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanDraft' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/SupportPlanEntitlementProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanEligibilityProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
  /api/v1/support-plans/current-draft:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan draft]
      operationId: getOwnCurrentSupportPlanDraft
      summary: Reload the authenticated user's same current SupportPlan draft
      description: |
        Returns the persisted draft snapshot without re-running entitlement or
        resource-provider decisions. The response retains the exact rationale,
        choices, source versions, and safety copy used when Care created it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current persisted draft
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanDraft' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/SupportPlanDraftNotFoundProblem' }
  /api/v1/support-plans/current:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan draft]
      operationId: getOwnCurrentSupportPlan
      summary: Reload the authenticated user's authoritative active or paused SupportPlan
      description: |
        Returns the single Care-owned current plan from persisted state without
        deriving lifecycle state in the client. A draft is not a current plan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current authoritative plan
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlan' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/SupportPlanCurrentNotFoundProblem' }
  /api/v1/support-plans/history:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan activity]
      operationId: listOwnTerminalSupportPlans
      summary: List immutable terminal SupportPlan snapshots
      description: |
        Returns only the authenticated user's COMPLETED, SUPERSEDED, and
        DISCARDED plans in stable newest-first order. This persisted history is
        never rebuilt from assessments, AI output, or current eligibility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Stable terminal SupportPlan history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/support-plans/{supportPlanId}:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan activity]
      operationId: getOwnSupportPlan
      summary: Reload one owned SupportPlan snapshot
      description: |
        Returns the persisted owner snapshot in any lifecycle state. Terminal
        snapshots are immutable and are not recomputed from newer evidence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned SupportPlan snapshot
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlan' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
  /api/v1/support-plans/{supportPlanId}/choices:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan draft]
      operationId: replaceOwnSupportPlanDraftChoices
      summary: Keep, swap, or remove only server-admitted draft choices
      description: |
        The complete desired selection is accepted only for an owned DRAFT.
        Every CORE slot is required; an OPTIONAL slot may be omitted. Care
        rejects unknown slots, injected exact versions, duplicate versions,
        and stale plan versions. A changed desired selection is revalidated
        against current entitlement, evaluation/template policy, and exact
        resource eligibility. Replacing the current selection with the same
        complete desired state is a no-op and keeps the existing version.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSupportPlanChoicesRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/SupportPlanEntitlementProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanChoiceConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
  /api/v1/support-plans/{supportPlanId}/activate:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan draft]
      operationId: activateOwnSupportPlan
      summary: Explicitly activate a fully revalidated paid SupportPlan draft
      description: |
        The authenticated user explicitly activates the owned draft. Care
        immediately revalidates current paid entitlement, SupportEvaluation,
        template policy, every selected exact resource version and eligibility
        role before opening the local transaction. The normal command also
        applies to safety-positive users and accepts no safety acknowledgement field.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/SupportPlanEntitlementProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanActivationConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
  /api/v1/support-plans/{supportPlanId}/status:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan activity]
      operationId: replaceOwnSupportPlanStatus
      summary: Apply an explicit idempotent SupportPlan lifecycle state
      description: |
        ACTIVE may resume PAUSED, PAUSED may pause ACTIVE, COMPLETED ends an
        ACTIVE or PAUSED plan without implying recovery, and DISCARDED removes
        a DRAFT from current consideration. Repeating the already-applied desired
        state is a no-op. An optional stable completion reason is accepted only
        for COMPLETED and becomes part of the immutable terminal snapshot.
        Pausing cancels future scheduled occurrences; resuming
        restores only still-future pause-cancelled occurrences and extends the
        bounded horizon; completing cancels future open occurrences.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSupportPlanStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanLifecycleConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
  /api/v1/support-plans/{supportPlanId}/replace:
    x-mentalbridge-status: implemented
    post:
      tags: [SupportPlan activity]
      operationId: replaceOwnCurrentSupportPlan
      summary: Explicitly replace the current plan with a revalidated draft
      description: |
        Care revalidates the owned draft before one local transaction marks the
        former current plan SUPERSEDED, cancels its future occurrences, activates
        the draft, and creates the replacement plan's deterministic schedules.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCurrentSupportPlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/SupportPlanEntitlementProblem' }
        '404': { $ref: '#/components/responses/SupportPlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanLifecycleConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanVersionProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
  /api/v1/support-plan-occurrences:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan activity]
      operationId: listOwnSupportPlanOccurrences
      summary: List current-plan occurrences for a bounded local-date window
      description: |
        The inclusive window is at most 31 local days and is limited to the
        supported recent/today/upcoming range. For an ACTIVE plan, Care safely
        fills any missing logical occurrences before returning the persisted
        list. Generation is deterministic and protected by a unique local-intent
        key, so retries and plan reloads do not duplicate occurrences. DAILY and
        WEEKLY schedules preserve the profile's IANA timezone. A daylight gap
        moves to the first valid local instant; an overlap uses the earlier offset.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: through
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Persisted occurrence window for the current plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportPlanOccurrenceList' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/SupportPlanCurrentNotFoundProblem' }
  /api/v1/support-plan-occurrences/{occurrenceId}:
    x-mentalbridge-status: implemented
    get:
      tags: [SupportPlan activity]
      operationId: getOwnSupportPlanOccurrence
      summary: Read one owned occurrence with source and local-time provenance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanOccurrenceResult' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/SupportPlanOccurrenceNotFoundProblem' }
  /api/v1/support-plan-occurrences/{occurrenceId}/state:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan activity]
      operationId: replaceOwnSupportPlanOccurrenceState
      summary: Mark an occurrence completed or skipped as a self-reported input
      description: |
        This user action is not treatment adherence, clinical success, or
        recovery evidence. Repeating the same desired state is a no-op. AI may
        phrase a label but cannot call this command or select the state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSupportPlanOccurrenceStateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanOccurrenceResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/SupportPlanOccurrenceNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanOccurrenceConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanOccurrenceVersionProblem' }
  /api/v1/support-plan-occurrences/{occurrenceId}/engagement:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan activity]
      operationId: replaceOwnSupportPlanOccurrenceEngagement
      summary: Replace one current occurrence's user-owned engagement
      description: |
        The complete desired state is naturally idempotent. SCHEDULED reopens
        a completed or skipped occurrence and clears its signals. Helpfulness
        belongs only to completion, while a barrier belongs only to skip.
        Reflection is bounded and never published in the minimized integration
        fact. Hiding is a reversible display preference. Only an occurrence in
        the authenticated user's ACTIVE current plan accepts this command.
        These values are self-reported wellbeing engagement, not adherence,
        clinical outcome, symptom improvement, or recovery.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSupportPlanOccurrenceEngagementRequest' }
      responses:
        '200': { $ref: '#/components/responses/SupportPlanOccurrenceResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/SupportPlanOccurrenceNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanOccurrenceConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanOccurrenceVersionProblem' }
    delete:
      tags: [SupportPlan activity]
      operationId: deleteOwnSupportPlanOccurrenceEngagement
      summary: Delete one current occurrence's mutable engagement
      description: |
        Clears completion/skip, visibility, helpfulness, barrier, reflection,
        and reuse approval while retaining immutable schedule and exact source
        provenance. Repeating the already-cleared desired result is a no-op.
        The controlled demo retains engagement with its occurrence until this
        owner command or account-deletion coordination removes it; no public
        production retention duration is claimed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanOccurrenceResult' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/SupportPlanOccurrenceNotFoundProblem' }
        '409': { $ref: '#/components/responses/SupportPlanOccurrenceConflictProblem' }
        '412': { $ref: '#/components/responses/SupportPlanOccurrenceVersionProblem' }
  /api/v1/anonymous-assessment-sessions:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: createAnonymousAssessmentSession
      summary: Create an isolated short-lived anonymous assessment session
      description: |
        The response returns the session token once. The server stores only its
        hash. The expiry instant comes from an approved deployment policy; this
        contract deliberately does not invent a duration. Empty retry sessions may
        expire independently and are not durable user history.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Anonymous session created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousSession' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/anonymous-assessment-sessions/{sessionId}/assessments:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: submitAnonymousAssessment
      summary: Submit and score a complete published assessment inside one anonymous session
      description: |
        Session ownership is proven by the anonymous token, never by the path UUID
        alone. The result expires with the session and cannot be claimed by a later
        authenticated account. Scoring and atomic persistence are identical to the
        authenticated flow.
      security:
        - anonymousSessionToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentSubmissionRequest' }
      responses:
        '201':
          description: Anonymous assessment accepted and scored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAssessment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/InvalidAnonymousSessionProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '410': { $ref: '#/components/responses/ExpiredAnonymousSessionProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/anonymous-assessment-sessions/{sessionId}/assessments/{assessmentId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Anonymous assessment]
      operationId: getAnonymousAssessment
      summary: Read one unexpired assessment from its isolated anonymous session
      security:
        - anonymousSessionToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Anonymous assessment returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAssessment' }
        '401': { $ref: '#/components/responses/InvalidAnonymousSessionProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '410': { $ref: '#/components/responses/ExpiredAnonymousSessionProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
components:
  headers:
