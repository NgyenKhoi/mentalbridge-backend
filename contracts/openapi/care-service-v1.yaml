      properties:
        consentType: { type: string, const: PRIVACY_POLICY }
        policyVersion: { type: string, const: privacy-capstone-v3 }
        granted: { type: boolean }
    AiProcessingConsentDecisionRequest:
      type: object
      additionalProperties: false
      required: [consentType, policyVersion, granted]
      properties:
        consentType: { type: string, const: AI_PROCESSING }
        policyVersion: { type: string, const: ai-processing-capstone-v2 }
        granted: { type: boolean }
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [decisionId, consentType, policyVersion, granted, decidedAt]
      properties:
        decisionId: { type: string, format: uuid }
        consentType: { $ref: "#/components/schemas/ConsentType" }
        policyVersion: { type: string, minLength: 1, maxLength: 64 }
        granted: { type: boolean }
        decidedAt: { type: string, format: date-time }
    ConsentCollection:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/ConsentDecision" }
    AiProcessingAuthorization:
      type: object
      additionalProperties: false
      required: [authorized, reason, consentType, policyVersion, decidedAt]
      properties:
        authorized: { type: boolean }
        reason:
          type: string
          enum: [GRANTED, MISSING, REVOKED, POLICY_OUTDATED]
        consentType: { type: string, const: AI_PROCESSING }
        policyVersion:
          type: [string, "null"]
          maxLength: 64
        decidedAt:
          type: [string, "null"]
          format: date-time
    PrivacyDisclosure:
      type: object
      additionalProperties: false
      required: [consentType, version, locale, title, content, capstoneOnly]
      properties:
        consentType: { type: string, const: PRIVACY_POLICY }
        version: { type: string, const: privacy-capstone-v3 }
        locale: { type: string, const: vi-VN }
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { type: string, minLength: 1, maxLength: 4000 }
        capstoneOnly: { type: boolean, const: true }
    AiProcessingDisclosure:
      type: object
      additionalProperties: false
      required: [consentType, version, locale, title, content, capstoneOnly]
      properties:
        consentType: { type: string, const: AI_PROCESSING }
        version: { type: string, const: ai-processing-capstone-v2 }
        locale: { type: string, const: vi-VN }
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { type: string, minLength: 1, maxLength: 4000 }
        capstoneOnly: { type: boolean, const: true }
    Instrument:
      type: string
      enum: [PHQ9, GAD7]
    Questionnaire:
      type: object
      additionalProperties: false
      required:
        [
          definitionId,
          instrument,
          version,
          locale,
          title,
          referencePeriodDays,
          scoringVersion,
          responseOptions,
          questions,
          scoreBands,
        ]
      properties:
        definitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        version: { type: string, minLength: 1, maxLength: 32 }
        locale: { type: string, minLength: 2, maxLength: 16 }
        title: { type: string, minLength: 1, maxLength: 255 }
        referencePeriodDays: { type: integer, minimum: 1, maximum: 365 }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        responseOptions:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/ResponseOption" }
        questions:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/Question" }
        scoreBands:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/QuestionnaireScoreBand" }
    QuestionnaireScoreBand:
      type: object
      additionalProperties: false
      required: [screeningLevel, minimumScore, maximumScore]
      properties:
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
        minimumScore: { type: integer, minimum: 0, maximum: 27 }
        maximumScore: { type: integer, minimum: 0, maximum: 27 }
    ResponseOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: integer, minimum: 0, maximum: 3 }
        label: { type: string, minLength: 1, maxLength: 120 }
    Question:
      type: object
      additionalProperties: false
      required: [questionId, itemNumber, prompt]
      properties:
        questionId: { type: string, format: uuid }
        itemNumber: { type: integer, minimum: 1, maximum: 32 }
        prompt: { type: string, minLength: 1, maxLength: 1000 }
    AssessmentSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        [
          questionnaireDefinitionId,
          privacyPolicyVersion,
          privacyDisclosureAcknowledged,
          answers,
        ]
      properties:
        questionnaireDefinitionId: { type: string, format: uuid }
        privacyPolicyVersion: { type: string, const: privacy-capstone-v3 }
        privacyDisclosureAcknowledged:
          type: boolean
          const: true
          description: Compatibility field recording explicit consent to the current screening-data policy
        answers:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Exactly one answer for every question in the referenced definition; order is not authoritative
          items: { $ref: "#/components/schemas/AssessmentAnswer" }
    ScreeningEpisodePurpose:
      type: string
      enum: [INITIAL_CHECK, REASSESSMENT]
    ScreeningEpisodeStatus:
      type: string
      enum: [IN_PROGRESS, READY, COMPLETED]
    ScreeningEpisodeStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { $ref: "#/components/schemas/ScreeningEpisodePurpose" }
    ScreeningEpisode:
      type: object
      additionalProperties: false
      required: [episodeId, purpose, status, createdAt, updatedAt, version]
      properties:
        episodeId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ScreeningEpisodePurpose" }
        status: { $ref: "#/components/schemas/ScreeningEpisodeStatus" }
        phq9AssessmentId: { type: [string, "null"], format: uuid }
        gad7AssessmentId: { type: [string, "null"], format: uuid }
        supportEvaluationId: { type: [string, "null"], format: uuid }
        presentationEvaluationId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    GuidedJourney:
      type: object
      additionalProperties: false
      required:
        [journeyPolicyVersion, stage, assessmentInProgress, episodeId, episodeCompletedAt,
         presentationEvaluationId, supportGuideId, nextAction, currentSupportPlanId, entitlementStatus]
      properties:
        journeyPolicyVersion: { type: string, const: mb-guided-journey-v1 }
        stage:
          type: string
          description: ASSESSMENT_REQUIRED has no completed initial check; GUIDE_REQUIRED has a completed episode whose Guide is not yet persisted; GUIDE_READY has the persisted Guide.
          enum: [ASSESSMENT_REQUIRED, GUIDE_REQUIRED, GUIDE_READY]
        assessmentInProgress:
          type: boolean
          description: An IN_PROGRESS or READY initial-check episode exists; it never replaces the completed episode context below.
        episodeId: { type: [string, "null"], format: uuid }
        episodeCompletedAt: { type: [string, "null"], format: date-time }
        presentationEvaluationId: { type: [string, "null"], format: uuid }
        supportGuideId: { type: [string, "null"], format: uuid }
        nextAction:
          description: Null only for ASSESSMENT_REQUIRED.
          oneOf:
            - type: string
              enum:
                [REVIEW_SAFETY_SUPPORT, FIND_SPECIALIST, OPEN_CURRENT_PLAN, REVIEW_PLAN_DRAFT,
                 START_PLAN_PROPOSAL, EXPLORE_GUIDE_RESOURCES]
            - type: "null"
        currentSupportPlanId:
          type: [string, "null"]
          format: uuid
          description: Current ACTIVE/PAUSED plan, otherwise the current DRAFT; never created by this read.
        entitlementStatus:
          type: string
          enum: [NOT_REQUIRED, VERIFIED, UNAVAILABLE]
    ScreeningEpisodeEvaluationOutcome:
      type: object
      additionalProperties: false
      required: [episode, presentationEvaluation]
      properties:
        episode: { $ref: "#/components/schemas/ScreeningEpisode" }
        presentationEvaluation: { $ref: "#/components/schemas/SupportEvaluation" }
    ScreeningEpisodeHistoryEvidence:
      type: object
      additionalProperties: false
      required: [instrument, state, assessmentId, totalScore, screeningLevel, safetyStatus]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        state:
          type: string
          description: AVAILABLE is exact saved evidence; MISSING means the instrument was not attached; UNAVAILABLE means the attached historical record cannot be read safely.
          enum: [AVAILABLE, MISSING, UNAVAILABLE]
        assessmentId: { type: [string, "null"], format: uuid }
        totalScore: { type: [integer, "null"], minimum: 0, maximum: 27 }
        screeningLevel:
          oneOf:
            - $ref: "#/components/schemas/ScreeningLevel"
            - type: "null"
        safetyStatus:
          oneOf:
            - $ref: "#/components/schemas/SafetyStatus"
            - type: "null"
    ScreeningEpisodeHistoryItem:
      type: object
      additionalProperties: false
      required: [episodeId, purpose, status, startedAt, updatedAt, completedAt, presentationEvaluationId, meaningState, evidence, meaning]
      properties:
        episodeId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ScreeningEpisodePurpose" }
        status: { $ref: "#/components/schemas/ScreeningEpisodeStatus" }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        presentationEvaluationId: { type: [string, "null"], format: uuid }
        meaningState: { type: string, enum: [AVAILABLE, INCOMPLETE, UNAVAILABLE] }
        evidence:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - allOf:
                - $ref: "#/components/schemas/ScreeningEpisodeHistoryEvidence"
                - type: object
                  properties:
                    instrument: { type: string, const: PHQ9 }
            - allOf:
                - $ref: "#/components/schemas/ScreeningEpisodeHistoryEvidence"
                - type: object
                  properties:
                    instrument: { type: string, const: GAD7 }
        meaning:
          oneOf:
            - $ref: "#/components/schemas/CombinedScreeningMeaning"
            - type: "null"
    ScreeningEpisodeHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ScreeningEpisodeHistoryItem" }
        nextCursor: { type: [string, "null"], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    AssessmentAnswer:
      type: object
      additionalProperties: false
      required: [questionId, value]
      properties:
        questionId: { type: string, format: uuid }
        value: { type: integer, minimum: 0, maximum: 3 }
    Assessment:
      type: object
      additionalProperties: false
      required:
        [
          assessmentId,
          questionnaireDefinitionId,
          instrument,
          questionnaireVersion,
          privacyPolicyVersion,
          submittedAt,
          result,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        voidedAt: { type: [string, "null"], format: date-time }
        result: { $ref: "#/components/schemas/AssessmentResult" }
    AnonymousAssessment:
      type: object
      additionalProperties: false
      required:
        [
          assessmentId,
          questionnaireDefinitionId,
          instrument,
          questionnaireVersion,
          privacyPolicyVersion,
          submittedAt,
          result,
          expiresAt,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        voidedAt: { type: [string, "null"], format: date-time }
        result: { $ref: "#/components/schemas/AssessmentResult" }
        expiresAt: { type: string, format: date-time }
    AssessmentSummary:
      type: object
      additionalProperties: false
      required:
        [
          assessmentId,
          questionnaireDefinitionId,
          instrument,
          questionnaireVersion,
          privacyPolicyVersion,
          submittedAt,
          result,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: "#/components/schemas/Instrument" }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        result: { $ref: "#/components/schemas/AssessmentResult" }
    AssessmentHistoryPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AssessmentSummary" }
        nextCursor: { type: [string, "null"], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    AssessmentProgress:
      type: object
      additionalProperties: true
      description: Additive descriptive comparison; consumers ignore unknown fields and fail safely on unknown enum values
      required:
        [
          instrument,
          scoringVersion,
          previous,
          current,
          rawDelta,
          scoreDirection,
          bandTransition,
          elapsedDuration,
        ]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        previous: { $ref: "#/components/schemas/AssessmentProgressPoint" }
        current: { $ref: "#/components/schemas/AssessmentProgressPoint" }
        rawDelta:
          type: integer
          minimum: -27
          maximum: 27
          description: Current totalScore minus previous totalScore; no clinical interpretation is implied
        scoreDirection: { $ref: "#/components/schemas/ScoreDirection" }
        bandTransition: { $ref: "#/components/schemas/BandTransition" }
        elapsedDuration:
          type: string
          format: duration
          description: Non-negative ISO 8601 duration from previous submittedAt to current submittedAt
    AssessmentProgressPoint:
      type: object
      additionalProperties: true
      required:
        [
          assessmentId,
          questionnaireVersion,
          submittedAt,
          totalScore,
          screeningLevel,
        ]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        submittedAt: { type: string, format: date-time }
        totalScore: { type: integer, minimum: 0, maximum: 27 }
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
    BandTransition:
      type: object
      additionalProperties: true
      required: [previous, current]
      properties:
        previous: { $ref: "#/components/schemas/ScreeningLevel" }
        current: { $ref: "#/components/schemas/ScreeningLevel" }
    ScoreDirection:
      type: string
      description: Descriptive arithmetic direction only; consumers must use an unavailable fallback for unknown values and must not infer clinical meaning
      enum: [INCREASED, DECREASED, UNCHANGED]
    AssessmentResult:
      type: object
      additionalProperties: false
      required:
        [
          totalScore,
          screeningLevel,
          scoringVersion,
          safetyStatus,
          safetyPolicyVersion,
          disclaimerCode,
        ]
      properties:
        totalScore:
          type: integer
          minimum: 0
          maximum: 27
          description: Server-computed sum of the validated answer values
        screeningLevel: { $ref: "#/components/schemas/ScreeningLevel" }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        safetyStatus:
          $ref: "#/components/schemas/SafetyStatus"
        safetyPolicyVersion:
          type: [string, "null"]
          maxLength: 64
          description: Exact approved PHQ-9 item-9 policy, or null when safetyStatus is NOT_APPLICABLE
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
    SupportEvaluationRequest:
      type: object
      additionalProperties: false
      required: [phq9AssessmentId, gad7AssessmentId]
      properties:
        phq9AssessmentId: { type: string, format: uuid }
        gad7AssessmentId: { type: string, format: uuid }
    SupportEvaluation:
      type: object
      additionalProperties: false
      required:
        [
          supportEvaluationId,
          policyVersion,
          evaluatedAt,
          supportTier,
          reasonCodes,
          evidence,
          nextStep,
          safetyGuidance,
          disclaimerCode,
          disclaimer,
        ]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        policyVersion: { type: string, const: mb-support-routing-capstone-v1 }
        evaluatedAt: { type: string, format: date-time }
        supportTier: { $ref: "#/components/schemas/SupportTier" }
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: "#/components/schemas/SupportReasonCode" }
        evidence:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/SupportEvidence" }
        nextStep: { $ref: "#/components/schemas/SupportNextStep" }
        safetyGuidance:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          description: Reviewed local minimum guidance for SAFETY_FOLLOW_UP_RECOMMENDED; null for other tiers
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
        disclaimer:
          type: string
          const: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
    CombinedScreeningMeaning:
      type: object
      additionalProperties: false
      description: Versioned draft presentation of saved facts, not an original evaluation snapshot or a global health classification.
      required: [supportEvaluationId, sourcePolicyVersion, evaluatedAt, presentationPolicyVersion, contentVersion, referencePeriodDays, episodeId, episodePurpose, episodeCompletedAt, domainSupportEvaluationId, supportGuideId, evidence, supportTier, baseMeaning, presentationPriority, nextStep, safetyGuidance, disclaimerCode, disclaimer]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        sourcePolicyVersion: { type: string, const: mb-support-routing-capstone-v1 }
        evaluatedAt: { type: string, format: date-time }
        presentationPolicyVersion: { type: string, const: mb-combined-screening-meaning-v1 }
        contentVersion: { type: string, const: mb-combined-screening-meaning-vi-vn-v1-draft.3 }
        referencePeriodDays: { type: integer, const: 14 }
        episodeId: { type: [string, 'null'], format: uuid }
        episodePurpose:
          oneOf:
            - $ref: '#/components/schemas/ScreeningEpisodePurpose'
            - type: 'null'
        episodeCompletedAt: { type: [string, 'null'], format: date-time }
        domainSupportEvaluationId: { type: [string, 'null'], format: uuid }
        supportGuideId:
          type: [string, 'null']
          format: uuid
          description: Existing immutable Guide for this exact episode, if already persisted; this read never creates one.
        evidence:
          type: array
          minItems: 2
          maxItems: 2
          description: PHQ9 then GAD7; exact original pair, never current standalone history.
          items: { $ref: '#/components/schemas/CombinedScreeningMeaningEvidence' }
        supportTier: { $ref: '#/components/schemas/SupportTier' }
        baseMeaning: { $ref: '#/components/schemas/CombinedScreeningBaseMeaning' }
        presentationPriority:
          type: string
          description: Safety precedes ordinary meaning and CTA; this never changes an instrument level.
          enum: [SAFETY, PROFESSIONAL_SUPPORT, SELF_GUIDED]
        nextStep: { $ref: '#/components/schemas/SupportNextStep' }
        safetyGuidance:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          description: Existing reviewed safety guidance for the stored safety tier; null otherwise.
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
        disclaimer:
          type: string
          const: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
    CombinedScreeningMeaningEvidence:
      type: object
      additionalProperties: false
      required: [assessmentId, instrument, questionnaireVersion, scoringVersion, totalScore, screeningLevel, safetyStatus]
      properties:
        assessmentId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        totalScore: { type: integer, minimum: 0, maximum: 27 }
        screeningLevel: { $ref: '#/components/schemas/ScreeningLevel' }
        safetyStatus: { $ref: '#/components/schemas/SafetyStatus' }
    CombinedScreeningBaseMeaning:
      type: object
      additionalProperties: false
      required: [code, text, rationale, supportTier]
      properties:
        code:
          type: string
          maxLength: 64
          pattern: '^PHQ9_(MINIMAL|MILD|MODERATE|MODERATELY_SEVERE|SEVERE)_GAD7_(MINIMAL|MILD|MODERATE|SEVERE)$'
        text: { type: string, minLength: 1, maxLength: 1000 }
        rationale: { type: string, minLength: 1, maxLength: 1000 }
