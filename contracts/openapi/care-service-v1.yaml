openapi: 3.1.0
info:
  title: MentalBridge Care API
  version: 1.0.0
  description: |
    V1 contracts for the Care-owned profile, platform consent, and PHQ-9 foundation.
    Profile, consent, questionnaire, and assessment paths are implemented. Assessment
    clients submit only the backend-published privacy disclosure version, versioned
    question identifiers, and answer values; Care computes the score, screening band,
    independent safety status, and policy provenance.
    A screening result is not a diagnosis. ADR 0009 keeps screening severity and
    item-9 safety status independent, prohibits automatic escalation, and removes
    the hotline catalogue. The privacy-capstone-v3 disclosure and bounded anonymous
    lifetime are approved only for controlled local/test/demo use. Public real-user
    collection remains blocked on production privacy, retention, security, and legal review.

    Fields not marked nullable reject null. Omitted optional profile fields leave
    no stored value. Anonymous session credentials are bearer secrets returned
    once, stored only as hashes, and never attach an anonymous result to an account.
servers:
  - url: /
tags:
  - name: Profile
  - name: Consent
  - name: Privacy disclosure
  - name: Questionnaire
  - name: Assessment
  - name: Support evaluation
  - name: Anonymous assessment
paths:
  /api/v1/profile:
    x-mentalbridge-status: implemented
    get:
      tags: [Profile]
      operationId: getOwnCareProfile
      summary: Read the authenticated user's Care-owned profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profile found
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/ProfileNotFoundProblem' }
    put:
      tags: [Profile]
      operationId: putOwnCareProfile
      summary: Create or replace the authenticated user's editable profile
      description: |
        The account identifier comes only from the verified JWT subject. If-Match
        is omitted when creating the profile and is required for replacement of an
        existing profile. A stale version fails without overwriting newer data.
        Locale, timezone, and reminders are not user-configurable in this release;
        the server stores vi-VN, Asia/Ho_Chi_Minh, and reminders disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePutRequest' }
            example:
              displayName: Lan Nguyen
              dateOfBirth: '2000-01-02'
      responses:
        '200':
          description: Existing profile replaced
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '201':
          description: Profile created
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/consents:
    x-mentalbridge-status: implemented
    get:
      tags: [Consent]
      operationId: getOwnCurrentConsents
      summary: Read the latest explicit platform consent decisions
      description: |
        This lookup does not require a Care profile. A new account with no profile
        and no decision receives 200 with decisions: []. A missing consent type
        means no decision has been recorded; it is not silently treated as a grant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Latest decisions returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentCollection' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/consent-decisions:
    x-mentalbridge-status: implemented
    post:
      tags: [Consent]
      operationId: recordOwnConsentDecision
      summary: Append a versioned platform consent grant or refusal
      description: |
        Repeating the same user-scoped idempotency key and identical request returns
        the original decision. Reusing the key for a different request returns a
        conflict. Specialist access is a separate scoped grant workflow and is not
        represented by a broad platform-consent toggle.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentDecisionRequest' }
            example:
              consentType: PRIVACY_POLICY
              policyVersion: privacy-capstone-v3
              granted: true
      responses:
        '201':
          description: Consent decision appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDecision' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
  /api/v1/privacy-disclosures/current:
    x-mentalbridge-status: implemented
    get:
      tags: [Privacy disclosure]
      operationId: getCurrentPrivacyDisclosure
      summary: Read the backend-owned disclosure required for Care assessment processing
      description: |
        Returns the exact controlled-Capstone Vietnamese text and version. Clients
        render this response and must not keep an independent disclosure copy.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current disclosure returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyDisclosure' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/questionnaires/{instrument}/current:
    x-mentalbridge-status: implemented
    get:
      tags: [Questionnaire]
      operationId: getCurrentQuestionnaire
      summary: Read the current published questionnaire for an instrument and locale
      description: Only the current reviewed published PHQ-9 or GAD-7 definition is returned.
      parameters:
        - $ref: '#/components/parameters/Instrument'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current questionnaire returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/questionnaires/definitions/{definitionId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Questionnaire]
      operationId: getQuestionnaireDefinition
      summary: Read one immutable published or retired questionnaire definition
      description: |
        Resolves the exact definition referenced by a historical assessment. Draft
        definitions are never exposed, and callers must not replace the stored
        definition identifier with the current questionnaire when reopening a result.
      parameters:
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Immutable questionnaire definition returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/assessments:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: listOwnAssessments
      summary: List non-voided assessment summaries owned by the authenticated caller
      description: |
        Results are ordered by submittedAt descending and assessmentId descending.
        The opaque cursor identifies the last item of the previous page. Raw answers
        and other users' data are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned assessment summaries returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      tags: [Assessment]
      operationId: submitAuthenticatedAssessment
      summary: Submit and score a complete authenticated PHQ-9 or GAD-7 assessment
      description: |
        Care ignores no answers and accepts no client score, band, or safety result.
        It validates the exact published questionnaire version, requires one answer
        for every question, computes the result locally, and persists submission,
        answers, result, and outbox record atomically. An identical user-scoped
        idempotent retry returns the original result.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentSubmissionRequest' }
      responses:
        '201':
          description: Assessment accepted and scored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/assessments/{assessmentId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: getOwnAssessment
      summary: Read one authenticated assessment result owned by the caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned assessment returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assessment' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/assessments/{assessmentId}/progress:
    x-mentalbridge-status: implemented
    get:
      tags: [Assessment]
      operationId: getOwnAssessmentProgress
      summary: Compare one selected owned assessment with its preceding compatible result
      description: |
        The selected assessment is the current result. Care selects the immediately
        preceding non-voided result owned by the caller with the same instrument and
        identical scoring version, ordered deterministically by submittedAt and
        assessmentId. The response is descriptive only and makes no diagnosis,
        treatment, causation, recovery, clinical change, or resolved-safety claim.
        Anonymous sessions have no progress operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Descriptive comparison returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentProgress' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/InsufficientComparableDataProblem' }
  /api/v1/support-evaluations:
    x-mentalbridge-status: implemented
    post:
      tags: [Support evaluation]
      operationId: evaluateOwnScreeningSupport
      summary: Resolve deterministic support from explicitly selected PHQ-9 and GAD-7 results
      description: |
        The authenticated USER explicitly selects one owned PHQ-9 result and one
        owned GAD-7 result. Care validates immutable questionnaire/scoring evidence,
        applies the published safety-first policy, and persists one reproducible
        evaluation plus a transactional outbox event. It never calculates a
        composite score, diagnoses a condition, contacts another person, books an
        appointment, or shares assessment data. Local reviewed safety guidance
        remains available without Content, AI, Kafka, Redis, Realtime, or
        notification dependencies.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportEvaluationRequest' }
            example:
              phq9AssessmentId: 10000000-0000-4000-8000-000000000101
              gad7AssessmentId: 10000000-0000-4000-8000-000000000102
      responses:
        '201':
          description: Deterministic support evaluation created or replayed
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportEvaluation' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/support-evaluations/{supportEvaluationId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Support evaluation]
      operationId: getOwnScreeningSupportEvaluation
      summary: Reopen one immutable owned support evaluation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportEvaluationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Immutable support evaluation returned with its original policy content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportEvaluation' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/anonymous-assessment-sessions:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: createAnonymousAssessmentSession
      summary: Create an isolated short-lived anonymous assessment session
      description: |
        The response returns the session token once. The server stores only its
        hash. The expiry instant comes from an approved deployment policy; this
        contract deliberately does not invent a duration. Empty retry sessions may
        expire independently and are not durable user history.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: Anonymous session created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousSession' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/anonymous-assessment-sessions/{sessionId}/assessments:
    x-mentalbridge-status: implemented
    post:
      tags: [Anonymous assessment]
      operationId: submitAnonymousAssessment
      summary: Submit and score a complete published assessment inside one anonymous session
      description: |
        Session ownership is proven by the anonymous token, never by the path UUID
        alone. The result expires with the session and cannot be claimed by a later
        authenticated account. Scoring and atomic persistence are identical to the
        authenticated flow.
      security:
        - anonymousSessionToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessmentSubmissionRequest' }
      responses:
        '201':
          description: Anonymous assessment accepted and scored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAssessment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/InvalidAnonymousSessionProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '410': { $ref: '#/components/responses/ExpiredAnonymousSessionProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /api/v1/anonymous-assessment-sessions/{sessionId}/assessments/{assessmentId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Anonymous assessment]
      operationId: getAnonymousAssessment
      summary: Read one unexpired assessment from its isolated anonymous session
      security:
        - anonymousSessionToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Anonymous assessment returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAssessment' }
        '401': { $ref: '#/components/responses/InvalidAnonymousSessionProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '410': { $ref: '#/components/responses/ExpiredAnonymousSessionProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    anonymousSessionToken:
      type: apiKey
      in: header
      name: X-Anonymous-Session-Token
      description: Opaque high-entropy bearer credential returned once and stored only as a hash
  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportEvaluationId:
      name: supportEvaluationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Instrument:
      name: instrument
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Instrument' }
    Locale:
      name: locale
      in: query
      required: false
      schema: { type: string, minLength: 2, maxLength: 16, default: vi-VN }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Caller correlation identifier; the server generates one when omitted
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
      description: Retry key scoped to the authenticated account or anonymous session
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
    AssessmentCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor returned as nextCursor by the preceding page
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    ProfilePutRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        dateOfBirth:
          type: [string, 'null']
          format: date
          description: Optional date of birth. When present, the user must have reached their 18th anniversary on the request date; no maximum age is inferred.
        gender: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        locale:
          type: string
          const: vi-VN
          deprecated: true
          description: Compatibility input only; this release always stores vi-VN.
        timezone:
          type: string
          const: Asia/Ho_Chi_Minh
          deprecated: true
          description: Compatibility input only; this release always stores Asia/Ho_Chi_Minh.
        reminderEnabled:
          type: boolean
          const: false
          deprecated: true
          description: Compatibility input only; reminders are not implemented and remain disabled.
    Profile:
      type: object
      additionalProperties: false
      required: [accountId, displayName, locale, timezone, reminderEnabled, createdAt, updatedAt, version]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        locale: { type: string, minLength: 2, maxLength: 16, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        reminderEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    ConsentType:
      type: string
      enum: [PRIVACY_POLICY]
    ConsentDecisionRequest:
      type: object
      additionalProperties: false
      required: [consentType, policyVersion, granted]
      properties:
        consentType: { $ref: '#/components/schemas/ConsentType' }
        policyVersion:
          type: string
          const: privacy-capstone-v3
          description: Exact approved consent text version shown to the user
        granted:
          type: boolean
          description: Grants or withdraws consent for future screening-data processing under this version
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [decisionId, consentType, policyVersion, granted, decidedAt]
      properties:
        decisionId: { type: string, format: uuid }
        consentType: { $ref: '#/components/schemas/ConsentType' }
        policyVersion: { type: string, minLength: 1, maxLength: 64 }
        granted: { type: boolean }
        decidedAt: { type: string, format: date-time }
    ConsentCollection:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          maxItems: 1
          items: { $ref: '#/components/schemas/ConsentDecision' }
    PrivacyDisclosure:
      type: object
      additionalProperties: false
      required: [consentType, version, locale, title, content, capstoneOnly]
      properties:
        consentType: { type: string, const: PRIVACY_POLICY }
        version: { type: string, const: privacy-capstone-v3 }
        locale: { type: string, const: vi-VN }
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { type: string, minLength: 1, maxLength: 4000 }
        capstoneOnly: { type: boolean, const: true }
    Instrument:
      type: string
      enum: [PHQ9, GAD7]
    Questionnaire:
      type: object
      additionalProperties: false
      required: [definitionId, instrument, version, locale, title, referencePeriodDays, scoringVersion, responseOptions, questions, scoreBands]
      properties:
        definitionId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        version: { type: string, minLength: 1, maxLength: 32 }
        locale: { type: string, minLength: 2, maxLength: 16 }
        title: { type: string, minLength: 1, maxLength: 255 }
        referencePeriodDays: { type: integer, minimum: 1, maximum: 365 }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        responseOptions:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/ResponseOption' }
        questions:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/Question' }
        scoreBands:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/QuestionnaireScoreBand' }
    QuestionnaireScoreBand:
      type: object
      additionalProperties: false
      required: [screeningLevel, minimumScore, maximumScore]
      properties:
        screeningLevel: { $ref: '#/components/schemas/ScreeningLevel' }
        minimumScore: { type: integer, minimum: 0, maximum: 27 }
        maximumScore: { type: integer, minimum: 0, maximum: 27 }
    ResponseOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: integer, minimum: 0, maximum: 3 }
        label: { type: string, minLength: 1, maxLength: 120 }
    Question:
      type: object
      additionalProperties: false
      required: [questionId, itemNumber, prompt]
      properties:
        questionId: { type: string, format: uuid }
        itemNumber: { type: integer, minimum: 1, maximum: 32 }
        prompt: { type: string, minLength: 1, maxLength: 1000 }
    AssessmentSubmissionRequest:
      type: object
      additionalProperties: false
      required: [questionnaireDefinitionId, privacyPolicyVersion, privacyDisclosureAcknowledged, answers]
      properties:
        questionnaireDefinitionId: { type: string, format: uuid }
        privacyPolicyVersion: { type: string, const: privacy-capstone-v3 }
        privacyDisclosureAcknowledged:
          type: boolean
          const: true
          description: Compatibility field recording explicit consent to the current screening-data policy
        answers:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Exactly one answer for every question in the referenced definition; order is not authoritative
          items: { $ref: '#/components/schemas/AssessmentAnswer' }
    AssessmentAnswer:
      type: object
      additionalProperties: false
      required: [questionId, value]
      properties:
        questionId: { type: string, format: uuid }
        value: { type: integer, minimum: 0, maximum: 3 }
    Assessment:
      type: object
      additionalProperties: false
      required: [assessmentId, questionnaireDefinitionId, instrument, questionnaireVersion, privacyPolicyVersion, submittedAt, result]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        voidedAt: { type: [string, 'null'], format: date-time }
        result: { $ref: '#/components/schemas/AssessmentResult' }
    AnonymousAssessment:
      type: object
      additionalProperties: false
      required: [assessmentId, questionnaireDefinitionId, instrument, questionnaireVersion, privacyPolicyVersion, submittedAt, result, expiresAt]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        voidedAt: { type: [string, 'null'], format: date-time }
        result: { $ref: '#/components/schemas/AssessmentResult' }
        expiresAt: { type: string, format: date-time }
    AssessmentSummary:
      type: object
      additionalProperties: false
      required: [assessmentId, questionnaireDefinitionId, instrument, questionnaireVersion, privacyPolicyVersion, submittedAt, result]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireDefinitionId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        privacyPolicyVersion: { type: string, minLength: 1, maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/AssessmentResult' }
    AssessmentHistoryPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AssessmentSummary' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        hasMore: { type: boolean }
    AssessmentProgress:
      type: object
      additionalProperties: true
      description: Additive descriptive comparison; consumers ignore unknown fields and fail safely on unknown enum values
      required: [instrument, scoringVersion, previous, current, rawDelta, scoreDirection, bandTransition, elapsedDuration]
      properties:
        instrument: { $ref: '#/components/schemas/Instrument' }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        previous: { $ref: '#/components/schemas/AssessmentProgressPoint' }
        current: { $ref: '#/components/schemas/AssessmentProgressPoint' }
        rawDelta:
          type: integer
          minimum: -27
          maximum: 27
          description: Current totalScore minus previous totalScore; no clinical interpretation is implied
        scoreDirection: { $ref: '#/components/schemas/ScoreDirection' }
        bandTransition: { $ref: '#/components/schemas/BandTransition' }
        elapsedDuration:
          type: string
          format: duration
          description: Non-negative ISO 8601 duration from previous submittedAt to current submittedAt
    AssessmentProgressPoint:
      type: object
      additionalProperties: true
      required: [assessmentId, questionnaireVersion, submittedAt, totalScore, screeningLevel]
      properties:
        assessmentId: { type: string, format: uuid }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        submittedAt: { type: string, format: date-time }
        totalScore: { type: integer, minimum: 0, maximum: 27 }
        screeningLevel: { $ref: '#/components/schemas/ScreeningLevel' }
    BandTransition:
      type: object
      additionalProperties: true
      required: [previous, current]
      properties:
        previous: { $ref: '#/components/schemas/ScreeningLevel' }
        current: { $ref: '#/components/schemas/ScreeningLevel' }
    ScoreDirection:
      type: string
      description: Descriptive arithmetic direction only; consumers must use an unavailable fallback for unknown values and must not infer clinical meaning
      enum: [INCREASED, DECREASED, UNCHANGED]
    AssessmentResult:
      type: object
      additionalProperties: false
      required: [totalScore, screeningLevel, scoringVersion, safetyStatus, safetyPolicyVersion, disclaimerCode]
      properties:
        totalScore:
          type: integer
          minimum: 0
          maximum: 27
          description: Server-computed sum of the validated answer values
        screeningLevel: { $ref: '#/components/schemas/ScreeningLevel' }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        safetyStatus:
          $ref: '#/components/schemas/SafetyStatus'
        safetyPolicyVersion:
          type: [string, 'null']
          maxLength: 64
          description: Exact approved PHQ-9 item-9 policy, or null when safetyStatus is NOT_APPLICABLE
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
    SupportEvaluationRequest:
      type: object
      additionalProperties: false
      required: [phq9AssessmentId, gad7AssessmentId]
      properties:
        phq9AssessmentId: { type: string, format: uuid }
        gad7AssessmentId: { type: string, format: uuid }
    SupportEvaluation:
      type: object
      additionalProperties: false
      required: [supportEvaluationId, policyVersion, evaluatedAt, supportTier, reasonCodes, evidence, nextStep, safetyGuidance, disclaimerCode, disclaimer]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        policyVersion: { type: string, const: mb-support-routing-capstone-v1 }
        evaluatedAt: { type: string, format: date-time }
        supportTier: { $ref: '#/components/schemas/SupportTier' }
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportReasonCode' }
        evidence:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/SupportEvidence' }
        nextStep: { $ref: '#/components/schemas/SupportNextStep' }
        safetyGuidance:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          description: Reviewed local minimum guidance for SAFETY_FOLLOW_UP_RECOMMENDED; null for other tiers
        disclaimerCode: { type: string, const: SCREENING_NOT_DIAGNOSIS }
        disclaimer:
          type: string
          const: Đây là kết quả sàng lọc triệu chứng, không phải chẩn đoán y khoa. MentalBridge không cung cấp dịch vụ ứng cứu khẩn cấp, không giám sát con người 24/7 và không tự động liên hệ bên thứ ba.
    SupportEvidence:
      type: object
      additionalProperties: false
      required: [assessmentId, instrument, questionnaireVersion, scoringVersion, screeningLevel, safetyStatus, meaning]
      properties:
        assessmentId: { type: string, format: uuid }
        instrument: { $ref: '#/components/schemas/Instrument' }
        questionnaireVersion: { type: string, minLength: 1, maxLength: 32 }
        scoringVersion: { type: string, minLength: 1, maxLength: 32 }
        screeningLevel: { $ref: '#/components/schemas/ScreeningLevel' }
        safetyStatus: { $ref: '#/components/schemas/SafetyStatus' }
        meaning: { $ref: '#/components/schemas/ScreeningMeaning' }
    ScreeningMeaning:
      type: object
      additionalProperties: false
      required: [meaningCode, contentVersion, referencePeriodDays, text, limitation]
      properties:
        meaningCode: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 64 }
        contentVersion: { type: string, minLength: 1, maxLength: 64 }
        referencePeriodDays: { type: integer, const: 14 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        limitation: { type: string, minLength: 1, maxLength: 1000 }
    SupportNextStep:
      type: object
      additionalProperties: false
      required: [code, contentVersion, text, boundary]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 64 }
        contentVersion: { type: string, minLength: 1, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 1000 }
        boundary: { type: string, minLength: 1, maxLength: 1000 }
    SupportTier:
      type: string
      description: Product support pathway, never a diagnosis or suicide-risk label
      enum: [SELF_GUIDED_SUPPORT, PROFESSIONAL_SUPPORT_RECOMMENDED, SAFETY_FOLLOW_UP_RECOMMENDED]
    SupportReasonCode:
      type: string
      enum: [ALL_SCREENING_LEVELS_MINIMAL_OR_MILD, PHQ9_MODERATE_OR_HIGHER, GAD7_MODERATE_OR_HIGHER, PHQ9_SAFETY_SCREEN_POSITIVE]
    ScreeningLevel:
      type: string
      enum: [MINIMAL, MILD, MODERATE, MODERATELY_SEVERE, SEVERE]
    SafetyStatus:
      type: string
      description: Questionnaire-specific safety result; NOT_APPLICABLE means no safety screen was performed
      enum: [NEGATIVE_SAFETY_SCREEN, POSITIVE_SAFETY_SCREEN, NOT_APPLICABLE]
    AnonymousSession:
      type: object
      additionalProperties: false
      required: [sessionId, sessionToken, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        sessionToken: { type: string, minLength: 43, maxLength: 512, readOnly: true }
        expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        correlationId: { type: string, format: uuid }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    ValidationProblem:
      description: Request validation failed with VALIDATION_FAILED or a field violation such as INCOMPLETE_QUESTIONNAIRE or INVALID_ANSWER; no result was persisted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/validation-failed
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
            violations: [{ field: answers, code: INCOMPLETE_QUESTIONNAIRE, message: one answer is required for every question }]
    UnauthorizedProblem:
      description: Authentication is missing or invalid (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Caller lacks the USER role or owner authorization (CARE_USER_REQUIRED or RESOURCE_NOT_OWNED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidAnonymousSessionProblem:
      description: Anonymous session identifier or token is invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/invalid-anonymous-session, title: Anonymous session is invalid, status: 401, code: INVALID_ANONYMOUS_SESSION, correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65 }
    ExpiredAnonymousSessionProblem:
      description: Anonymous session and its result have expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/anonymous-session-expired, title: Anonymous session expired, status: 410, code: ANONYMOUS_SESSION_EXPIRED, correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65 }
    NotFoundProblem:
      description: Requested resource does not exist (PROFILE_NOT_FOUND, QUESTIONNAIRE_NOT_FOUND, ASSESSMENT_NOT_FOUND, or SUPPORT_EVALUATION_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProfileNotFoundProblem:
      description: No Care profile has been created yet; clients should present the normal profile onboarding state (PROFILE_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: /problems/profile-not-found
            title: Care profile was not found
            status: 404
            code: PROFILE_NOT_FOUND
            correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65
    ConflictProblem:
      description: Request conflicts with stored state (IDEMPOTENCY_KEY_REUSED, QUESTIONNAIRE_VERSION_UNAVAILABLE, or SUPPORT_EVIDENCE_INCOMPATIBLE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InsufficientComparableDataProblem:
      description: The selected owned result has no immediately preceding valid result with the same instrument and scoring version
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: /problems/insufficient-comparable-data, title: Comparable assessment data is unavailable, status: 409, code: INSUFFICIENT_COMPARABLE_DATA, correlationId: 8fb5720a-53ab-40db-9cf4-f5cfabbdaf65 }
    IdempotencyConflictProblem:
      description: Idempotency key was previously used with a different consent request (IDEMPOTENCY_KEY_REUSED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionProblem:
      description: If-Match is missing for an existing profile or does not match its current version (PROFILE_VERSION_MISMATCH)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: Request exceeded the bounded anonymous or Care API rate limit (RATE_LIMITED)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
