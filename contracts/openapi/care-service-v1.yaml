  /api/v1/plan-change-requests/{requestId}/decision:
    x-mentalbridge-status: implemented
    put:
      tags: [SupportPlan change request]
      operationId: decideOwnPlanChangeRequest
      summary: Explicitly accept or reject one reviewed specialist proposal
      description: |
        REJECT records a final decision without changing the plan. ACCEPT reloads the
        authoritative proposal and freshly revalidates entitlement, current plan/version,
        current evaluation, template constraints, and the exact resource version. Only a
        still-valid request atomically supersedes the current plan and activates its replacement.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlanChangeRequestId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanChangeDecision' }
      responses:
        '200':
          description: Final decision persisted; an accepted request includes the activated replacement plan reference
          headers:
            ETag: { $ref: '#/components/headers/SupportPlanETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanChangeRequest' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '503': { $ref: '#/components/responses/SupportPlanDependencyProblem' }
