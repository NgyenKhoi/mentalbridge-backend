          type: string
          enum: [INCREASED, DECREASED, UNCHANGED, INSUFFICIENT_DATA]
    ReassessmentScreeningDimension:
      type: object
      additionalProperties: true
      required: [state, trends]
      properties:
        state: { $ref: "#/components/schemas/ReassessmentDimensionState" }
