    CommunityProfile:
      type: object
      additionalProperties: false
      required: [communityProfileId, displayName, avatarPreset, status, version, createdAt, updatedAt]
      properties:
        communityProfileId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarPreset:
          anyOf:
            - $ref: "#/components/schemas/CommunityAvatarPreset"
            - type: "null"
        status: { type: string, enum: [ACTIVE, DELETED] }
