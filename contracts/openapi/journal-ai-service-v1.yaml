openapi: 3.1.0
info:
  title: MentalBridge Journal AI Service API
  version: 1.1.0
  description: Private journal CRUD, daily self-reported emotion check-ins, and consent-gated exact-revision analysis contract.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Emotion check-ins
    description: Owner-scoped, non-clinical daily self-reported emotion records.
  - name: Journals
    description: Private journal entries owned by the authenticated account.
  - name: Analysis jobs
    description: Owner-scoped asynchronous analysis of one exact current revision.
  - name: Operations
    description: Service health and metrics endpoints.
paths:
  /health/live:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      security: []
      summary: Liveness probe.
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      security: []
      summary: Readiness probe.
      responses:
        "200":
          description: Service is ready for its current baseline dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Owned MongoDB is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /metrics:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      security: []
      summary: Prometheus metrics endpoint.
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/emotion-check-ins:
    x-mentalbridge-status: implemented
    post:
      tags: [Emotion check-ins]
      summary: Record the authenticated user's check-in for the current local day.
      operationId: createEmotionCheckIn
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmotionCheckInRequest"
      responses:
        "201":
          description: Check-in created, or an exact create retry replayed.
          headers:
            Location:
              schema: { type: string }
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckIn"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    get:
      tags: [Emotion check-ins]
      summary: List the authenticated user's self-reported emotion history.
      operationId: listEmotionCheckIns
      parameters:
        - $ref: "#/components/parameters/EmotionLimit"
        - $ref: "#/components/parameters/BeforeLocalDate"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A bounded, newest-first history page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckInList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/emotion-check-ins/{localDate}:
    x-mentalbridge-status: implemented
    get:
      tags: [Emotion check-ins]
      summary: Reload one owned check-in by its recorded local day.
      operationId: getEmotionCheckIn
      parameters:
        - $ref: "#/components/parameters/LocalDate"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The owned active check-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckIn"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    patch:
      tags: [Emotion check-ins]
      summary: Update the owned check-in while its stored local day is current.
      operationId: updateEmotionCheckIn
      parameters:
        - $ref: "#/components/parameters/LocalDate"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmotionCheckInValue"
      responses:
        "200":
          description: Check-in updated, or an exact update retry replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckIn"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [Emotion check-ins]
      summary: Delete the encrypted emotion payload and tombstone the local day.
      operationId: deleteEmotionCheckIn
      parameters:
        - $ref: "#/components/parameters/LocalDate"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The encrypted payload was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckInTombstone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/emotion-check-in-context:
    x-mentalbridge-status: implemented
    get:
      tags: [Emotion check-ins]
      summary: Return a note-free minimized projection for consented AI reflection.
      description: Reminder composition is deliberately unavailable until a separate reminder consent contract is accepted.
      operationId: getEmotionCheckInConsumerContext
      parameters:
        - name: purpose
          in: query
          required: true
          schema: { type: string, const: AI_REFLECTION }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 14 }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current Care consent was verified and only minimized fields are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionCheckInConsumerContext"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/journals:
    x-mentalbridge-status: implemented
    post:
      tags: [Journals]
      summary: Create a private journal entry.
      operationId: createJournalEntry
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalRequest"
      responses:
        "201":
          description: Journal entry created.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created journal entry.
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Journals]
      summary: List private journal entries with bounded cursor pagination.
      operationId: listJournalEntries
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Bounded page of journal entries.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/journals/{journalId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Journals]
      summary: Get one private journal entry.
      operationId: getJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Journal entry found.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Journals]
      summary: Revise an existing journal entry.
      operationId: reviseJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseJournalRequest"
      responses:
        "200":
          description: Journal entry revised and current analysis invalidated.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
    delete:
      tags: [Journals]
      summary: Tombstone a private journal entry.
      operationId: deleteJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Journal entry tombstoned.
          headers:
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalTombstone"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/journals/{journalId}/revisions/{revision}/analysis-jobs:
    x-mentalbridge-status: implemented
    post:
      tags: [Analysis jobs]
      summary: Request analysis of one exact owned journal revision.
      operationId: createExactRevisionAnalysisJob
      parameters:
        - $ref: "#/components/parameters/JournalId"
        - $ref: "#/components/parameters/JournalRevision"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "202":
          description: The idempotent asynchronous job was accepted.
          headers:
            Location:
              schema: { type: string }
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/analysis-jobs/{jobId}:
    x-mentalbridge-status: implemented
    get:
      tags: [Analysis jobs]
      summary: Read an owned analysis job and its normalized result.
      operationId: getOwnAnalysisJob
      parameters:
        - $ref: "#/components/parameters/AnalysisJobId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Job state returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LocalDate:
      name: localDate
      in: path
      required: true
      schema: { type: string, format: date }
      description: Calendar day computed in the IANA timezone stored at creation.
    EmotionLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
    BeforeLocalDate:
      name: before
      in: query
      required: false
      schema: { type: string, format: date }
      description: Exclusive newest-first history cursor.
    JournalId:
      name: journalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JournalRevision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 200
    AnalysisJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Stable key for safe client retries of journal mutations.
    IfMatchRevision:
      name: If-Match-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
      description: Current revision number expected by the client.
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Opaque cursor returned by the previous list response.
  headers:
    CorrelationId:
      schema:
        type: string
      description: Correlation ID used in request logs.
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Current consent does not authorize this minimized consumer projection.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Requested resource was not found for the authenticated owner.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Idempotency conflict, duplicate mutation, or revision/history limit reached.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: Revision precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DependencyUnavailable:
      description: A required dependency was unavailable and the request failed closed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Emotion:
      type: string
      description: Self-selected, non-clinical label shared with Journal authoring.
      enum: [GREAT, GOOD, OKAY, LOW, VERY_LOW]
    EmotionCheckInValue:
      type: object
      additionalProperties: false
      required: [emotion, intensity]
      properties:
        emotion:
          $ref: "#/components/schemas/Emotion"
        intensity:
          type: integer
          minimum: 1
          maximum: 5
          description: Strength of the selected feeling, not wellness, severity, diagnosis, or recovery.
        note:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Optional private free text; encrypted at rest and excluded from consumer projections, logs, and events.
    CreateEmotionCheckInRequest:
      allOf:
        - $ref: "#/components/schemas/EmotionCheckInValue"
        - type: object
          required: [localDate, timezone]
          properties:
            localDate: { type: string, format: date }
            timezone:
              type: string
              minLength: 1
              maxLength: 64
              description: IANA timezone; localDate must equal the server acceptance time in this zone.
      unevaluatedProperties: false
    EmotionCheckIn:
      type: object
      additionalProperties: false
      required: [id, localDate, timezone, emotion, intensity, note, sourceLabel, clinicalUse, revision, recordedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        localDate: { type: string, format: date }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        emotion: { $ref: "#/components/schemas/Emotion" }
        intensity: { type: integer, minimum: 1, maximum: 5 }
        note: { type: [string, "null"], maxLength: 500 }
        sourceLabel: { type: string, const: SELF_REPORTED_EMOTION }
        clinicalUse: { type: string, const: NOT_A_DIAGNOSIS_OR_SAFETY_CLASSIFIER }
        revision: { type: integer, minimum: 1, maximum: 32 }
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmotionCheckInList:
      type: object
      additionalProperties: false
      required: [items, page, label, interpretation]
      properties:
        items:
          type: array
          maxItems: 90
          items: { $ref: "#/components/schemas/EmotionCheckIn" }
        page:
          type: object
          additionalProperties: false
          required: [limit, hasMore]
          properties:
            limit: { type: integer, minimum: 1, maximum: 90 }
            hasMore: { type: boolean }
            nextBefore: { type: string, format: date }
        label: { type: string, const: SELF_REPORTED_EMOTION }
        interpretation: { type: string, const: NOT_DIAGNOSIS_OR_RECOVERY }
    EmotionCheckInTombstone:
      type: object
      additionalProperties: false
      required: [localDate, deleted, deletedAt]
      properties:
        localDate: { type: string, format: date }
        deleted: { type: boolean, const: true }
        deletedAt: { type: string, format: date-time }
    EmotionCheckInConsumerItem:
      type: object
      additionalProperties: false
      required: [localDate, timezone, emotion, intensity, sourceLabel, revision, recordedAt]
      properties:
        localDate: { type: string, format: date }
        timezone: { type: string }
        emotion: { $ref: "#/components/schemas/Emotion" }
        intensity: { type: integer, minimum: 1, maximum: 5 }
        sourceLabel: { type: string, const: SELF_REPORTED_EMOTION }
        revision: { type: integer, minimum: 1, maximum: 32 }
        recordedAt: { type: string, format: date-time }
    EmotionCheckInConsumerContext:
      type: object
      additionalProperties: false
      required: [purpose, consent, items]
      properties:
        purpose: { type: string, const: AI_REFLECTION }
        consent:
          type: object
          additionalProperties: false
          required: [type, policyVersion, decidedAt]
          properties:
            type: { type: string, const: AI_PROCESSING }
            policyVersion: { type: [string, "null"], maxLength: 64 }
            decidedAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/EmotionCheckInConsumerItem" }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        environment:
          type: string
          enum: [development, test, production]
    CreateJournalRequest:
      type: object
      additionalProperties: false
      required: [clientEntryId, occurredAt, content]
      properties:
        clientEntryId:
          type: string
          format: uuid
          description: Client-generated entry ID used for idempotency and offline drafts.
        occurredAt:
          type: string
          format: date-time
        content:
          $ref: "#/components/schemas/JournalContentInput"
        mood:
          $ref: "#/components/schemas/JournalMood"
          description: Optional during the compatibility window; new MentalBridge editors require an explicit user selection.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
    ReviseJournalRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          $ref: "#/components/schemas/JournalContentInput"
        mood:
          $ref: "#/components/schemas/JournalMood"
          description: When omitted by an older client, the current revision mood is preserved.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
    JournalContentInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 12000
          pattern: '.*\S.*'
          description: Non-blank plaintext is accepted only at the API boundary and must not be logged or indexed.
    JournalMood:
      type: string
      description: User-selected reflection label; it is not a clinical score and the emoji presentation is client-owned.
      enum: [GREAT, GOOD, OKAY, LOW, VERY_LOW]
    JournalEntryMetadata:
      type: object
      required:
        - id
        - ownerAccountId
        - currentRevision
        - occurredAt
        - createdAt
        - updatedAt
        - deleted
        - tags
        - mood
        - encryption
        - analysisState
      properties:
        id:
          type: string
          format: uuid
        ownerAccountId:
          type: string
          format: uuid
        currentRevision:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        tags:
          type: array
          items:
            type: string
        mood:
          description: Mood stored with the current encrypted revision; null only for entries written by compatible legacy clients.
          anyOf:
            - $ref: "#/components/schemas/JournalMood"
            - type: "null"
        encryption:
          $ref: "#/components/schemas/EncryptionMetadata"
        analysisState:
          type: string
          enum: [not_requested, current, stale]
    JournalEntry:
      allOf:
        - $ref: "#/components/schemas/JournalEntryMetadata"
        - type: object
          required: [content]
          properties:
            content:
              $ref: "#/components/schemas/JournalContent"
      unevaluatedProperties: false
    JournalEntrySummary:
      allOf:
        - $ref: "#/components/schemas/JournalEntryMetadata"
        - type: object
          required: [content]
          properties:
            content:
              $ref: "#/components/schemas/JournalContentSummary"
      unevaluatedProperties: false
    JournalContent:
      type: object
      additionalProperties: false
      required: [text, byteLength]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 12000
          description: Decrypted only after owner authorization and never logged or persisted as plaintext.
        byteLength:
          type: integer
          minimum: 1
    JournalContentSummary:
      type: object
      additionalProperties: false
      required: [preview, byteLength]
      properties:
        preview:
          type: string
          maxLength: 160
          description: Derived after an authorized decrypt for this response and never stored or indexed as plaintext.
        byteLength:
          type: integer
          minimum: 1
    EncryptionMetadata:
      type: object
      additionalProperties: false
      required: [algorithm, keyId, encryptedAt]
      properties:
        algorithm:
          type: string
          enum: [AES-256-GCM]
        keyId:
          type: string
          minLength: 1
          description: Fixed compatibility marker for the single application encryption key; it is not a rotation selector.
        encryptedAt:
          type: string
          format: date-time
    JournalTombstone:
      type: object
      additionalProperties: false
      required: [id, ownerAccountId, deleted, deletedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerAccountId:
          type: string
          format: uuid
        deleted:
          type: boolean
          enum: [true]
        deletedAt:
          type: string
          format: date-time
    JournalListResponse:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/JournalEntrySummary"
        page:
          type: object
          additionalProperties: false
          required: [limit, hasMore]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 50
            nextCursor:
              type: string
            hasMore:
              type: boolean
    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - journalId
        - journalRevision
        - status
        - attemptCount
        - createdAt
        - updatedAt
      properties:
        jobId: { type: string, format: uuid }
        journalId: { type: string, format: uuid }
        journalRevision: { type: integer, minimum: 1, maximum: 200 }
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        attemptCount: { type: integer, minimum: 0, maximum: 2 }
        terminalReason:
          oneOf:
            - $ref: "#/components/schemas/AnalysisTerminalReason"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/NormalizedAnalysisResult"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    AnalysisTerminalReason:
      type: string
      enum:
        - CONSENT_REQUIRED
        - CONSENT_REVOKED
        - CONSENT_UNAVAILABLE
        - ENTITLEMENT_UNAVAILABLE
        - ENTITLEMENT_CHANGED
        - AUTHORIZATION_CONTEXT_LOST
        - REVISION_STALE
        - JOURNAL_DELETED
        - PROVIDER_TIMEOUT
        - PROVIDER_UNAVAILABLE
        - INVALID_PROVIDER_RESULT
        - INTERNAL_ERROR
    NormalizedAnalysisResult:
      type: object
      additionalProperties: false
      required:
        - contextSignals
        - emotionIndicators
        - themes
        - preferenceSignals
        - barrierSignals
        - suggestedAction
        - provider
        - model
        - promptVersion
        - schemaVersion
        - createdAt
      properties:
        summary: { type: string, minLength: 1, maxLength: 800 }
        contextSignals:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 64 }
        emotionIndicators:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 64 }
        themes:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 64 }
        preferenceSignals:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 64 }
        barrierSignals:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 64 }
        sentiment: { type: string, minLength: 1, maxLength: 32 }
        modelConfidence: { type: number, minimum: 0, maximum: 1 }
        suggestedAction:
          type: string
          enum:
            - NONE
            - OFFER_RESOURCE_EXPLANATION
            - GUIDE_APPROVED_ACTIVITY
            - REQUEST_ALLOWED_ALTERNATIVE
            - REQUEST_PLAN_REVIEW
            - OPEN_PROFESSIONAL_SUPPORT
            - OPEN_SAFETY_GUIDANCE
        workload: { type: string, const: EXACT_REVISION }
        servicePlan:
          type: string
          enum: [FREE, PLUS, PREMIUM]
        entitlementSource:
          type: string
          enum: [DEFAULT_FREE, DEMO, PAID]
        entitlementPolicyVersion: { type: string, minLength: 1, maxLength: 96 }
        entitlementVersion: { type: integer, format: int64, minimum: 0 }
        routingPolicyVersion: { type: string, minLength: 1, maxLength: 96 }
        providerApprovalVersion: { type: string, minLength: 1, maxLength: 96 }
        provider:
          type: string
          enum: [DETERMINISTIC_FAKE, GEMINI, OPENAI]
        model: { type: string, minLength: 1, maxLength: 128 }
        promptVersion: { type: string, minLength: 1, maxLength: 96 }
        schemaVersion: { type: integer, const: 1 }
        latencyMs: { type: integer, minimum: 0 }
        inputTokens: { type: [integer, "null"], minimum: 0 }
        outputTokens: { type: [integer, "null"], minimum: 0 }
        estimatedCostMicroUsd:
          type: [integer, "null"]
          minimum: 0
          description: Estimated provider cost in millionths of one USD using the versioned configured benchmark rate.
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
        detail:
          type: string
        correlationId:
          type: string
          minLength: 1
