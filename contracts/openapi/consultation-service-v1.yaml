openapi: 3.1.0
info:
  title: MentalBridge Consultation Service API
  version: 1.4.0
  description: Consultation-owned specialist profile approval, service-plan entitlement and credit lookup, online availability, and appointment requests.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/service-credits:
    x-mentalbridge-status: implemented
    get:
      operationId: getOwnServiceCredits
      description: Returns the authenticated user's server-authoritative consultation-credit balance, distinct concurrent reservation capacity, and bounded ledger history. Reading provisions any missing credits for the current effective entitlement idempotently; clients must never derive mutable limits from the package name.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current plan, billing period, authoritative balance, and recent history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCreditAccount' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
        '409': { $ref: '#/components/responses/CreditConflictProblem' }
  /internal/v1/entitlements/current:
    x-mentalbridge-status: implemented
    get:
      operationId: getCurrentServiceEntitlement
      description: Returns the authenticated user's current server-authoritative service package. Absence of an effective paid or explicit demo projection returns FREE with DEFAULT_FREE provenance.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current effective service-plan entitlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentServiceEntitlement' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
  /api/v1/specialist-profile:
    x-mentalbridge-status: implemented
    get:
      operationId: getOwnSpecialistProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current specialist-owned profile
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: saveOwnSpecialistProfileDraft
      description: Creates a PENDING unsubmitted profile or replaces an existing PENDING profile draft. Editing a submitted profile clears submittedAt and removes it from the review queue until submitted again.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecialistProfileRequest' }
      responses:
        '200':
          description: Existing draft replaced
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '201':
          description: Draft created
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/specialist-profile/submit:
    x-mentalbridge-status: implemented
    post:
      operationId: submitOwnSpecialistProfile
      description: Places the complete PENDING profile in the administrator review queue.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Profile submitted or unchanged replay
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/availability-slots:
    x-mentalbridge-status: implemented
    get:
      operationId: listOwnAvailabilitySlots
      description: Lists the authenticated specialist's slots in a bounded UTC interval, including tombstones when requested.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive UTC lower bound. Defaults to seven days before the request instant.
          schema: { type: string, format: date-time, pattern: 'Z$' }
        - name: to
          in: query
          required: false
          description: Exclusive UTC upper bound. Defaults to ninety days after the request instant and may span at most 366 days from from.
          schema: { type: string, format: date-time, pattern: 'Z$' }
        - name: includeWithdrawn
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Owner-scoped availability and current modality capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlotList' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      operationId: publishOwnAvailabilitySlot
      description: Publishes one exact future 60-minute online slot. Replaying the same Idempotency-Key with the same command returns the same slot identity and current state.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishAvailabilitySlotRequest' }
      responses:
        '201':
          description: Slot published or the same slot aggregate returned for an exact replay
          headers:
            ETag: { $ref: '#/components/headers/AvailabilitySlotETag' }
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlot' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/AvailabilityConflictProblem' }
  /api/v1/availability-slots/{slotId}:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/AvailabilitySlotId'
    delete:
      operationId: withdrawOwnAvailabilitySlot
      description: Withdraws one owned future slot while retaining an auditable tombstone.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AvailabilitySlotIfMatch'
      responses:
        '200':
          description: Withdrawn slot tombstone
          headers:
            ETag: { $ref: '#/components/headers/AvailabilitySlotETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlot' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/AvailabilityNotFoundProblem' }
        '409': { $ref: '#/components/responses/AvailabilityConflictProblem' }
        '412': { $ref: '#/components/responses/AvailabilityVersionProblem' }
        '428': { $ref: '#/components/responses/AvailabilityVersionRequiredProblem' }
  /api/v1/bookable-slots:
    x-mentalbridge-status: implemented
    get:
      operationId: listBookableSlots
      description: Lists approved specialists' currently selectable exact 60-minute online slots. Disabled video slots and slots already held by an active appointment are excluded.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Current selectable online slots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookableSlotList' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
  /api/v1/appointments:
    x-mentalbridge-status: implemented
    get:
      operationId: listOwnAppointments
      description: Lists the authenticated user's authoritative appointment snapshots, including request deadline and held credit identity.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-owned appointment history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentList' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
    post:
      operationId: requestAppointment
      description: Atomically creates a REQUESTED appointment for one exact slot after enforcing both available-credit and concurrent-reservation limits. When replacesAppointmentId is supplied, the active appointment and its held credit are atomically moved to a linked replacement request without temporarily consuming another reservation. Exact command replays return the original appointment.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestAppointment' }
      responses:
        '201':
          description: Appointment requested or exact replay returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/AppointmentForbiddenProblem' }
        '404': { $ref: '#/components/responses/AppointmentSlotNotFoundProblem' }
        '409': { $ref: '#/components/responses/AppointmentConflictProblem' }
  /api/v1/admin/specialist-profiles:
    x-mentalbridge-status: implemented
    get:
      operationId: listPendingSpecialistProfiles
      description: Returns submitted PENDING profiles ordered by oldest submission first.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Pending review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingSpecialistProfiles' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/admin/specialist-profiles/{specialistAccountId}:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/SpecialistAccountId'
    get:
      operationId: getSpecialistProfileForAdmin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Operational specialist profile detail
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/admin/specialist-profiles/{specialistAccountId}/approve:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/SpecialistAccountId'
    post:
      operationId: approveSpecialistProfile
      description: Approves one submitted PENDING profile. Repeating against the current APPROVED version returns the same profile without another history row.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Approved profile
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpecialistAccountId:
      name: specialistAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Omit only when creating the first profile; otherwise quote the current non-negative version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative profile version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AvailabilitySlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Printable caller key scoped to the authenticated specialist and retained with the slot outcome.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    AvailabilitySlotIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative availability slot version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  headers:
    ProfileETag:
      description: Quoted current profile version for If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AvailabilitySlotETag:
      description: Quoted current availability slot version for If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  schemas:
    ServicePackage:
      type: string
      enum: [FREE, PLUS, PREMIUM]
    EntitlementSource:
      type: string
      enum: [DEFAULT_FREE, DEMO, PAID]
    CurrentServiceEntitlement:
      type: object
      additionalProperties: false
      required: [accountId, packageCode, source, sourceReference, effectiveFrom, effectiveUntil, policyVersion, version, decidedAt]
      properties:
        accountId: { type: string, format: uuid }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        source: { $ref: '#/components/schemas/EntitlementSource' }
        sourceReference:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: Explicit demo identifier or future paid lifecycle reference; null only for DEFAULT_FREE.
        effectiveFrom: { type: [string, 'null'], format: date-time }
        effectiveUntil:
          type: [string, 'null']
          format: date-time
          description: Exclusive entitlement end; null only for DEFAULT_FREE.
        policyVersion: { type: string, const: service-entitlement-v1 }
        version: { type: integer, format: int64, minimum: 0 }
        decidedAt: { type: string, format: date-time }
    CreditSource:
      type: string
      enum: [DEFAULT_FREE, DEMO, PAID]
    CreditLedgerEventType:
      type: string
      enum: [PROVISIONED, HELD, CONSUMED, RELEASED, FORFEITED]
    ConsultationCreditPolicyVersion:
      type: string
      enum: [consultation-credit-v1, consultation-credit-v2]
    ServiceCreditBalance:
      type: object
      additionalProperties: false
      required: [available, held, consumed, forfeited, total, releasedTransitions]
      properties:
        available: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        consumed: { type: integer, minimum: 0 }
        forfeited: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 10 }
        releasedTransitions: { type: integer, minimum: 0 }
    AppointmentReservationCapacity:
      type: object
      additionalProperties: false
      required: [active, maximum, remaining]
      properties:
        active: { type: integer, minimum: 0 }
        maximum: { type: integer, minimum: 0, maximum: 4 }
        remaining: { type: integer, minimum: 0, maximum: 4 }
    ServiceCreditLedgerEvent:
      type: object
      additionalProperties: false
      required: [eventId, creditId, eventType, source, packageCode, policyVersion, appointmentId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        creditId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/CreditLedgerEventType' }
        source: { $ref: '#/components/schemas/CreditSource' }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        policyVersion: { $ref: '#/components/schemas/ConsultationCreditPolicyVersion' }
        appointmentId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    ServiceCreditAccount:
      type: object
      additionalProperties: false
      required: [accountId, packageCode, source, sourceReference, periodStart, periodEnd, policyVersion, balance, reservationCapacity, history, generatedAt]
      properties:
        accountId: { type: string, format: uuid }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        source: { $ref: '#/components/schemas/CreditSource' }
        sourceReference: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        policyVersion: { $ref: '#/components/schemas/ConsultationCreditPolicyVersion' }
        balance: { $ref: '#/components/schemas/ServiceCreditBalance' }
        reservationCapacity: { $ref: '#/components/schemas/AppointmentReservationCapacity' }
        history:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ServiceCreditLedgerEvent' }
        generatedAt: { type: string, format: date-time }
    SupportArea:
      type: string
      enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS]
    SpecialistApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
    LanguageTag:
      type: string
      enum: [vi, en]
    SpecialistProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, bio, supportAreas, languages, yearsOfExperience, timezone]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        supportAreas:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportArea' }
        languages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/LanguageTag' }
        yearsOfExperience: { type: integer, minimum: 0, maximum: 80 }
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone validated by the provider.
    SpecialistProfile:
      type: object
      additionalProperties: false
      required: [accountId, displayName, bio, supportAreas, languages, yearsOfExperience, timezone, approvalStatus, submittedAt, reviewedAt, reviewedBy, decisionReasonCode, createdAt, updatedAt, version]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        supportAreas:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportArea' }
        languages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/LanguageTag' }
        yearsOfExperience: { type: integer, minimum: 0, maximum: 80 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        approvalStatus: { $ref: '#/components/schemas/SpecialistApprovalStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        decisionReasonCode: { type: [string, 'null'], maxLength: 64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    PendingSpecialistProfiles:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SpecialistProfile' }
        count: { type: integer, minimum: 0, maximum: 100 }
    AvailabilityModality:
      type: string
      enum: [IN_APP_CHAT, IN_APP_VIDEO]
    AvailabilitySlotStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN]
    AvailabilityReadiness:
      type: string
      enum: [AVAILABLE, STARTED, WITHDRAWN, VIDEO_DISABLED]
    PublishAvailabilitySlotRequest:
      type: object
      additionalProperties: false
      required: [startAt, endAt, timezone, modality]
      properties:
        startAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Inclusive UTC start instant.
        endAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Exclusive UTC end instant exactly 60 minutes after startAt.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone retained only for stable display.
        modality: { $ref: '#/components/schemas/AvailabilityModality' }
    AvailabilitySlot:
      type: object
      additionalProperties: false
      required: [id, startAt, endAt, timezone, modality, status, readiness, withdrawnAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        modality: { $ref: '#/components/schemas/AvailabilityModality' }
        status: { $ref: '#/components/schemas/AvailabilitySlotStatus' }
        readiness: { $ref: '#/components/schemas/AvailabilityReadiness' }
        withdrawnAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    AvailabilitySlotList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt, videoPublishingEnabled]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
        count: { type: integer, minimum: 0, maximum: 500 }
        generatedAt: { type: string, format: date-time }
        videoPublishingEnabled:
          type: boolean
          description: True only while the reviewed video capability/provider contract gate is enabled.
    AppointmentModality:
      type: string
      enum: [IN_APP_CHAT, IN_APP_VIDEO]
    RequestAppointment:
      type: object
      additionalProperties: false
      required: [slotId, modality]
      properties:
        slotId: { type: string, format: uuid }
        modality: { $ref: '#/components/schemas/AppointmentModality' }
        replacesAppointmentId:
          type: [string, 'null']
          format: uuid
          description: Active user-owned appointment atomically replaced by this new request; omit for a normal request.
    BookableSlot:
      type: object
      additionalProperties: false
      required: [id, specialistAccountId, specialistDisplayName, startAt, endAt, timezone, modality]
      properties:
        id: { type: string, format: uuid }
        specialistAccountId: { type: string, format: uuid }
        specialistDisplayName: { type: string, minLength: 1, maxLength: 120 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        modality: { $ref: '#/components/schemas/AppointmentModality' }
    BookableSlotList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt, videoEnabled]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/BookableSlot' }
        count: { type: integer, minimum: 0, maximum: 200 }
        generatedAt: { type: string, format: date-time }
        videoEnabled: { type: boolean }
    Appointment:
      type: object
      additionalProperties: false
      required: [id, slotId, specialistAccountId, specialistDisplayName, status, modality, scheduledStartAt, scheduledEndAt, timezone, requestedAt, decisionDeadlineAt, heldCreditId, replacesAppointmentId]
      properties:
        id: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        specialistAccountId: { type: string, format: uuid }
        specialistDisplayName: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [REQUESTED, CONFIRMED, IN_PROGRESS, REJECTED, EXPIRED, CANCELLED] }
        modality: { $ref: '#/components/schemas/AppointmentModality' }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        requestedAt: { type: string, format: date-time }
        decisionDeadlineAt: { type: string, format: date-time }
        heldCreditId: { type: string, format: uuid }
        replacesAppointmentId: { type: [string, 'null'], format: uuid }
    AppointmentList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Appointment' }
        count: { type: integer, minimum: 0, maximum: 100 }
        generatedAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        correlationId: { type: string, format: uuid }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    AppointmentForbiddenProblem:
      description: USER role or a current PLUS/PREMIUM entitlement is required (PAID_PLAN_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentSlotNotFoundProblem:
      description: The selected slot or requested replacement appointment does not exist (APPOINTMENT_SLOT_NOT_FOUND or APPOINTMENT_REPLACEMENT_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentConflictProblem:
      description: Slot, modality, lead time, video capability, credit, reservation capacity, replacement state, concurrency, or idempotency prevents the request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CreditConflictProblem:
      description: Entitlement period conflicts with an already provisioned immutable credit period
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Invalid body, path, or query parameter (VALIDATION_FAILED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: Authentication is missing or invalid (UNAUTHENTICATED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Required SPECIALIST or ADMIN role is absent (CONSULTATION_ROLE_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntitlementForbiddenProblem:
      description: The entitlement lookup requires an authenticated USER role (ENTITLEMENT_USER_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: Specialist profile does not exist (SPECIALIST_PROFILE_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: Profile state does not allow the requested operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionProblem:
      description: If-Match does not equal the current profile version (SPECIALIST_PROFILE_VERSION_MISMATCH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionRequiredProblem:
      description: If-Match is required for the existing profile or command (PROFILE_VERSION_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityNotFoundProblem:
      description: Owned availability slot does not exist (AVAILABILITY_SLOT_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityConflictProblem:
      description: Slot overlaps active availability, is stale/withdrawn, reuses a key for another command, belongs to an unapproved specialist, or requests disabled video.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityVersionProblem:
      description: If-Match does not equal the current slot version (AVAILABILITY_SLOT_VERSION_MISMATCH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityVersionRequiredProblem:
      description: If-Match is required for withdrawal (AVAILABILITY_SLOT_VERSION_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
