        specialistAccountId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        supportAreas:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportArea' }
        languages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/LanguageTag' }
        yearsOfExperience: { type: integer, minimum: 0, maximum: 80 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        ratingAggregate:
          oneOf:
            - { $ref: '#/components/schemas/SpecialistRatingAggregate' }
            - { type: 'null' }
        explanation: { $ref: '#/components/schemas/DiscoveryExplanation' }
        selectableSlots:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/DiscoverySlot' }
    SpecialistDiscoveryPage:
      type: object
      additionalProperties: false
      required: [items, count, nextCursor, rankingPolicyVersion, generatedAt, contextState, packageCode, bookingHandoff, videoEnabled]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SpecialistDiscoveryItem' }
        count: { type: integer, minimum: 0, maximum: 50 }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        rankingPolicyVersion: { type: string, const: specialist-discovery-v2 }
        generatedAt: { type: string, format: date-time }
        contextState: { $ref: '#/components/schemas/DiscoveryContextState' }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        bookingHandoff: { $ref: '#/components/schemas/BookingHandoff' }
        videoEnabled: { type: boolean }
    SpecialistRatingAggregate:
      type: object
      additionalProperties: false
      required: [averageRating, ratingCount]
      properties:
        averageRating: { type: number, format: double, minimum: 1, maximum: 5, multipleOf: 0.01 }
        ratingCount: { type: integer, format: int64, minimum: 1 }
    SaveAppointmentRating:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
    AppointmentRating:
      type: object
      additionalProperties: false
      required: [appointmentId, specialistAccountId, rating, createdAt, updatedAt, version, specialistAggregate]
      properties:
        appointmentId: { type: string, format: uuid }
        specialistAccountId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        specialistAggregate: { $ref: '#/components/schemas/SpecialistRatingAggregate' }
    Appointment:
      type: object
      additionalProperties: false
      required: [id, slotId, specialistAccountId, specialistDisplayName, status, modality, scheduledStartAt, scheduledEndAt, timezone, requestedAt, decisionDeadlineAt, heldCreditId, replacesAppointmentId, replacedByAppointmentId, decidedAt, decisionReason, cancelledAt, cancellationReason, cancellationActor, cancellationCreditOutcome, sessionOutcome, sessionOutcomeReason, sessionPolicyVersion, sessionEndedAt, sessionSettledAt, completionFactId, creditState, history, version]
      properties:
        id: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        specialistAccountId: { type: string, format: uuid }
        specialistDisplayName: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [REQUESTED, CONFIRMED, IN_PROGRESS, SESSION_ENDED, COMPLETED, REJECTED, EXPIRED, CANCELLED] }
        modality: { $ref: '#/components/schemas/AppointmentModality' }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        requestedAt: { type: string, format: date-time }
        decisionDeadlineAt: { type: string, format: date-time }
        heldCreditId: { type: string, format: uuid }
        replacesAppointmentId: { type: [string, 'null'], format: uuid }
        replacedByAppointmentId: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason:
          type: [string, 'null']
          enum: [SPECIALIST_ACCEPTED, SPECIALIST_REJECTED, DECISION_DEADLINE_EXPIRED, null]
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancellationReason:
          type: [string, 'null']
          enum: [USER_CANCELLED, USER_RESCHEDULED, SPECIALIST_SUSPENDED, null]
        cancellationActor:
          type: [string, 'null']
          enum: [USER, ADMIN, null]
        cancellationCreditOutcome:
          oneOf:
            - { $ref: '#/components/schemas/AppointmentCancellationCreditOutcome' }
            - { type: 'null' }
        sessionOutcome:
          type: [string, 'null']
          enum: [COMPLETED, USER_NO_SHOW, SPECIALIST_NO_SHOW, BOTH_NO_SHOW, INSUFFICIENT_EVIDENCE, EVIDENCE_REVIEW, null]
        sessionOutcomeReason: { type: [string, 'null'], maxLength: 64 }
        sessionPolicyVersion: { type: [string, 'null'], enum: [chat-session-completion-v1, null] }
        sessionEndedAt: { type: [string, 'null'], format: date-time }
        sessionSettledAt: { type: [string, 'null'], format: date-time }
        completionFactId: { type: [string, 'null'], format: uuid }
        creditState: { type: string, enum: [AVAILABLE, HELD, CONSUMED, FORFEITED] }
        history:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AppointmentHistoryEntry' }
        version: { type: integer, format: int64, minimum: 0 }
    OpenAppointmentDispute:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          enum: [OUTCOME_INCORRECT, PARTICIPATION_EVIDENCE_INCORRECT, SESSION_DELIVERY_NOT_RECOGNIZED, TECHNICAL_FAILURE]
        evidenceType:
          type: [string, 'null']
          enum: [ACCESS_LOG, CONNECTION_INCIDENT, PROVIDER_INCIDENT, null]
        evidenceOccurredAt: { type: [string, 'null'], format: date-time }
    ResolveAppointmentDispute:
      type: object
      additionalProperties: false
      required: [outcome, reasonCode]
      properties:
        outcome: { type: string, enum: [UPHOLD_RECORDED_OUTCOME, RELEASE_USER_CREDIT] }
        reasonCode:
          type: string
          enum: [EVIDENCE_SUPPORTS_RECORDED_OUTCOME, EVIDENCE_INCONCLUSIVE_RELEASED, TECHNICAL_FAILURE_CONFIRMED]
    AppointmentDispute:
      type: object
      additionalProperties: false
      required: [id, appointmentId, appointmentVersion, status, openedByRole, reasonCode, evidenceType, evidenceOccurredAt, openedAt, eligibleUntil, settlementGated, resolutionOutcome, resolutionReason, resolvedAt, priorAppointmentStatus, priorSessionOutcome, resultingAppointmentStatus, resultingSessionOutcome, creditAction, version]
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        appointmentVersion: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [OPEN, RESOLVED] }
        openedByRole: { type: string, enum: [USER, SPECIALIST] }
        reasonCode: { type: string, enum: [OUTCOME_INCORRECT, PARTICIPATION_EVIDENCE_INCORRECT, SESSION_DELIVERY_NOT_RECOGNIZED, TECHNICAL_FAILURE] }
        evidenceType: { type: [string, 'null'], enum: [ACCESS_LOG, CONNECTION_INCIDENT, PROVIDER_INCIDENT, null] }
        evidenceOccurredAt: { type: [string, 'null'], format: date-time }
        openedAt: { type: string, format: date-time }
        eligibleUntil: { type: string, format: date-time }
        settlementGated: { type: boolean }
        resolutionOutcome: { type: [string, 'null'], enum: [UPHOLD_RECORDED_OUTCOME, RELEASE_USER_CREDIT, null] }
        resolutionReason: { type: [string, 'null'], enum: [EVIDENCE_SUPPORTS_RECORDED_OUTCOME, EVIDENCE_INCONCLUSIVE_RELEASED, TECHNICAL_FAILURE_CONFIRMED, null] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        priorAppointmentStatus: { type: [string, 'null'] }
        priorSessionOutcome: { type: [string, 'null'] }
        resultingAppointmentStatus: { type: [string, 'null'] }
        resultingSessionOutcome: { type: [string, 'null'] }
        creditAction: { type: [string, 'null'], enum: [NONE, ALREADY_AVAILABLE, ADJUSTED_RELEASED, null] }
        version: { type: integer, format: int64, minimum: 0 }
    AppointmentDisputeList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AppointmentDispute' }
        count: { type: integer, minimum: 0, maximum: 100 }
        generatedAt: { type: string, format: date-time }
    ConsultationBriefAppointmentContext:
      type: object
      additionalProperties: false
      required: [appointmentId, userAccountId, specialistAccountId, status, scheduledStartAt, scheduledEndAt, version]
      properties:
        appointmentId: { type: string, format: uuid }
        userAccountId: { type: string, format: uuid }
        specialistAccountId: { type: string, format: uuid }
        status: { type: string, enum: [REQUESTED, CONFIRMED, IN_PROGRESS, SESSION_ENDED, COMPLETED, REJECTED, EXPIRED, CANCELLED] }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    SpecialistClientRelationship:
      type: object
      additionalProperties: false
      required: [appointmentId, userAccountId, status, modality, scheduledStartAt, scheduledEndAt, appointmentVersion]
      properties:
        appointmentId: { type: string, format: uuid }
        userAccountId: { type: string, format: uuid }
        status: { type: string, enum: [CONFIRMED, IN_PROGRESS, SESSION_ENDED, COMPLETED] }
        modality: { $ref: '#/components/schemas/AppointmentModality' }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        appointmentVersion: { type: integer, format: int64, minimum: 0 }
    SpecialistClientRelationshipList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt, recentSince, policyVersion]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/SpecialistClientRelationship' }
        count: { type: integer, minimum: 0, maximum: 200 }
        generatedAt: { type: string, format: date-time }
        recentSince: { type: string, format: date-time }
        policyVersion: { type: string, const: specialist-client-continuity-v1 }
    AppointmentList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Appointment' }
        count: { type: integer, minimum: 0, maximum: 100 }
        generatedAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        correlationId: { type: string, format: uuid }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    AppointmentForbiddenProblem:
      description: USER role or a current PLUS/PREMIUM entitlement is required (PAID_PLAN_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentSlotNotFoundProblem:
      description: The selected slot or requested replacement appointment does not exist (APPOINTMENT_SLOT_NOT_FOUND or APPOINTMENT_REPLACEMENT_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentConflictProblem:
      description: Slot, modality, lead time, video capability, credit, reservation capacity, cancellation/replacement eligibility or time window, concurrency, or idempotency prevents the command.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentDecisionForbiddenProblem:
      description: The authenticated specialist is not assigned to this appointment (APPOINTMENT_NOT_ASSIGNED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentNotFoundProblem:
      description: Appointment does not exist (APPOINTMENT_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentDecisionConflictProblem:
      description: The request is terminal, past its decision deadline, has inconsistent held credit, or reuses an idempotency key for another decision.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentVersionProblem:
      description: If-Match does not equal the current appointment version (APPOINTMENT_VERSION_MISMATCH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppointmentVersionRequiredProblem:
      description: If-Match is required for a specialist decision, owner cancellation, or replacement request (APPOINTMENT_VERSION_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DiscoveryNotFoundProblem:
      description: The profile is absent or is not currently approved (SPECIALIST_NOT_DISCOVERABLE).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DiscoveryCursorConflictProblem:
      description: The cursor belongs to another criteria set or ranking policy (DISCOVERY_CURSOR_STALE).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CreditConflictProblem:
      description: Entitlement period conflicts with an already provisioned immutable credit period
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Invalid body, path, or query parameter (VALIDATION_FAILED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: Authentication is missing or invalid (UNAUTHENTICATED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Required SPECIALIST or ADMIN role is absent (CONSULTATION_ROLE_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntitlementForbiddenProblem:
      description: The entitlement lookup requires an authenticated USER role (ENTITLEMENT_USER_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: Specialist profile does not exist (SPECIALIST_PROFILE_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: Profile state does not allow the requested operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionProblem:
      description: If-Match does not equal the current profile version (SPECIALIST_PROFILE_VERSION_MISMATCH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionRequiredProblem:
      description: If-Match is required for the existing profile or command (PROFILE_VERSION_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityNotFoundProblem:
      description: Owned availability slot does not exist (AVAILABILITY_SLOT_NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityConflictProblem:
      description: Slot overlaps active availability, is stale/withdrawn, reuses a key for another command, belongs to an unapproved specialist, or requests disabled video.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityVersionProblem:
      description: If-Match does not equal the current slot version (AVAILABILITY_SLOT_VERSION_MISMATCH).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityVersionRequiredProblem:
      description: If-Match is required for withdrawal (AVAILABILITY_SLOT_VERSION_REQUIRED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnavailableProblem:
      description: Payout encryption or MoMo callback credentials are not configured; real payout remains disabled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
