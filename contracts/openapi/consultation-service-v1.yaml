        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendSpecialistRequest' }
      responses:
        '200':
          description: Suspended profile and committed downstream outcomes
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistSuspensionResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/admin/specialist-profiles/{specialistAccountId}/restore:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/SpecialistAccountId'
    post:
      operationId: restoreSpecialistProfile
      description: Restores one SUSPENDED profile to APPROVED. Previously withdrawn availability and cancelled appointments remain unchanged and require new owner actions.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Restored approved profile
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-MentalBridge-Service-Token
  parameters:
    SpecialistAccountId:
      name: specialistAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Omit only when creating the first profile; otherwise quote the current non-negative version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative profile version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AvailabilitySlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionSummaryId:
      name: summaryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgreedNextStepId:
      name: nextStepId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Printable caller key scoped to the authenticated actor and retained with the command outcome.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    AvailabilitySlotIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative availability slot version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AppointmentIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative appointment version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    OptionalAppointmentIfMatch:
      name: If-Match
      in: header
      required: false
      description: Required with replacesAppointmentId and ignored only for a normal non-replacement request. Contains the quoted current version of the appointment being replaced.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    SessionSummaryIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current non-negative consent or next-step state version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    OptionalSessionSummaryIfMatch:
      name: If-Match
      in: header
      required: false
      description: Omit for the first publication; required for an amendment and contains the quoted current summary version.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  headers:
    ProfileETag:
      description: Quoted current profile version for If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AvailabilitySlotETag:
      description: Quoted current availability slot version for If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    AppointmentETag:
      description: Quoted current appointment version for If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  schemas:
    AppointmentNotificationEligibility:
      type: object
      additionalProperties: false
      required: [appointmentId, ownerAccountId, version, status, scheduledStartAt, modality, eligible]
      properties:
        appointmentId: { type: string, format: uuid }
        ownerAccountId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        status: { type: string }
        scheduledStartAt: { type: string, format: date-time }
        modality: { type: string, enum: [IN_APP_CHAT, IN_APP_VIDEO] }
        eligible: { type: boolean }
    ServicePackage:
      type: string
      enum: [FREE, PLUS, PREMIUM]
    EntitlementSource:
      type: string
      enum: [DEFAULT_FREE, DEMO, PAID]
    CurrentServiceEntitlement:
      type: object
      additionalProperties: false
      required: [accountId, packageCode, source, sourceReference, effectiveFrom, effectiveUntil, policyVersion, version, decidedAt]
      properties:
        accountId: { type: string, format: uuid }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        source: { $ref: '#/components/schemas/EntitlementSource' }
        sourceReference:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: Explicit demo identifier or future paid lifecycle reference; null only for DEFAULT_FREE.
        effectiveFrom: { type: [string, 'null'], format: date-time }
        effectiveUntil:
          type: [string, 'null']
          format: date-time
          description: Exclusive entitlement end; null only for DEFAULT_FREE.
        policyVersion: { type: string, const: service-entitlement-v1 }
        version: { type: integer, format: int64, minimum: 0 }
        decidedAt: { type: string, format: date-time }
    CreditSource:
      type: string
      enum: [DEFAULT_FREE, DEMO, PAID]
    CreditLedgerEventType:
      type: string
      enum: [PROVISIONED, HELD, CONSUMED, RELEASED, FORFEITED]
    ConsultationCreditPolicyVersion:
      type: string
      enum: [consultation-credit-v1, consultation-credit-v2]
    ServiceCreditBalance:
      type: object
      additionalProperties: false
      required: [available, held, consumed, forfeited, total, releasedTransitions]
      properties:
        available: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        consumed: { type: integer, minimum: 0 }
        forfeited: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 10 }
        releasedTransitions: { type: integer, minimum: 0 }
    AppointmentReservationCapacity:
      type: object
      additionalProperties: false
      required: [active, maximum, remaining]
      properties:
        active: { type: integer, minimum: 0 }
        maximum: { type: integer, minimum: 0, maximum: 4 }
        remaining: { type: integer, minimum: 0, maximum: 4 }
    ServiceCreditLedgerEvent:
      type: object
      additionalProperties: false
      required: [eventId, creditId, eventType, source, packageCode, policyVersion, appointmentId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        creditId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/CreditLedgerEventType' }
        source: { $ref: '#/components/schemas/CreditSource' }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        policyVersion: { $ref: '#/components/schemas/ConsultationCreditPolicyVersion' }
        appointmentId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    ServiceCreditAccount:
      type: object
      additionalProperties: false
      required: [accountId, packageCode, source, sourceReference, periodStart, periodEnd, policyVersion, balance, reservationCapacity, history, generatedAt]
      properties:
        accountId: { type: string, format: uuid }
        packageCode: { $ref: '#/components/schemas/ServicePackage' }
        source: { $ref: '#/components/schemas/CreditSource' }
        sourceReference: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        periodStart: { type: [string, 'null'], format: date-time }
        periodEnd: { type: [string, 'null'], format: date-time }
        policyVersion: { $ref: '#/components/schemas/ConsultationCreditPolicyVersion' }
        balance: { $ref: '#/components/schemas/ServiceCreditBalance' }
        reservationCapacity: { $ref: '#/components/schemas/AppointmentReservationCapacity' }
        history:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ServiceCreditLedgerEvent' }
        generatedAt: { type: string, format: date-time }
    SupportArea:
      type: string
      enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS]
    SpecialistApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
    SpecialistDecisionReasonCode:
      type: string
      enum:
        - PROFILE_INFORMATION_INCOMPLETE
        - PROFILE_CONTENT_NOT_APPROVED
        - OUTSIDE_SUPPORTED_SCOPE
        - POLICY_VIOLATION
        - QUALITY_REVIEW_REQUIRED
        - ACCOUNT_REVIEW_REQUIRED
    SpecialistRejectionReasonCode:
      type: string
      enum: [PROFILE_INFORMATION_INCOMPLETE, PROFILE_CONTENT_NOT_APPROVED, OUTSIDE_SUPPORTED_SCOPE]
    SpecialistSuspensionReasonCode:
      type: string
      enum: [POLICY_VIOLATION, QUALITY_REVIEW_REQUIRED, ACCOUNT_REVIEW_REQUIRED]
    LanguageTag:
      type: string
      enum: [vi, en]
    SpecialistProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, bio, supportAreas, languages, yearsOfExperience, timezone]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        supportAreas:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportArea' }
        languages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/LanguageTag' }
        yearsOfExperience: { type: integer, minimum: 0, maximum: 80 }
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone validated by the provider.
    SpecialistProfile:
      type: object
      additionalProperties: false
      required: [accountId, displayName, bio, supportAreas, languages, yearsOfExperience, timezone, approvalStatus, submittedAt, reviewedAt, reviewedBy, decisionReasonCode, createdAt, updatedAt, version]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        supportAreas:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SupportArea' }
        languages:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/LanguageTag' }
        yearsOfExperience: { type: integer, minimum: 0, maximum: 80 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        approvalStatus: { $ref: '#/components/schemas/SpecialistApprovalStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        decisionReasonCode:
          oneOf:
            - $ref: '#/components/schemas/SpecialistDecisionReasonCode'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    SpecialistProfiles:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SpecialistProfile' }
        count: { type: integer, minimum: 0, maximum: 100 }
    RejectSpecialistRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/SpecialistRejectionReasonCode' }
    SuspendSpecialistRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/SpecialistSuspensionReasonCode' }
    SpecialistSuspensionEffects:
      type: object
      additionalProperties: false
      required: [withdrawnAvailabilitySlots, cancelledAppointments, releasedCredits]
      properties:
        withdrawnAvailabilitySlots: { type: integer, minimum: 0 }
        cancelledAppointments: { type: integer, minimum: 0 }
        releasedCredits: { type: integer, minimum: 0 }
    SpecialistSuspensionResult:
      type: object
      additionalProperties: false
      required: [profile, effects]
      properties:
        profile: { $ref: '#/components/schemas/SpecialistProfile' }
        effects: { $ref: '#/components/schemas/SpecialistSuspensionEffects' }
    AvailabilityModality:
      type: string
      enum: [IN_APP_CHAT, IN_APP_VIDEO]
    AvailabilitySlotStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN]
    AvailabilityReadiness:
      type: string
      enum: [AVAILABLE, STARTED, WITHDRAWN, VIDEO_DISABLED]
    PublishAvailabilitySlotRequest:
      type: object
      additionalProperties: false
      required: [startAt, endAt, timezone, modality]
      properties:
        startAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Inclusive UTC start instant.
        endAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Exclusive UTC end instant exactly 60 minutes after startAt.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone retained only for stable display.
        modality: { $ref: '#/components/schemas/AvailabilityModality' }
    AvailabilitySlot:
      type: object
      additionalProperties: false
      required: [id, startAt, endAt, timezone, modality, status, readiness, withdrawnAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        modality: { $ref: '#/components/schemas/AvailabilityModality' }
        status: { $ref: '#/components/schemas/AvailabilitySlotStatus' }
        readiness: { $ref: '#/components/schemas/AvailabilityReadiness' }
        withdrawnAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    AvailabilitySlotList:
      type: object
      additionalProperties: false
      required: [items, count, generatedAt, videoPublishingEnabled]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
        count: { type: integer, minimum: 0, maximum: 500 }
        generatedAt: { type: string, format: date-time }
        videoPublishingEnabled:
          type: boolean
          description: True only while the reviewed video capability/provider contract gate is enabled.
    DashboardDataState:
      type: string
      enum: [AVAILABLE, EMPTY, BLOCKED, UNAVAILABLE]
    SpecialistOperationalStatus:
      type: string
      enum: [READY, PROFILE_REQUIRED, PENDING_APPROVAL, PROFILE_REJECTED, SUSPENDED]
    SpecialistDashboardActionType:
      type: string
      enum:
        - COMPLETE_PROFILE
        - AWAIT_PROFILE_APPROVAL
        - UPDATE_REJECTED_PROFILE
        - CONTACT_SUPPORT
        - REVIEW_APPOINTMENT_REQUESTS
        - PUBLISH_AVAILABILITY
    SpecialistDashboardProfile:
      type: object
      additionalProperties: false
      required: [source, asOf, state, displayName, timezone, approvalStatus]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/DashboardDataState' }
        displayName: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        timezone: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        approvalStatus:
          oneOf:
            - { $ref: '#/components/schemas/SpecialistApprovalStatus' }
            - { type: 'null' }
    SpecialistDashboardAppointmentItem:
      type: object
      additionalProperties: false
      required: [source, asOf, appointmentId, status, modality, scheduledStartAt, scheduledEndAt, timezone, decisionDeadlineAt]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        appointmentId: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, CONFIRMED, IN_PROGRESS]
        modality: { $ref: '#/components/schemas/AppointmentModality' }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        decisionDeadlineAt: { type: string, format: date-time }
    SpecialistDashboardRatingAggregate:
      type: object
      additionalProperties: false
      required: [source, asOf, state, averageRating, ratingCount]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/DashboardDataState' }
        averageRating: { type: [number, 'null'], format: double, minimum: 1, maximum: 5 }
        ratingCount: { type: integer, format: int64, minimum: 0 }
    SpecialistDashboardAppointmentCollection:
      type: object
      additionalProperties: false
      required: [source, asOf, state, count, localDate, timezone, items]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/DashboardDataState' }
        count: { type: integer, minimum: 0 }
        localDate: { type: [string, 'null'], format: date }
        timezone: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        items:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/SpecialistDashboardAppointmentItem' }
    SpecialistDashboardNextAppointment:
      type: object
      additionalProperties: false
      required: [source, asOf, state, item]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/DashboardDataState' }
        item:
          oneOf:
            - { $ref: '#/components/schemas/SpecialistDashboardAppointmentItem' }
            - { type: 'null' }
    SpecialistDashboardAvailabilityItem:
      type: object
      additionalProperties: false
      required: [source, asOf, slotId, modality, startAt, endAt, timezone]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        slotId: { type: string, format: uuid }
        modality: { $ref: '#/components/schemas/AvailabilityModality' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    SpecialistDashboardAvailabilityCollection:
      type: object
      additionalProperties: false
      required: [source, asOf, state, count, items]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/DashboardDataState' }
        count: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/SpecialistDashboardAvailabilityItem' }
    SpecialistDashboardActionItem:
      type: object
      additionalProperties: false
      required: [source, asOf, type, count]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/SpecialistDashboardActionType' }
        count: { type: integer, minimum: 1 }
    SpecialistDashboard:
      type: object
      additionalProperties: false
      required: [source, generatedAt, operationalStatus, profile, ratingAggregate, todayConfirmedSessions, pendingAppointmentRequests, nextAppointment, availability, actionRequired]
      properties:
        source: { type: string, const: CONSULTATION }
        generatedAt: { type: string, format: date-time }
        operationalStatus: { $ref: '#/components/schemas/SpecialistOperationalStatus' }
        profile: { $ref: '#/components/schemas/SpecialistDashboardProfile' }
        ratingAggregate: { $ref: '#/components/schemas/SpecialistDashboardRatingAggregate' }
        todayConfirmedSessions: { $ref: '#/components/schemas/SpecialistDashboardAppointmentCollection' }
        pendingAppointmentRequests: { $ref: '#/components/schemas/SpecialistDashboardAppointmentCollection' }
        nextAppointment: { $ref: '#/components/schemas/SpecialistDashboardNextAppointment' }
        availability: { $ref: '#/components/schemas/SpecialistDashboardAvailabilityCollection' }
        actionRequired:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/SpecialistDashboardActionItem' }
    SpecialistAnalyticsDataState:
      type: string
      enum: [AVAILABLE, EMPTY, BLOCKED, UNAVAILABLE, STALE]
    SpecialistAnalyticsPeriod:
      type: object
      additionalProperties: false
      required: [from, to, timezone]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    SpecialistAvailabilityMetrics:
      type: object
      additionalProperties: false
      required: [source, asOf, state, publishedSlotCount, utilizedSlotCount, unusedSlotCount, utilizationRate]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/SpecialistAnalyticsDataState' }
        publishedSlotCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        utilizedSlotCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        unusedSlotCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        utilizationRate: { type: [number, 'null'], format: double, minimum: 0, maximum: 100 }
    SpecialistAppointmentMetrics:
      type: object
      additionalProperties: false
      required: [source, asOf, state, requestedCount, acceptedCount, rejectedCount, expiredCount, cancelledCount, rescheduledCount, completedCount, userNoShowCount, specialistNoShowCount, bothNoShowCount]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/SpecialistAnalyticsDataState' }
        requestedCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        acceptedCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        rejectedCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        expiredCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        cancelledCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        rescheduledCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        completedCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        userNoShowCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        specialistNoShowCount: { type: [integer, 'null'], format: int64, minimum: 0 }
        bothNoShowCount: { type: [integer, 'null'], format: int64, minimum: 0 }
    SpecialistRatingMetrics:
      type: object
      additionalProperties: false
      required: [source, asOf, state, averageRating, ratingCount]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/SpecialistAnalyticsDataState' }
        averageRating: { type: [number, 'null'], format: double, minimum: 1, maximum: 5 }
        ratingCount: { type: [integer, 'null'], format: int64, minimum: 0 }
    SpecialistFinancialMetrics:
      type: object
      additionalProperties: false
      required: [source, asOf, state, currency, earnedAmountMinor, paidAmountMinor]
      properties:
        source: { type: string, const: CONSULTATION }
        asOf: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/SpecialistAnalyticsDataState' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        earnedAmountMinor: { type: [integer, 'null'], format: int64, minimum: 0 }
