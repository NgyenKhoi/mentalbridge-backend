openapi: 3.1.0
info:
  title: MentalBridge Consultation Service API
  version: 1.10.0
  description: Consultation-owned specialist profile lifecycle, approved online discovery, service-plan entitlement and credit lookup, online availability, appointment requests, appointment-scoped chat eligibility and minimized completion evidence, auditable owner cancellation/reschedule/session outcomes, immutable user-visible session summaries and agreed next steps, evidence-backed specialist earnings, fake local payout reconciliation, credit reservation limits, and suspension outcomes.
servers:
  - url: http://localhost:8082
paths:
  /internal/v1/appointments/{appointmentId}/notification-eligibility:
    x-mentalbridge-status: implemented
    get:
      operationId: getAppointmentNotificationEligibility
      description: Returns the minimized current Consultation truth for one exact appointment/version immediately before notification delivery. It contains no specialist profile, brief, assessment, Journal, or chat content.
      security: [{ serviceToken: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: appointmentVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Current minimized appointment truth and exact-version eligibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentNotificationEligibility' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /api/v1/service-credits:
    x-mentalbridge-status: implemented
    get:
      operationId: getOwnServiceCredits
      description: Returns the authenticated user's server-authoritative consultation-credit balance, distinct concurrent reservation capacity, and bounded ledger history. Reading provisions any missing credits for the current effective entitlement idempotently; clients must never derive mutable limits from the package name.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current plan, billing period, authoritative balance, and recent history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCreditAccount' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
        '409': { $ref: '#/components/responses/CreditConflictProblem' }
  /internal/v1/entitlements/current:
    x-mentalbridge-status: implemented
    get:
      operationId: getCurrentServiceEntitlement
      description: Returns the authenticated user's current server-authoritative service package. Absence of an effective paid or explicit demo projection returns FREE with DEFAULT_FREE provenance.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current effective service-plan entitlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentServiceEntitlement' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
  /internal/v1/appointments/{appointmentId}/consultation-brief-context:
    x-mentalbridge-status: implemented
    get:
      operationId: getConsultationBriefAppointmentContext
      description: Returns only appointment authority and timing facts required by Care to enforce appointment-scoped ConsultationBrief access. The authenticated actor must own the appointment or be its assigned specialist.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Minimal authoritative appointment context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationBriefAppointmentContext' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /internal/v1/specialist/client-relationships:
    x-mentalbridge-status: implemented
    get:
      operationId: listBoundedSpecialistClientRelationships
      description: Returns only confirmed/in-flight and recent completed appointment relationships assigned to the authenticated currently approved specialist. It is a bounded continuity authority projection, not a user directory, and every read is audited without health content.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Appointment-bounded specialist client relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistClientRelationshipList' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /internal/v1/appointments/{conversationId}/chat-eligibility:
    x-mentalbridge-status: implemented
    parameters:
      - name: conversationId
        in: path
        required: true
        description: The appointment UUID is the stable one-to-one conversation identifier.
        schema: { type: string, format: uuid }
    get:
      operationId: getAppointmentChatEligibility
      description: Returns the authenticated assigned participant's server-authoritative appointment chat phase and operation permissions. Waiting-room entry opens ten minutes before the exact confirmed IN_APP_CHAT interval; sending is allowed only in the half-open scheduled interval. Ended or cancelled conversations remain history-only when a conversation exists.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [SUBSCRIBE, SEND, HISTORY, CHECK_IN]
      responses:
        '200':
          description: Current appointment-scoped chat decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentChatEligibility' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/AppointmentNotFoundProblem' }
  /internal/v1/appointments/{appointmentId}/chat-evidence:
    x-mentalbridge-status: implemented
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordAppointmentChatEvidence
      description: Records idempotent, content-free evidence observed by Realtime for the authenticated assigned participant. Only explicit check-in, bounded server-observed presence, and accepted-message metadata are accepted; late delivery cannot make a post-end occurrence count.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-MentalBridge-Service-Token
          in: header
          required: true
          description: Shared service credential proving the evidence was observed by Realtime.
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatEvidenceRequest' }
      responses:
        '200':
          description: Evidence acceptance, duplicate, or stable ignored reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatEvidenceResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/AppointmentNotFoundProblem' }
  /internal/v1/appointments/{appointmentId}/reusable-session-summaries/{summaryId}:
    x-mentalbridge-status: implemented
    get:
      operationId: getApprovedReusableSessionSummary
      description: Returns one exact immutable summary snapshot only when the user currently approves reuse and the target is a different, later CONFIRMED or IN_PROGRESS appointment for the same user. Owner preparation closes when the target starts; assigned-specialist access is limited to the target appointment's 24-hour-before/after-start window. This is the bounded ConsultationBrief handoff; summary consent alone does not approve a target brief or grant specialist access outside that boundary.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/SessionSummaryId'
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Exact approved reusable snapshot without user checklist state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /internal/v1/resource-proposals/{proposalId}:
    x-mentalbridge-status: implemented
    get:
      operationId: getAuthorizedResourceProposal
      description: Returns the exact latest resource proposal from an evidence-backed completed appointment for its user or assigned specialist. Superseded, hidden, skipped, missing, or unauthorized proposals fail closed. This endpoint supplies provenance to Care and never mutates a SupportPlan.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exact active specialist proposal with completion and summary provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceProposal' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /api/v1/specialist-profile:
    x-mentalbridge-status: implemented
    get:
      operationId: getOwnSpecialistProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current specialist-owned profile
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: saveOwnSpecialistProfileDraft
      description: Creates a PENDING unsubmitted profile or replaces an existing PENDING or REJECTED profile. Editing a submitted PENDING profile clears submittedAt; editing a REJECTED profile preserves its stable reason until explicit resubmission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OptionalIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecialistProfileRequest' }
      responses:
        '200':
          description: Existing draft replaced
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '201':
          description: Draft created
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/specialist-profile/submit:
    x-mentalbridge-status: implemented
    post:
      operationId: submitOwnSpecialistProfile
      description: Places the complete PENDING profile in the administrator review queue.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Profile submitted or unchanged replay
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/specialist-profile/resubmit:
    x-mentalbridge-status: implemented
    post:
      operationId: resubmitOwnSpecialistProfile
      description: Resubmits the same rejected profile after remediation, returns it to PENDING review, and clears the prior decision fields without changing its identity.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Rejected profile resubmitted for review
          headers:
            ETag: { $ref: '#/components/headers/ProfileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistProfile' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '428': { $ref: '#/components/responses/VersionRequiredProblem' }
  /api/v1/availability-slots:
    x-mentalbridge-status: implemented
    get:
      operationId: listOwnAvailabilitySlots
      description: Lists the authenticated specialist's slots in a bounded UTC interval, including tombstones when requested.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive UTC lower bound. Defaults to seven days before the request instant.
          schema: { type: string, format: date-time, pattern: 'Z$' }
        - name: to
          in: query
          required: false
          description: Exclusive UTC upper bound. Defaults to ninety days after the request instant and may span at most 366 days from from.
          schema: { type: string, format: date-time, pattern: 'Z$' }
        - name: includeWithdrawn
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Owner-scoped availability and current modality capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlotList' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      operationId: publishOwnAvailabilitySlot
      description: Publishes one exact future 60-minute online slot. Replaying the same Idempotency-Key with the same command returns the same slot identity and current state.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishAvailabilitySlotRequest' }
      responses:
        '201':
          description: Slot published or the same slot aggregate returned for an exact replay
          headers:
            ETag: { $ref: '#/components/headers/AvailabilitySlotETag' }
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlot' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/AvailabilityConflictProblem' }
  /api/v1/availability-slots/{slotId}:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/AvailabilitySlotId'
    delete:
      operationId: withdrawOwnAvailabilitySlot
      description: Withdraws one owned future slot while retaining an auditable tombstone.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AvailabilitySlotIfMatch'
      responses:
        '200':
          description: Withdrawn slot tombstone
          headers:
            ETag: { $ref: '#/components/headers/AvailabilitySlotETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySlot' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/AvailabilityNotFoundProblem' }
        '409': { $ref: '#/components/responses/AvailabilityConflictProblem' }
        '412': { $ref: '#/components/responses/AvailabilityVersionProblem' }
        '428': { $ref: '#/components/responses/AvailabilityVersionRequiredProblem' }
  /api/v1/bookable-slots:
    x-mentalbridge-status: implemented
    get:
      operationId: listBookableSlots
      description: Lists approved specialists' currently selectable exact 60-minute online slots. Disabled video slots and slots already held by an active appointment are excluded.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Current selectable online slots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookableSlotList' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
  /api/v1/specialists:
    x-mentalbridge-status: implemented
    get:
      operationId: discoverApprovedSpecialists
      description: Returns only current APPROVED profiles and their current selectable exact 60-minute online slots. FREE, PLUS, and PREMIUM may browse. Optional personalization reads one exact owned Care SupportEvaluation server-to-server; its health content is never returned or persisted, and unavailable context degrades to a neutral explained rank.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supportEvaluationId, in: query, schema: { type: string, format: uuid } }
        - { name: supportArea, in: query, schema: { $ref: '#/components/schemas/SupportArea' } }
        - { name: language, in: query, schema: { $ref: '#/components/schemas/LanguageTag' } }
        - { name: timezone, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: modality, in: query, schema: { $ref: '#/components/schemas/AppointmentModality' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 2048 } }
      responses:
        '200':
          description: Deterministically ranked approved specialist page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistDiscoveryPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
        '409': { $ref: '#/components/responses/DiscoveryCursorConflictProblem' }
  /api/v1/specialists/{specialistAccountId}:
    x-mentalbridge-status: implemented
    get:
      operationId: getApprovedSpecialistDetail
      description: Rechecks current approval and slot selectability and returns one approved public profile only when at least one selectable slot remains. A profile that is suspended, rejected, pending, missing, or has no selectable slot is indistinguishable as SPECIALIST_NOT_DISCOVERABLE.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SpecialistAccountId'
        - { name: supportEvaluationId, in: query, schema: { type: string, format: uuid } }
        - { name: language, in: query, schema: { $ref: '#/components/schemas/LanguageTag' } }
        - { name: timezone, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: modality, in: query, schema: { $ref: '#/components/schemas/AppointmentModality' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Current approved public specialist detail and selectable slots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecialistDiscoveryItem' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
        '404': { $ref: '#/components/responses/DiscoveryNotFoundProblem' }
  /api/v1/admin/appointments:
    x-mentalbridge-status: implemented
    get:
      operationId: searchAdminAppointments
      description: Returns a bounded, read-only Consultation-authoritative operational view. It excludes brief, summary, chat, Journal, assessment-answer, private-note, and AI content and grants no session mutation authority.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: modality
          in: query
          schema: { $ref: '#/components/schemas/AppointmentModality' }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Exclusive upper bound. The requested range cannot exceed 180 days.
          schema: { type: string, format: date-time }
        - name: userAccountId
          in: query
          schema: { type: string, format: uuid }
        - name: specialistAccountId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Current owner-authoritative operational appointment page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppointmentPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /api/v1/appointments:
    x-mentalbridge-status: implemented
    get:
      operationId: listOwnAppointments
      description: Lists the authenticated user's authoritative appointment snapshots, including request deadline and held credit identity.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User-owned appointment history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentList' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/EntitlementForbiddenProblem' }
    post:
      operationId: requestAppointment
      description: Atomically creates a REQUESTED appointment for one exact slot after enforcing both available-credit and concurrent-reservation limits. When replacesAppointmentId is supplied, If-Match must carry that appointment's current version; the eligible future appointment is cancelled with an auditable credit outcome and linked to the replacement without temporarily consuming another reservation. Exact command replays return the original appointment.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OptionalAppointmentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestAppointment' }
      responses:
        '201':
          description: Appointment requested or exact replay returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/AppointmentForbiddenProblem' }
        '404': { $ref: '#/components/responses/AppointmentSlotNotFoundProblem' }
        '409': { $ref: '#/components/responses/AppointmentConflictProblem' }
        '412': { $ref: '#/components/responses/AppointmentVersionProblem' }
        '428': { $ref: '#/components/responses/AppointmentVersionRequiredProblem' }
  /api/v1/appointments/{appointmentId}/cancel:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      operationId: cancelOwnAppointment
      description: Cancels one future user-owned REQUESTED or CONFIRMED appointment. REQUESTED and confirmations at least 24 hours before start release the exact held credit; later confirmed cancellations forfeit it. The command records actor, stable reason, occurrence time, credit outcome, and immutable history exactly once.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppointmentIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled appointment or exact command replay
          headers:
            ETag: { $ref: '#/components/headers/AppointmentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/AppointmentForbiddenProblem' }
        '404': { $ref: '#/components/responses/AppointmentNotFoundProblem' }
        '409': { $ref: '#/components/responses/AppointmentConflictProblem' }
        '412': { $ref: '#/components/responses/AppointmentVersionProblem' }
        '428': { $ref: '#/components/responses/AppointmentVersionRequiredProblem' }
  /api/v1/appointments/{appointmentId}/dispute:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      operationId: getOwnAppointmentDispute
      description: Returns the one dispute for an owned appointment without exposing the other participant's account identity or private evidence.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Owned appointment dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDispute' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
