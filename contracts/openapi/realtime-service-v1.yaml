openapi: 3.1.0
info:
  title: MentalBridge Realtime API
  version: 1.2.0
  description: |
    REST recovery and operational contract for Realtime Service. Socket.IO
    messages use the versioned JSON Schemas under contracts/websocket/realtime
    and contracts/websocket/community for their isolated namespaces.
    Appointment eligibility is enforced through Consultation's authoritative
    contract; Community eligibility and content remain authoritative in Community.
    Browser sockets use one-use credentials exchanged by
    an authenticated same-origin BFF; general Identity bearer tokens are never
    exposed to browser JavaScript.
servers:
  - url: /
tags:
  - name: Operations
  - name: Socket credentials
  - name: Message history
  - name: Appointment message moderation
paths:
  /api/v1/community/socket-credentials:
    x-mentalbridge-status: implemented
    $ref: "./community-realtime-v1.json#/paths/~1api~1v1~1community~1socket-credentials"
  /internal/v1/community/socket-credentials:
    x-mentalbridge-status: implemented
    $ref: "./community-realtime-v1.json#/paths/~1internal~1v1~1community~1socket-credentials"
  /internal/v1/socket-credentials:
    x-mentalbridge-status: implemented
    post:
      tags: [Socket credentials]
      operationId: issueRealtimeSocketCredential
      summary: Exchange an authenticated end-user bearer for a one-use socket credential
      security:
        - bearerAuth: []
      responses:
        "201":
          description: One-use credential valid for at most thirty seconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocketCredential" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /health/live:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      operationId: getRealtimeLiveness
      summary: Check whether the process is alive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }
  /health/ready:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      operationId: getRealtimeReadiness
      summary: Check durable storage readiness and enabled realtime transports
      security: []
      responses:
        "200":
          description: MongoDB is ready; Redis and enabled Kafka/Redis fanout transports may be connected or degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /metrics:
    x-mentalbridge-status: implemented
    get:
      tags: [Operations]
      operationId: getRealtimeMetrics
      summary: Read Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /api/v1/conversations/{conversationId}/messages:
    x-mentalbridge-status: implemented
    get:
      tags: [Message history]
      operationId: listConversationMessages
      summary: Recover an authorized bounded page of durable messages
      description: |
        The service reauthorizes the current actor against Consultation for the
        exact appointment before returning retained history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 512 }
          description: Opaque continuation cursor from the previous response
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Newest-first deterministic message page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageHistoryPage" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/conversations/{conversationId}/messages/{messageId}:
    x-mentalbridge-status: implemented
    delete:
      tags: [Appointment message moderation]
      operationId: deleteOwnAppointmentMessage
      summary: Replace an authorized participant's own appointment message with a tombstone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Authoritative idempotent tombstone state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTombstone" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/conversations/{conversationId}/messages/{messageId}/reports:
    x-mentalbridge-status: implemented
    post:
      tags: [Appointment message moderation]
      operationId: reportAppointmentMessage
      summary: Report an existing appointment message as an eligible participant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageReportInput" }
      responses:
        "201":
          description: Authoritative report receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReportReceipt" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/appointment-chat/reports:
    x-mentalbridge-status: implemented
    get:
      tags: [Appointment message moderation]
      operationId: listAppointmentMessageReports
      summary: List bounded appointment-message reports for an authorized administrator
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: state,
            in: query,
            schema: { type: string, enum: [OPEN, RESOLVED] },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Bounded report summaries without message content or reporter identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReportPage" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
  /api/v1/admin/appointment-chat/reports/{reportId}:
    x-mentalbridge-status: implemented
    parameters:
      - $ref: "#/components/parameters/ReportId"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      tags: [Appointment message moderation]
      operationId: getAppointmentMessageReport
      summary: Inspect approved report context and retained message evidence
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Bounded moderation detail for an approved administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReportDetail" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
    patch:
      tags: [Appointment message moderation]
      operationId: resolveAppointmentMessageReport
      summary: Resolve a report with an audited bounded outcome
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MessageReportResolutionInput" }
      responses:
        "200":
          description: Authoritative report resolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReportResolution" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { $ref: "#/components/responses/AccessProblem" }
        "404": { $ref: "#/components/responses/NotFoundProblem" }
        "409": { $ref: "#/components/responses/ConflictProblem" }
components:
  securitySchemes:
    IdentityBearerAuth:
      $ref: "./community-realtime-v1.json#/components/securitySchemes/IdentityBearerAuth"
    RealtimeDelegation:
      $ref: "./community-realtime-v1.json#/components/securitySchemes/RealtimeDelegation"
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        { type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]+$" }
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { const: ok }
        service: { const: realtime-service }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, mongodb, redis]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { const: realtime-service }
        mongodb: { const: connected }
        redis: { type: string, enum: [connected, degraded] }
        community:
          {
            type: string,
            enum: [connected, degraded],
            description: Present only when Community realtime is enabled; includes Kafka and Redis fanout readiness.,
          }
        specialistNotifications:
          {
            type: string,
            enum: [connected, degraded],
            description: Present only when specialist live notifications are enabled; includes the independent Kafka consumer and Redis subscription readiness.,
          }
    SocketCredential:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string, minLength: 32, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
    Message:
      type: object
      additionalProperties: false
      required:
        [
          messageId,
          conversationId,
          senderId,
          clientMessageId,
          type,
          content,
          sentAt,
          state,
          deletedAt,
          schemaVersion,
        ]
      properties:
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        clientMessageId: { type: string, format: uuid }
        type: { const: TEXT }
        content:
          {
            type: [string, "null"],
            minLength: 1,
            maxLength: 4000,
            description: Null for an authoritative tombstone.,
          }
        sentAt: { type: string, format: date-time }
        state: { type: string, enum: [VISIBLE, DELETED] }
        deletedAt: { type: [string, "null"], format: date-time }
        schemaVersion: { const: 1 }
    MessageTombstone:
      type: object
      additionalProperties: false
      required: [messageId, state, deletedAt, duplicate]
      properties:
        messageId: { type: string, format: uuid }
        state: { const: DELETED }
        deletedAt: { type: string, format: date-time }
        duplicate: { type: boolean }
    ReportReason:
      type: string
      enum:
        [
          HARASSMENT,
          PRIVACY_CONCERN,
          SELF_HARM_OR_CRISIS_CONCERN,
          SPAM,
          SEXUAL_OR_VIOLENT_CONTENT,
          OTHER,
        ]
    MessageReportInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ReportReason" }
        context: { type: string, minLength: 1, maxLength: 1000 }
    MessageReportReceipt:
      type: object
      additionalProperties: false
      required: [reportId, state, duplicate]
      properties:
        reportId: { type: string, format: uuid }
        state: { const: OPEN }
        duplicate: { type: boolean }
    MessageReportSummary:
      type: object
      additionalProperties: false
      required:
        [
          reportId,
          conversationId,
          messageId,
          reason,
          state,
          resolution,
          createdAt,
          updatedAt,
        ]
      properties:
        reportId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        state: { type: string, enum: [OPEN, RESOLVED] }
        resolution:
          { type: [string, "null"], enum: [NO_ACTION, MESSAGE_REMOVED, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MessageReportPage:
      type: object
      additionalProperties: false
      required: [items, count]
      properties:
        items:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/MessageReportSummary" },
          }
        count: { type: integer, minimum: 0, maximum: 100 }
    MessageReportDetail:
      allOf:
        - $ref: "#/components/schemas/MessageReportSummary"
        - type: object
          required: [context, message]
          properties:
            context: { type: [string, "null"], maxLength: 1000 }
            message:
              type: [object, "null"]
              additionalProperties: false
              required: [messageId, senderId, content, sentAt, state, deletedAt]
              properties:
                messageId: { type: string, format: uuid }
                senderId: { type: string, format: uuid }
                content: { type: string, minLength: 1, maxLength: 4000 }
                sentAt: { type: string, format: date-time }
                state: { type: string, enum: [VISIBLE, DELETED] }
                deletedAt: { type: [string, "null"], format: date-time }
    MessageReportResolutionInput:
      type: object
      additionalProperties: false
      required: [resolution, reason]
      properties:
        resolution: { type: string, enum: [NO_ACTION, MESSAGE_REMOVED] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MessageReportResolution:
      type: object
      additionalProperties: false
      required: [reportId, state, resolution, duplicate]
      properties:
        reportId: { type: string, format: uuid }
        state: { const: RESOLVED }
        resolution: { type: string, enum: [NO_ACTION, MESSAGE_REMOVED] }
        duplicate: { type: boolean }
    MessageHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Message" }
        nextCursor:
          type: [string, "null"]
          maxLength: 512
        hasMore: { type: boolean }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: "^[A-Z0-9_]+$" }
        correlationId: { type: string }
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
  responses:
    ValidationProblem:
      description: Request or cursor validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AuthenticationProblem:
      description: Bearer authentication is missing or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AccessProblem:
      description: The actor is not eligible for this conversation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ConflictProblem:
      description: The idempotency key or moderation state conflicts with an existing command
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFoundProblem:
      description: Conversation was not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimitProblem:
      description: Bounded request rate was exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DependencyUnavailable:
      description: A required authoritative dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
