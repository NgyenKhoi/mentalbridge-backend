openapi: 3.1.0
info:
  title: MentalBridge Care system-proposed SupportPlan API design
  version: 1.0.0-policy-frozen
  description: |
    Non-executable design input for Sprint 3 Story 5101. Every path remains
    planned. This proposal supersedes the earlier Story 4101 draft that accepted
    client-supplied resourceVersions when creating a plan.

    Care owns SupportPlan proposal and lifecycle. The create request names only
    one owned SupportEvaluation. Care selects immutable template policy versions,
    resolves exact eligible content versions, fills slots, and creates the
    bounded DRAFT. The client may later choose only among alternatives returned
    for an existing slot. Safety guidance and professional-support calls to
    action are outside the SupportPlan and must be presented first.
servers:
  - url: /
tags:
  - name: SupportPlan proposal
paths:
  /api/v1/support-plans:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: proposeOwnSupportPlanDraft
      summary: Create one system-proposed draft from an owned SupportEvaluation
      description: |
        The authenticated USER supplies only the source evaluation reference.
        Care resolves compatible evaluation evidence, applies
        mb-support-plan-selection-v1, queries exact eligibility before opening a
        Care transaction, and persists at most one DRAFT. Provider uncertainty
        fails closed and commits no draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeSupportPlanRequest'
            example:
              sourceSupportEvaluationId: 20000000-0000-4000-8000-000000000101
      responses:
        '201':
          description: System-proposed draft created or identical outcome replayed
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPlan'
              examples:
                combinedDomainDraft:
                  $ref: '#/components/examples/CombinedDomainDraft'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/EvaluationNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '503': { $ref: '#/components/responses/EligibilityUnavailableProblem' }
  /api/v1/support-plans/{supportPlanId}:
    x-mentalbridge-status: planned
    get:
      tags: [SupportPlan proposal]
      operationId: getOwnSupportPlan
      summary: Reopen an owned plan with immutable proposal evidence
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Owned plan returned without a Content dependency
          headers:
            ETag:
              $ref: '#/components/headers/SupportPlanETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPlan'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
    delete:
      tags: [SupportPlan proposal]
      operationId: discardOwnSupportPlanDraft
      summary: Discard the current draft without changing another plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204': { description: Draft removed from current consideration or identical outcome replayed }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/support-plans/{supportPlanId}/choices:
    x-mentalbridge-status: planned
    put:
      tags: [SupportPlan proposal]
      operationId: replaceOwnSupportPlanDraftChoices
      summary: Replace draft choices within server-admitted slot alternatives
      description: |
        The complete desired selection is submitted only for an existing DRAFT.
        Care rejects unknown slots, removal of a core slot, a version absent from
        the slot alternatives, adjunct use in a core slot, duplicate versions,
        or more than five selected resources. It revalidates current exact
        eligibility before committing the draft update.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDraftChoicesRequest'
      responses:
        '200':
          $ref: '#/components/responses/SupportPlanCommandResult'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '503': { $ref: '#/components/responses/EligibilityUnavailableProblem' }
  /api/v1/support-plans/{supportPlanId}/activate:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: activateOwnSupportPlan
      summary: Explicitly activate a fully revalidated draft
      description: |
        Normal explicit activation applies even when safety evidence is positive;
        no safety acknowledgement field is accepted. Safety guidance and
        available immediate or professional support must already precede this
        secondary plan control. Care revalidates evaluation, templates, selected
        exact versions, eligibility roles, publication/effective state, core
        coverage, and total bounds before its local transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '503': { $ref: '#/components/responses/EligibilityUnavailableProblem' }
  /api/v1/support-plans/{supportPlanId}/pause:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: pauseOwnSupportPlan
      summary: Pause the active plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/support-plans/{supportPlanId}/resume:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: resumeOwnSupportPlan
      summary: Resume the paused plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/support-plans/{supportPlanId}/complete:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: completeOwnSupportPlan
      summary: Complete an active or paused plan without a recovery claim
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/SupportPlanCommandResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
  /api/v1/support-plans/{supportPlanId}/replace:
    x-mentalbridge-status: planned
    post:
      tags: [SupportPlan proposal]
      operationId: replaceOwnCurrentSupportPlan
      summary: Atomically supersede a current plan and activate its replacement draft
      description: |
        Care revalidates the replacement before opening the transaction. It then
        locks the user's current-plan boundary and atomically changes the source
        to SUPERSEDED and the replacement DRAFT to ACTIVE. A new evaluation never
        invokes this operation automatically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupportPlanId'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCurrentPlanRequest'
      responses:
        '200':
          description: Source superseded and replacement activated atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPlanReplacement'
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/PlanNotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/VersionProblem' }
        '503': { $ref: '#/components/responses/EligibilityUnavailableProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity-issued access token; only an authenticated USER may own a SupportPlan
  parameters:
    SupportPlanId:
      name: supportPlanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
      example: '"3"'
  headers:
    SupportPlanETag:
      description: Strong ETag containing the returned Care-owned plan version
      schema: { type: string, pattern: '^"[0-9]+"$' }
  schemas:
    ProposeSupportPlanRequest:
      type: object
      additionalProperties: false
      required: [sourceSupportEvaluationId]
      properties:
        sourceSupportEvaluationId:
          type: string
          format: uuid
          description: One immutable compatible SupportEvaluation owned by the authenticated user
    ReplaceDraftChoicesRequest:
      type: object
      additionalProperties: false
      required: [slotSelections]
      properties:
        slotSelections:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SlotSelection'
    SlotSelection:
      type: object
      additionalProperties: false
      required: [slotId, resourceId, contentVersion]
      properties:
        slotId: { type: string, minLength: 1, maxLength: 64 }
        resourceId: { type: string, format: uuid }
        contentVersion: { type: string, minLength: 1, maxLength: 128 }
    ReplaceCurrentPlanRequest:
      type: object
      additionalProperties: false
      required: [replacementSupportPlanId, replacementVersion]
      properties:
        replacementSupportPlanId: { type: string, format: uuid }
        replacementVersion: { type: integer, minimum: 0 }
    SupportPlan:
      type: object
      additionalProperties: false
      required:
        - supportPlanId
        - status
        - version
        - sourceSupportEvaluation
        - selectionPolicyVersion
        - templateFamilies
        - slots
        - selectedResourceCount
        - createdAt
        - updatedAt
      properties:
        supportPlanId: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/SupportPlanStatus'
        version: { type: integer, minimum: 0 }
        sourceSupportEvaluation:
          $ref: '#/components/schemas/SupportEvaluationEvidence'
        selectionPolicyVersion:
          type: string
          const: mb-support-plan-selection-v1
        templateFamilies:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TemplateFamilyEvidence'
        slots:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/SupportPlanSlot'
        selectedResourceCount: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activatedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        completedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        supersededAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    SupportEvaluationEvidence:
      type: object
      additionalProperties: false
      required: [supportEvaluationId, policyVersion, contributingDomains, supportTier, reasonCodes, evaluatedAt]
      properties:
        supportEvaluationId: { type: string, format: uuid }
        policyVersion: { type: string, minLength: 1, maxLength: 128 }
        contributingDomains:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScreeningDomain'
        supportTier:
          type: string
          enum: [SELF_GUIDED_SUPPORT, PROFESSIONAL_SUPPORT_RECOMMENDED, SAFETY_FOLLOW_UP_RECOMMENDED]
        reasonCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        evaluatedAt: { type: string, format: date-time }
    TemplateFamilyEvidence:
      type: object
      additionalProperties: false
      required: [family, templateVersion, targetDomain]
      properties:
        family:
          type: string
          enum:
            - DEPRESSIVE_MAINTENANCE
            - DEPRESSIVE_SELF_GUIDED
            - DEPRESSIVE_PROFESSIONAL_ADJUNCT
            - ANXIETY_MAINTENANCE
            - ANXIETY_SELF_GUIDED
            - ANXIETY_PROFESSIONAL_ADJUNCT
        templateVersion: { type: integer, minimum: 1 }
        targetDomain:
          $ref: '#/components/schemas/ScreeningDomain'
    SupportPlanSlot:
      type: object
      additionalProperties: false
      required: [slotId, kind, targetDomain, purposeCode, selectedResource, allowedAlternatives]
      properties:
        slotId: { type: string, minLength: 1, maxLength: 64 }
        kind:
          type: string
          enum: [CORE, OPTIONAL]
        targetDomain:
          $ref: '#/components/schemas/ScreeningDomain'
        purposeCode: { type: string, minLength: 1, maxLength: 128 }
        selectedResource:
          oneOf:
            - $ref: '#/components/schemas/AdmittedResourceVersion'
            - { type: 'null' }
        allowedAlternatives:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdmittedResourceVersion'
    AdmittedResourceVersion:
      type: object
      additionalProperties: false
      required: [resourceId, contentVersion, role, eligibilityPolicyVersion, eligibilityCheckedAt]
      properties:
        resourceId: { type: string, format: uuid }
        contentVersion: { type: string, minLength: 1, maxLength: 128 }
        role:
          type: string
          enum: [PRIMARY, ADJUNCT]
        eligibilityPolicyVersion: { type: string, minLength: 1, maxLength: 128 }
        eligibilityCheckedAt: { type: string, format: date-time }
    ScreeningDomain:
      type: string
      enum: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS]
    SupportPlanStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, SUPERSEDED]
    SupportPlanReplacement:
      type: object
      additionalProperties: false
      required: [supersededPlan, activeReplacement]
      properties:
        supersededPlan:
          $ref: '#/components/schemas/SupportPlan'
        activeReplacement:
          $ref: '#/components/schemas/SupportPlan'
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        correlationId: { type: string, format: uuid }
  responses:
    SupportPlanCommandResult:
      description: Updated plan or identical command outcome replayed
      headers:
        ETag:
          $ref: '#/components/headers/SupportPlanETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportPlan'
    ValidationProblem:
      description: Request or header validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: A valid Identity access token is required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: An enabled USER role is required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EvaluationNotFoundProblem:
      description: Evaluation is absent or not owned by the authenticated user
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PlanNotFoundProblem:
      description: Plan is absent or not owned by the authenticated user
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: Policy, state, idempotency, uniqueness, core coverage, or eligibility conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionProblem:
      description: If-Match or replacement version is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EligibilityUnavailableProblem:
      description: Exact resource eligibility could not be trusted; no mutation committed
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  examples:
    CombinedDomainDraft:
      value:
        supportPlanId: 20000000-0000-4000-8000-000000000301
        status: DRAFT
        version: 0
        sourceSupportEvaluation:
          supportEvaluationId: 20000000-0000-4000-8000-000000000101
          policyVersion: mb-support-evaluation-v2
          contributingDomains: [DEPRESSIVE_SYMPTOMS, ANXIETY_SYMPTOMS]
          supportTier: PROFESSIONAL_SUPPORT_RECOMMENDED
          reasonCodes: [PHQ9_MILD, GAD7_MODERATE]
          evaluatedAt: '2026-09-13T01:00:00Z'
        selectionPolicyVersion: mb-support-plan-selection-v1
        templateFamilies:
          - family: DEPRESSIVE_SELF_GUIDED
            templateVersion: 1
            targetDomain: DEPRESSIVE_SYMPTOMS
          - family: ANXIETY_PROFESSIONAL_ADJUNCT
            templateVersion: 1
            targetDomain: ANXIETY_SYMPTOMS
        slots:
          - slotId: depression-psychoeducation
            kind: CORE
            targetDomain: DEPRESSIVE_SYMPTOMS
            purposeCode: DEPRESSION_PSYCHOEDUCATION
            selectedResource:
              resourceId: 30000000-0000-4000-8000-000000000201
              contentVersion: depression-psychoeducation-01-v1
              role: PRIMARY
              eligibilityPolicyVersion: content-eligibility-v1
              eligibilityCheckedAt: '2026-09-13T01:00:01Z'
            allowedAlternatives: []
          - slotId: depression-support-activity
            kind: CORE
            targetDomain: DEPRESSIVE_SYMPTOMS
            purposeCode: DEPRESSION_SUPPORT_ACTIVITY
            selectedResource:
              resourceId: 30000000-0000-4000-8000-000000000202
              contentVersion: behavioural-activation-01-v1
              role: PRIMARY
              eligibilityPolicyVersion: content-eligibility-v1
              eligibilityCheckedAt: '2026-09-13T01:00:01Z'
            allowedAlternatives: []
          - slotId: anxiety-adjunct
            kind: OPTIONAL
            targetDomain: ANXIETY_SYMPTOMS
            purposeCode: ANXIETY_SUPPORT_ADJUNCT
            selectedResource:
              resourceId: 30000000-0000-4000-8000-000000000203
              contentVersion: breathing-basic-01-v2
              role: PRIMARY
              eligibilityPolicyVersion: content-eligibility-v1
              eligibilityCheckedAt: '2026-09-13T01:00:01Z'
            allowedAlternatives:
              - resourceId: 30000000-0000-4000-8000-000000000204
                contentVersion: mindfulness-01-v1
                role: ADJUNCT
                eligibilityPolicyVersion: content-eligibility-v1
                eligibilityCheckedAt: '2026-09-13T01:00:01Z'
        selectedResourceCount: 3
        createdAt: '2026-09-13T01:00:02Z'
        updatedAt: '2026-09-13T01:00:02Z'
        activatedAt: null
        completedAt: null
        supersededAt: null
