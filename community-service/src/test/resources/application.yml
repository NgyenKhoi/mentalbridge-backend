spring:
  datasource:
    hikari:
      data-source-properties:
        tcpKeepAlive: true
        options: -c idle_in_transaction_session_timeout=30s
  application:
    name: community-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Same as main: entity mappings must match the Liquibase schema.
      ddl-auto: validate

eureka:
  client:
    enabled: false

springdotenv:
  enabled: false
