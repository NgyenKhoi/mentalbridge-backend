databaseChangeLog:
  - changeSet:
      id: 0002-community-feed
      author: mentalbridge
      comment: Persist the owner-isolated Community feed read model for MB-574.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE community_profile (
                  id uuid PRIMARY KEY,
                  account_subject uuid NOT NULL UNIQUE,
                  display_name varchar(80) NOT NULL,
                  status varchar(16) NOT NULL,
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  version bigint NOT NULL DEFAULT 0,
                  CONSTRAINT ck_community_profile_status CHECK (status IN ('ACTIVE', 'DELETED')),
                  CONSTRAINT ck_community_profile_display_name CHECK (char_length(btrim(display_name)) BETWEEN 1 AND 80),
                  CONSTRAINT ck_community_profile_version CHECK (version >= 0)
              );

              CREATE TABLE community_post (
                  id uuid PRIMARY KEY,
                  author_profile_id uuid NOT NULL REFERENCES community_profile(id),
                  content varchar(5000) NOT NULL,
                  state varchar(24) NOT NULL,
                  comment_count integer NOT NULL DEFAULT 0,
                  reaction_count integer NOT NULL DEFAULT 0,
                  published_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  version bigint NOT NULL DEFAULT 0,
                  CONSTRAINT ck_community_post_content CHECK (char_length(btrim(content)) BETWEEN 1 AND 5000),
                  CONSTRAINT ck_community_post_state CHECK (state IN ('ACTIVE', 'OWNER_DELETED', 'MODERATION_HIDDEN', 'MODERATION_REMOVED')),
                  CONSTRAINT ck_community_post_counts CHECK (comment_count >= 0 AND reaction_count >= 0),
                  CONSTRAINT ck_community_post_version CHECK (version >= 0)
              );

              CREATE TABLE community_post_topic (
                  post_id uuid NOT NULL REFERENCES community_post(id) ON DELETE CASCADE,
                  topic_code varchar(32) NOT NULL,
                  PRIMARY KEY (post_id, topic_code),
                  CONSTRAINT ck_community_post_topic_code CHECK (topic_code IN ('MY_STORY', 'SMALL_MILESTONE', 'HELPFUL_REFLECTION', 'PEER_QUESTION', 'EXPERIENCE_SHARING', 'HELPFUL_RESOURCE'))
              );

              CREATE TABLE community_media (
                  id uuid PRIMARY KEY,
                  owner_profile_id uuid NOT NULL REFERENCES community_profile(id),
                  post_id uuid REFERENCES community_post(id) ON DELETE SET NULL,
                  media_type varchar(16) NOT NULL,
                  state varchar(16) NOT NULL,
                  delivery_url varchar(2048),
                  width integer,
                  height integer,
                  duration_seconds integer,
                  alt_text varchar(300),
                  position smallint NOT NULL DEFAULT 0,
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  version bigint NOT NULL DEFAULT 0,
                  CONSTRAINT ck_community_media_type CHECK (media_type IN ('IMAGE', 'VIDEO')),
                  CONSTRAINT ck_community_media_state CHECK (state IN ('PENDING', 'PROCESSING', 'READY', 'REJECTED', 'DELETED', 'EXPIRED')),
                  CONSTRAINT ck_community_media_delivery CHECK ((state = 'READY' AND delivery_url IS NOT NULL AND delivery_url ~ '^https://') OR (state <> 'READY' AND delivery_url IS NULL)),
                  CONSTRAINT ck_community_media_dimensions CHECK ((width IS NULL OR width > 0) AND (height IS NULL OR height > 0) AND (duration_seconds IS NULL OR duration_seconds > 0)),
                  CONSTRAINT ck_community_media_position CHECK (position BETWEEN 0 AND 9),
                  CONSTRAINT ck_community_media_version CHECK (version >= 0)
              );

              CREATE TABLE community_block (
                  blocker_profile_id uuid NOT NULL REFERENCES community_profile(id),
                  blocked_profile_id uuid NOT NULL REFERENCES community_profile(id),
                  created_at timestamptz NOT NULL,
                  PRIMARY KEY (blocker_profile_id, blocked_profile_id),
                  CONSTRAINT ck_community_block_distinct_profiles CHECK (blocker_profile_id <> blocked_profile_id)
              );

              CREATE INDEX ix_community_post_active_feed
                  ON community_post (published_at DESC, id DESC)
                  WHERE state = 'ACTIVE';
              CREATE INDEX ix_community_post_topic_filter
                  ON community_post_topic (topic_code, post_id);
              CREATE INDEX ix_community_media_post_order
                  ON community_media (post_id, position, id)
                  WHERE post_id IS NOT NULL;
              CREATE INDEX ix_community_block_reverse
                  ON community_block (blocked_profile_id, blocker_profile_id);
