databaseChangeLog:
  - changeSet:
      id: 0023-community-chat-personal-clear
      author: mentalbridge
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE community_chat_read_state
                ADD COLUMN cleared_through_sequence bigint NOT NULL DEFAULT 0,
                ADD COLUMN cleared_at timestamptz;

              ALTER TABLE community_chat_read_state
                ADD CONSTRAINT ck_chat_read_clear_sequence CHECK (cleared_through_sequence >= 0),
                ADD CONSTRAINT ck_chat_read_after_clear CHECK (last_read_sequence >= cleared_through_sequence);

              ALTER TABLE community_chat_command DROP CONSTRAINT community_chat_command_operation_check;
              ALTER TABLE community_chat_command DROP CONSTRAINT community_chat_command_result_kind_check;
              ALTER TABLE community_chat_command ADD CHECK (operation IN ('START_DIRECT','SEND_MESSAGE','CREATE_GROUP','INVITE_GROUP','REPORT_MESSAGE','CLEAR_CONVERSATION'));
              ALTER TABLE community_chat_command ADD CHECK (result_kind IN ('ACTIVE','PENDING','MESSAGE','GROUP','INVITATION','REPORT','CONVERSATION'));
