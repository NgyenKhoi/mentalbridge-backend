server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: community-service
  datasource:
    url: ${COMMUNITY_DB_URL}
    username: ${COMMUNITY_DB_USERNAME}
    password: ${COMMUNITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${COMMUNITY_LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mentalbridge:
  community:
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER}
      audience: ${IDENTITY_JWT_AUDIENCE}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
      timeout-seconds: ${CLOUDINARY_TIMEOUT_SECONDS:5}
    media:
      max-image-bytes: ${COMMUNITY_MEDIA_MAX_IMAGE_BYTES:10485760}
      max-video-bytes: ${COMMUNITY_MEDIA_MAX_VIDEO_BYTES:52428800}
      max-video-duration-seconds: ${COMMUNITY_MEDIA_MAX_VIDEO_DURATION_SECONDS:60}
      upload-intent-ttl: ${COMMUNITY_MEDIA_UPLOAD_INTENT_TTL:10m}
      orphan-retention: ${COMMUNITY_MEDIA_ORPHAN_RETENTION:24h}
      cleanup-interval: ${COMMUNITY_MEDIA_CLEANUP_INTERVAL:1h}
    interaction-relay:
      enabled: ${COMMUNITY_INTERACTION_RELAY_ENABLED:false}
      topic: mentalbridge.community.interaction.v1
      batch-size: ${COMMUNITY_INTERACTION_RELAY_BATCH_SIZE:100}
      interval: ${COMMUNITY_INTERACTION_RELAY_INTERVAL:PT5S}
      send-timeout: ${COMMUNITY_INTERACTION_RELAY_SEND_TIMEOUT:PT5S}
      retry-base: ${COMMUNITY_INTERACTION_RELAY_RETRY_BASE:PT5S}
      retry-maximum: ${COMMUNITY_INTERACTION_RELAY_RETRY_MAXIMUM:PT5M}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

springdotenv:
  ignoreIfMissing: true
  exportToSystemProperties: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
