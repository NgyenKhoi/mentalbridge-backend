spring:
  application:
    name: care-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Same as main: entity mappings must match the Liquibase schema.
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

eureka:
  client:
    enabled: false

springdotenv:
  enabled: false
