spring:
  application:
    name: care-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Same as main: entity mappings must match the Liquibase schema.
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

eureka:
  client:
    enabled: false

springdotenv:
  enabled: false

mentalbridge:
  care:
    user-notification-relay:
      enabled: false
      topic: mentalbridge.care.user-notification.v1
      batch-size: 100
      interval: PT5S
      send-timeout: PT5S
      retry-base: PT5S
      retry-maximum: PT5M
