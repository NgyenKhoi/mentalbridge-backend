spring:
  application:
    name: care-service
  datasource:
    url: ${CARE_DB_URL}
    username: ${CARE_DB_USERNAME}
    password: ${CARE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

mentalbridge:
  care:
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER}
      audience: ${IDENTITY_JWT_AUDIENCE}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY}
    assessment:
      anonymous-session-ttl: ${CARE_ANONYMOUS_SESSION_TTL}
      anonymous-session-maximum-lifetime: ${CARE_ANONYMOUS_SESSION_MAXIMUM_LIFETIME}
      phq9-safety-policy-version: ${CARE_PHQ9_SAFETY_POLICY_VERSION}
      idempotency-hmac-key: ${CARE_IDEMPOTENCY_HMAC_KEY}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

springdotenv:
  ignoreIfMissing: true
  exportToSystemProperties: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
    org.hibernate.SQL: INFO
