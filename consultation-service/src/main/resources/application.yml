spring:
  application:
    name: consultation-service
  datasource:
    url: ${CONSULTATION_DB_URL}
    username: ${CONSULTATION_DB_USERNAME}
    password: ${CONSULTATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${CONSULTATION_LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${CONSULTATION_ACCOUNT_LIFECYCLE_GROUP:consultation-account-lifecycle-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${CONSULTATION_KAFKA_LISTENER_AUTO_STARTUP:false}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          careSupportEvaluationClient:
            connect-timeout: 500
            read-timeout: 2000

mentalbridge:
  consultation:
    evidence-service-token: ${CONSULTATION_EVIDENCE_SERVICE_TOKEN}
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER}
      audience: ${IDENTITY_JWT_AUDIENCE}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY}
    availability:
      video-enabled: ${CONSULTATION_VIDEO_AVAILABILITY_ENABLED:false}
    account-lifecycle:
      enabled: ${CONSULTATION_ACCOUNT_LIFECYCLE_ENABLED:false}
      topic: ${CONSULTATION_ACCOUNT_LIFECYCLE_TOPIC:mentalbridge.identity.account-lifecycle.v1}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
