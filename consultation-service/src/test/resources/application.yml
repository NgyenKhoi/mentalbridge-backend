spring:
  application:
    name: consultation-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Same as main: entity mappings must match the Liquibase schema.
      ddl-auto: validate
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

mentalbridge:
  consultation:
    credentials:
      cloudinary:
        timeout-seconds: 5
    account-lifecycle:
      enabled: false
