spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mentalbridge:
  identity:
    notification-service-token: ${IDENTITY_NOTIFICATION_SERVICE_TOKEN:}
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER}
      audience: ${IDENTITY_JWT_AUDIENCE}
      key-id: ${IDENTITY_JWT_KEY_ID}
      private-key: ${IDENTITY_JWT_PRIVATE_KEY}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY}
    encryption:
      key-version: ${IDENTITY_ENCRYPTION_KEY_VERSION}
      key: ${IDENTITY_ENCRYPTION_KEY}
    verification-delivery:
      base-url: ${IDENTITY_BREVO_BASE_URL:https://api.brevo.com}
      api-key: ${IDENTITY_BREVO_API_KEY:}
      sender-email: ${IDENTITY_BREVO_SENDER_EMAIL:}
      sender-name: ${IDENTITY_BREVO_SENDER_NAME:MentalBridge}
      verification-url: ${IDENTITY_VERIFICATION_URL:http://localhost:3000/verify-email}
      password-recovery-url: ${IDENTITY_PASSWORD_RECOVERY_URL:http://localhost:3000/reset-password}
    outbox-relay:
      enabled: ${IDENTITY_OUTBOX_RELAY_ENABLED:false}
      topic: mentalbridge.identity.account-lifecycle.v1
      batch-size: ${IDENTITY_OUTBOX_RELAY_BATCH_SIZE:100}
      interval: ${IDENTITY_OUTBOX_RELAY_INTERVAL:PT5S}
      send-timeout: ${IDENTITY_OUTBOX_RELAY_SEND_TIMEOUT:PT5S}
      retry-base: ${IDENTITY_OUTBOX_RELAY_RETRY_BASE:PT5S}
      retry-maximum: ${IDENTITY_OUTBOX_RELAY_RETRY_MAXIMUM:PT5M}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

springdotenv:
  ignoreIfMissing: true
  exportToSystemProperties: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
    org.hibernate.SQL: INFO
