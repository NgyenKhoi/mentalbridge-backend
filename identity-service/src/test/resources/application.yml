spring:
  application:
    name: identity-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true

eureka:
  client:
    enabled: false

springdotenv:
  enabled: false

mentalbridge:
  identity:
    notification-service-token: test-notification-service-token-at-least-32-characters
    outbox-relay:
      enabled: false
      topic: mentalbridge.identity.account-lifecycle.v1
      batch-size: 100
      interval: PT5S
      send-timeout: PT5S
      retry-base: PT5S
      retry-maximum: PT5M
