spring:
  application:
    name: identity-service
  cloud:
    discovery:
      enabled: false
  liquibase:
    enabled: true
  kafka:
    consumer:
      group-id: mentalbridge.identity.audit-consumer
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

springdotenv:
  enabled: false

mentalbridge:
  identity:
    notification-service-token: test-notification-service-token-at-least-32-characters
    outbox-relay:
      enabled: false
      topic: mentalbridge.identity.account-lifecycle.v1
      batch-size: 100
      interval: PT5S
      send-timeout: PT5S
      retry-base: PT5S
      retry-maximum: PT5M
    audit-ingestion:
      enabled: true
      topic: mentalbridge.admin.audit-event.v1
    platform-reporting:
      enabled: false
