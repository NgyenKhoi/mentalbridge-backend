name: Backend quality gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify architecture and paired changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify-repository.ps1 -BaseSha $env:BASE_SHA
      - name: Validate Review 1 Compose profiles
        run: docker compose --env-file .env.compose.example --profile demo --profile full-test config --quiet

  java:
    name: Java / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, care-service, consultation-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Test and build
        working-directory: ${{ matrix.service }}
        env:
          SPRINGDOTENV_ENABLED: "false"
        run: |
          chmod +x mvnw
          ./mvnw -B test

  node:
    name: Node / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: journal-ai-service
            node-version: "22"
            integration: false
          - service: content-notification-service
            node-version: "22"
            integration: true
          - service: realtime-service
            node-version: "24"
            integration: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Format
        working-directory: ${{ matrix.service }}
        run: npm run format:check
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint
      - name: Typecheck
        working-directory: ${{ matrix.service }}
        run: npm run typecheck
      - name: Unit and HTTP tests
        working-directory: ${{ matrix.service }}
        run: npm test
      - name: Contract validation
        working-directory: ${{ matrix.service }}
        run: npm run contract:check
      - name: Migration validation
        working-directory: ${{ matrix.service }}
        run: npm run migration:check
      - name: Infrastructure integration tests
        if: matrix.integration
        working-directory: ${{ matrix.service }}
        run: npm run test:integration
      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build
  quality-gate:
    name: quality-gate
    if: always()
    needs: [repository-policy, java, node]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        if: needs.repository-policy.result != 'success' || needs.java.result != 'success' || needs.node.result != 'success'
        run: exit 1
      - name: Confirm quality gate
        run: echo "All required backend quality jobs passed."
