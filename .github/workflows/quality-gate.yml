name: Backend quality gate

on:
  pull_request:
    branches: [dev, staging]
  push:
    branches: [dev, staging]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Promotion policy
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the staging promotion source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "staging" && "$HEAD_REF" != "dev" ]]; then
            echo "Only dev may be promoted into staging."
            exit 1
          fi

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify architecture and paired changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify-repository.ps1 -BaseSha $env:BASE_SHA
      - name: Validate Review 1 Compose profiles
        run: docker compose --env-file .env.compose.example --profile demo --profile full-test config --quiet
      - name: Verify Compose service credential boundaries
        shell: pwsh
        run: ./scripts/verify-compose-service-boundaries.ps1

  java:
    name: Java / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, care-service, consultation-service, community-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Test and build
        working-directory: ${{ matrix.service }}
        env:
          SPRINGDOTENV_ENABLED: 'false'
        run: |
          chmod +x mvnw
          ./mvnw -B test

  node:
    name: Node / ${{ matrix.service }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-voice-agent
            node-version: '22'
            integration: false
            runner: ubuntu-latest
          - service: journal-ai-service
            node-version: '22'
            integration: true
            runner: ubuntu-latest
          - service: content-notification-service
            node-version: '22'
            integration: true
            runner: ubuntu-latest
          - service: realtime-service
            node-version: '24'
            integration: true
            # Pin during the ubuntu-latest migration; see
            # https://github.com/actions/runner-images/issues/14748.
            # Ubuntu 26.04/Docker 29 stops MongoDB 8 during Testcontainers startup.
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Format
        working-directory: ${{ matrix.service }}
        run: npm run format:check
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint
      - name: Typecheck
        working-directory: ${{ matrix.service }}
        run: npm run typecheck
      - name: Unit and HTTP tests
        working-directory: ${{ matrix.service }}
        run: npm test
      - name: Contract validation
        working-directory: ${{ matrix.service }}
        run: npm run contract:check
      - name: Companion Voice proposal contract tests
        if: matrix.service == 'journal-ai-service'
        working-directory: ${{ matrix.service }}
        run: node --test ../contracts/proposals/companion-voice-contract.test.mjs
      - name: Migration validation
        working-directory: ${{ matrix.service }}
        run: npm run migration:check
      - name: Infrastructure integration tests
        if: matrix.integration
        working-directory: ${{ matrix.service }}
        run: npm run test:integration
      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build
      - name: Build voice worker image without Cloud credentials
        if: matrix.service == 'ai-voice-agent'
        run: docker build -t mentalbridge-ai-voice-agent:ci ai-voice-agent
      - name: Verify packaged VAD without network or credentials
        if: matrix.service == 'ai-voice-agent'
        run: >-
          docker run --rm --network none mentalbridge-ai-voice-agent:ci
          node --input-type=module -e
          'import { VAD } from "@livekit/agents-plugin-silero"; const vad = await VAD.load({forceCPU:true}); await vad.close(); console.log("VAD_PACKAGE_OK");'

  community-notification-recovery:
    name: Cross-service / Community notification recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: community-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: content-notification-service/package-lock.json
      - name: Install and build Content/Notification
        working-directory: content-notification-service
        run: |
          npm ci
          npm run build
      - name: Verify outage recovery and replay safety
        working-directory: community-service
        env:
          SPRINGDOTENV_ENABLED: 'false'
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=CommunityNotificationRecoveryCrossServiceIT test

  user-notification-precision:
    name: Cross-service / User notification reliability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            care-service/pom.xml
            identity-service/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build Content/Notification
        working-directory: content-notification-service
        run: npm ci && npm run build
      - name: Verify timestamp delivery and Identity database recovery
        env:
          SPRINGDOTENV_ENABLED: 'false'
        run: |
          for service in care-service identity-service; do
            (cd "$service" && chmod +x mvnw && ./mvnw -B -Dtest=UserNotificationPrecisionCrossServiceIT test)
          done

  quality-gate:
    name: quality-gate
    if: always()
    needs: [promotion-policy, repository-policy, java, node, community-notification-recovery, user-notification-precision]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        if: needs.promotion-policy.result != 'success' || needs.repository-policy.result != 'success' || needs.java.result != 'success' || needs.node.result != 'success' || needs.community-notification-recovery.result != 'success' || needs.user-notification-precision.result != 'success'
        run: exit 1
      - name: Confirm quality gate
        run: echo "All required backend quality jobs passed."
