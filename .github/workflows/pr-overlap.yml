name: PR overlap check

# MB-706: advisory report of files shared with other open PRs into dev and of
# integrator-controlled shared files. It comments on the PR and never blocks merge.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  overlap:
    name: Changed-file overlap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test the overlap script
        run: node --test scripts/pr-overlap.test.mjs

      - name: Report overlap
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-overlap.mjs --pr "$PR_NUMBER" --comment
