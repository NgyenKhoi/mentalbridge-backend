name: mentalbridge-local

services:
  identity-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mentalbridge_identity
      POSTGRES_USER: mentalbridge_identity
      POSTGRES_PASSWORD: local-only-identity-password
    ports:
      - "5433:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentalbridge_identity -d mentalbridge_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  care-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mentalbridge_care
      POSTGRES_USER: mentalbridge_care
      POSTGRES_PASSWORD: local-only-care-password
    ports:
      - "5434:5432"
    volumes:
      - care-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentalbridge_care -d mentalbridge_care"]
      interval: 5s
      timeout: 5s
      retries: 10

  content-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mentalbridge_content_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-content-password
    ports:
      - "5435:5432"
    volumes:
      - content-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentalbridge_content_notification"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  identity-postgres-data:
  care-postgres-data:
  content-postgres-data:
  mongodb-data:
  redis-data:
  kafka-data:
